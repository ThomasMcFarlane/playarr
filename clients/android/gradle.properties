# Project-wide Gradle settings for the Playarr Server / Playarr Android tree.

# Speed up the daemon a bit; keep the heap modest since this is a scaffold,
# not a large app -- raise if module count grows substantially.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Run independent modules' tasks in parallel and cache task outputs.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only; no support-library fallback.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style used by IDEs opening this project.
kotlin.code.style=official

# Deliberately NOT setting org.gradle.java.home here: that path is
# machine-specific and would break CI/other developers' checkouts. Point
# JAVA_HOME at a JDK 21 (recommended) or JDK 17 install before invoking
# ./gradlew if your default `java` is not one of those -- see README.md.
