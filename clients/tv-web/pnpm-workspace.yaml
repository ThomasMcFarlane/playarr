packages:
  - "packages/*"
  - "apps/*"
  - "web"
  - "admin"

allowBuilds:
  '@firebase/util': true
  # Transitively pulled in by swagger-ui-react (via swagger-client's
  # apidom spec-resolution stack) for the admin API Explorer page.
  # Declined, not approved: apidom's tree-sitter-based multi-file/$ref
  # resolution is a code path this app never exercises (we always pass
  # SwaggerUI an already-fetched, inline spec object, never a "url" for
  # it to resolve itself), and @scarf/scarf is purely a telemetry
  # install-ping with no functional effect either way. Declining means
  # none of these scripts run at all -- confirmed the admin app still
  # builds and typechecks clean with all five declined.
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  protobufjs: true
  tree-sitter: false
  tree-sitter-json: false

# Single default catalog so every package in the workspace (libraries, TV app
# shells, and the standalone web app) shares one resolved version of core
# tooling and React. Package manifests reference these via `"catalog:"`.
catalog:
  typescript: ^5.6.3
  react: ^18.3.1
  react-dom: ^18.3.1
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  "@types/node": ^22.10.2
  vite: ^5.4.11
  "@vitejs/plugin-react": ^4.3.4
