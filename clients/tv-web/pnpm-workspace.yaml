packages:
  - "packages/*"
  - "apps/*"
  - "web"
  - "admin"

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  # Pulled in by @scalar/api-reference-react (its underlying renderer is a
  # Vue web component under a React wrapper). Unlike the swagger-ui-react
  # entries above, this one is approved: vue-demi's install script picks
  # the correct Vue 2/3 API shim to symlink, which the component actually
  # needs at runtime to render at all -- not an optional/telemetry script.
  vue-demi: true

# Single default catalog so every package in the workspace (libraries, TV app
# shells, and the standalone web app) shares one resolved version of core
# tooling and React. Package manifests reference these via `"catalog:"`.
catalog:
  typescript: ^5.6.3
  react: ^18.3.1
  react-dom: ^18.3.1
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  "@types/node": ^22.10.2
  postcss: ^8.5.19
  vite: ^5.4.11
  "@vitejs/plugin-react": ^4.3.4
  "@types/chromecast-caf-receiver": ^6.0.26
  "@types/chromecast-caf-sender": ^1.0.11
  "@types/chrome": ^0.2.2
