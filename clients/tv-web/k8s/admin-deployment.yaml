apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECT}-admin
  namespace: dev
  labels:
    app: ${PROJECT}-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${PROJECT}-admin
  template:
    metadata:
      labels:
        app: ${PROJECT}-admin
    spec:
      containers:
        - name: app
          image: localhost:5000/tv-web-admin:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
