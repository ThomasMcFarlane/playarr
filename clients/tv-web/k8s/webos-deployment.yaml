apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECT}-webos
  namespace: dev
  labels:
    app: ${PROJECT}-webos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${PROJECT}-webos
  template:
    metadata:
      labels:
        app: ${PROJECT}-webos
    spec:
      containers:
        - name: app
          image: localhost:5000/${PROJECT}:${TAG}
          imagePullPolicy: Always
          workingDir: /build/apps/tv-webos
          command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "${PORT}"]
          ports:
            - containerPort: ${PORT}
