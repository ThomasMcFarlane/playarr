<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5f4" />
    <link rel="icon" type="image/svg+xml" href="/playarr-icon.svg" />
    <link rel="manifest" href="/playarr.webmanifest" />
    <title>Playarr</title>
    <meta
      name="description"
      content="Playarr is a self-hosted media server with native apps for phones, tablets, televisions and the browser. Your library, every screen."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Playarr" />
    <meta property="og:title" content="Playarr" />
    <meta
      property="og:description"
      content="Playarr is a self-hosted media server with native apps for phones, tablets, televisions and the browser. Your library, every screen."
    />
    <meta property="og:url" content="https://playarr.app/" />
    <meta property="og:image" content="https://playarr.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Playarr play-symbol mark on a cream background, next to the words Playarr and Your library. Every screen." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Playarr" />
    <meta
      name="twitter:description"
      content="Playarr is a self-hosted media server with native apps for phones, tablets, televisions and the browser. Your library, every screen."
    />
    <meta name="twitter:image" content="https://playarr.app/og-image.png" />
    <meta name="twitter:image:alt" content="The Playarr play-symbol mark on a cream background, next to the words Playarr and Your library. Every screen." />
    <script>
      (() => {
        const stored = localStorage.getItem("playarr-theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
