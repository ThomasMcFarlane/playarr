<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Playarr</title>
  <desc id="description">Three routed media streams forming an S.</desc>
  <defs>
    <linearGradient id="surface" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211D22"/>
      <stop offset="1" stop-color="#0F0D10"/>
    </linearGradient>
    <linearGradient id="stream" x1="116" y1="116" x2="402" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6A63"/>
      <stop offset=".52" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B91F38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#surface)"/>
  <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2"/>

  <g filter="url(#shadow)">
    <path
      d="M382 126H220c-62 0-106 31-106 79 0 46 40 72 99 72h86c59 0 99 26 99 72 0 48-44 79-106 79H130"
      fill="none"
      stroke="url(#stream)"
      stroke-width="64"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M382 126H220c-62 0-106 31-106 79 0 46 40 72 99 72h86c59 0 99 26 99 72 0 48-44 79-106 79H130"
      fill="none"
      stroke="#170F13"
      stroke-opacity=".72"
      stroke-width="17"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <circle cx="382" cy="126" r="13" fill="#FFF7F2"/>
  <circle cx="130" cy="428" r="13" fill="#FFF7F2"/>
  <circle cx="256" cy="277" r="8" fill="#FFF7F2" fill-opacity=".72"/>
</svg>
