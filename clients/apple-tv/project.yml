name: PlayarrTV
options:
  bundleIdPrefix: com.playarr
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  Playarr Server:
    path: ../ios
targets:
  PlayarrTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Supporting/Assets.xcassets
      - path: Supporting/Fixtures
        buildPhase: resources
        type: folder
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Playarr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.entertainment
        NSLocalNetworkUsageDescription: Playarr connects to the Playarr Server on your network.
        NSAppTransportSecurity:
          # Self-hosted Playarr is often plain HTTP on LAN/Tailscale; local
          # networking alone does not cover Tailscale CGNAT (100.x).
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: Playarr Server
        product: PlayarrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.playarr.ios
        PRODUCT_MODULE_NAME: PlayarrTV
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  PlayarrTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
    dependencies:
      - target: PlayarrTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playarr.playarr.tvos.tests
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlayarrTV:
    build:
      targets:
        PlayarrTV: all
        PlayarrTVTests: [test]
    test:
      targets:
        - PlayarrTVTests
