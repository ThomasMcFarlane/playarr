name: Streamarr

options:
  bundleIdPrefix: com.streamarr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
  xcodeVersion: "26.0"

packages:
  StreamarrKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  StreamarrApp:
    type: application
    productName: Playarr
    platform: iOS
    sources:
      - path: Sources/StreamarrApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: StreamarrKit
        product: StreamarrKit
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/StreamarrApp.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.streamarr.ios
        PRODUCT_MODULE_NAME: StreamarrApp
        PRODUCT_NAME: Playarr
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  StreamarrKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StreamarrKitTests
    dependencies:
      - package: StreamarrKit
        product: StreamarrKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.streamarr.ios.kit-tests

  StreamarrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StreamarrAppTests
    dependencies:
      - target: StreamarrApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.streamarr.ios.app-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Playarr.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Playarr"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  StreamarrApp:
    build:
      targets:
        StreamarrApp: all
        StreamarrKitTests: [test]
        StreamarrAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StreamarrKitTests
        - StreamarrAppTests
    archive:
      config: Release
