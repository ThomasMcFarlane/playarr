name: Playarr

options:
  bundleIdPrefix: com.playarr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
  xcodeVersion: "26.0"

packages:
  PlayarrKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PlayarrApp:
    type: application
    productName: Playarr
    platform: iOS
    sources:
      - path: Sources/PlayarrApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PlayarrKit
        product: PlayarrKit
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/PlayarrApp.entitlements
        CODE_SIGN_IDENTITY: "$(PLAYARR_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: app.playarr.ios
        PROVISIONING_PROFILE_SPECIFIER: "$(PLAYARR_PROVISIONING_PROFILE)"
        PRODUCT_MODULE_NAME: PlayarrApp
        PRODUCT_NAME: Playarr
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  PlayarrKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PlayarrKitTests
    dependencies:
      - package: PlayarrKit
        product: PlayarrKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.playarr.ios.kit-tests

  PlayarrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PlayarrAppTests
    dependencies:
      - target: PlayarrApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.playarr.ios.app-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Playarr.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Playarr"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PlayarrApp:
    build:
      targets:
        PlayarrApp: all
        PlayarrKitTests: [test]
        PlayarrAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PlayarrKitTests
        - PlayarrAppTests
    archive:
      config: Release
