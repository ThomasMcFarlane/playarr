<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="t d">
<title id="t">Playarr architecture</title><desc id="d">Playarr clients talk to Playarr Server over a versioned HTTP/JSON API. The server, a single role-gated Rust binary, manages the *arr apps, a Tdarr worker pool, and SQLite or Postgres storage.</desc>
