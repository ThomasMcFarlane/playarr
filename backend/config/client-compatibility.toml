# Client version compatibility table, consumed by `streamarr-api`'s
# `version_gate` middleware (see backend/crates/streamarr-api/src/version_gate.rs)
# and served verbatim (via `streamarr-model::VersionEnvelope`) at
# `GET /api/system/version` so clients can self-check before being rejected.
#
# Schema:
#   [server]                     server's own version + API version
#   [<platform>]                 one section per streamarr_model::ClientPlatform
#                                 (kebab-case wire name — see ClientPlatform::wire_name)
#
# Android platforms (android-mobile, android-tv) gate on Android's own
# monotonic build counter, versionCode (an integer), because that's what
# Android app updates actually key off of:
#   latestVersionCode            newest published build
#   minSupportedVersionCode      floor — requests from below this are
#                                 rejected with HTTP 426 by the version-gate
#                                 middleware once its comparison logic is
#                                 implemented (it currently always passes)
#   deprecatedBelowVersionCode   floor below which clients should nag the
#                                 user to update but are still served
#   sunset                       ISO-8601 date after which
#                                 minSupportedVersionCode is expected to be
#                                 ratcheted up to deprecatedBelowVersionCode
#
# Every other platform gates on a semver-shaped version string instead:
#   latestVersion / minSupported / deprecatedBelow / sunset  (same meanings)

[server]
version = "0.1.0"
apiVersion = "1"

[android-mobile]
latestVersionCode = 100
minSupportedVersionCode = 80
deprecatedBelowVersionCode = 90
sunset = "2026-12-31"

[android-tv]
latestVersionCode = 100
minSupportedVersionCode = 80
deprecatedBelowVersionCode = 90
sunset = "2026-12-31"

[ios]
latestVersion = "1.0.0"
minSupported = "0.8.0"
deprecatedBelow = "0.9.0"
sunset = "2026-12-31"

[web]
# The web client is deployed alongside the server and rolls out
# continuously, so its floor tracks the server version closely rather than
# lagging behind app-store review time the way the native clients do.
latestVersion = "1.0.0"
minSupported = "0.9.0"
deprecatedBelow = "0.9.0"
sunset = "2026-12-31"

[tv-webos]
latestVersion = "1.0.0"
minSupported = "0.8.0"
deprecatedBelow = "0.9.0"
sunset = "2026-12-31"

[tv-tizen]
latestVersion = "1.0.0"
minSupported = "0.8.0"
deprecatedBelow = "0.9.0"
sunset = "2026-12-31"

[tv-vidaa]
# VIDAA launches the hosted Playarr Web bundle by URL, so its compatibility
# version follows that bundle rather than a separately packaged application.
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"

[cast]
# The Cast receiver is a hosted bundle served from playarr.app alongside the
# Web app, so its version tracks that bundle rather than a store release.
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"

[tv-fire]
# Fire TV's native application targets Vega OS, which is Linux-based and is
# NOT Android -- so despite "Fire TV" historically meaning Fire OS/Android,
# this platform gates on a semver string and deliberately has no
# `versionCode`. It ships as a packaged `.vpkg` installed either from the
# Amazon Appstore or sideloaded during development, so its version moves
# only when a whole new package is installed. Like the Xbox MSIX below it
# has no in-app patch path, so the floor is deliberately held at the first
# shipped version until a real update channel has actually delivered one.
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"

[xbox]
# The native Xbox application ships as a signed MSIX, so its version moves
# only when a new package is installed -- through the Microsoft Store's own
# auto-update or a Developer Mode sideload. It has no in-app patch path, so
# the floor is deliberately held at the first shipped version until a
# real update channel has actually delivered one.
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"

[harmony-mobile]
# One native ArkTS/ArkUI HAP serves phone, tablet/foldable and Huawei
# Vision TV; the two platform identities (harmony-mobile, harmony-tv) exist
# so playback sessions and this table can tell a living-room session from
# a handset one apart, even though both ship in the same package and track
# the same version.
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"

[harmony-tv]
latestVersion = "0.1.0"
minSupported = "0.1.0"
deprecatedBelow = "0.1.0"
sunset = "2026-12-31"
