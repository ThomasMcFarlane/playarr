# cargo-deny configuration for the Streamarr backend workspace.
# Run with: cargo deny check
# (requires `cargo install cargo-deny`; not invoked automatically here.)

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Fail the build on any crate whose license doesn't clear, or isn't
# expressible via SPDX at all (unlicensed).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# "Unmaintained" (RUSTSEC advisories with an `unmaintained` category) and
# multiple-versions-of-the-same-crate bloat are both worth knowing about,
# but neither should hard-fail CI on its own the way an unlicensed or
# yanked/vulnerable dependency should — treat them as a visible warning
# instead of a blocker.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
