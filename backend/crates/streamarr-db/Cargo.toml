[package]
name = "streamarr-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sqlx-based pool, embedded migrations, and repository traits for the Streamarr backend. Portable across SQLite (single-node) and Postgres (multi-node) deployments."

[dependencies]
streamarr-model = { path = "../streamarr-model" }
sqlx = { workspace = true, features = ["any"] }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# SQLite is the default so `cargo check`/`cargo test` work with zero extra
# setup for the common single-node dev/CI case; multi-node deployments (and
# their CI jobs) opt into `postgres` explicitly, and both can be enabled
# together to build a binary that supports either at runtime.
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
