[package]
name = "playarr-arr-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed HTTP clients for the *arr apps Playarr Server treats as sources of catalog/download truth: Sonarr, Radarr, Lidarr, Prowlarr, Bazarr, Readarr, Whisparr."

[dependencies]
