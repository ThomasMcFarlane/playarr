[package]
name = "playarr-backup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Encrypted, consistent server backups and staged restore for Playarr Server (SQLite)."

[dependencies]
playarr-db = { path = "../playarr-db" }
age = "0.11"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
reqwest = { workspace = true }
fs4 = "0.13"
sqlx = { workspace = true, features = ["any", "sqlite"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }
