[package]
name = "streamarr-arr-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Webhook-as-signal, poll-as-truth reconciliation between Streamarr's catalog and the configured *arr source instances."

[dependencies]
streamarr-model = { path = "../streamarr-model" }
streamarr-db = { path = "../streamarr-db" }
streamarr-coordination = { path = "../streamarr-coordination" }
streamarr-arr-client = { path = "../streamarr-arr-client" }
streamarr-artwork = { path = "../streamarr-artwork" }
streamarr-embeddings = { path = "../streamarr-embeddings" }
reqwest = { workspace = true }
tokio = { workspace = true }
# `StreamExt::buffer_unordered` -- lets the missing-media-file backfill
# (see `poller::ReconciliationPoller::backfill_missing_media_files`) have
# several *arr API requests in flight at once instead of one at a time,
# without needing to restructure the poller to spawn real `tokio::spawn`
# tasks (which would require `Arc<Self>` -- this achieves I/O concurrency
# within the poller's own already-running task instead).
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# `seasons`/`episodes`/`albums`/`tracks`/`books` don't have a repository in
# `streamarr-db` yet (see that crate's `repo::work` doc comment -- the same
# gap `streamarr-catalog` documents and works around for its *read* path);
# `crate::media_sync` is this crate's write-path counterpart, so it queries
# `DbPool` directly for just that slice too, the same way `streamarr-catalog`
# already does for reads.
sqlx = { workspace = true, features = ["any"] }

[dev-dependencies]
wiremock = "0.6"
# Test-only: opens a real in-memory SQLite `DbPool` (see `streamarr-catalog`'s
# and `streamarr-api`'s own test harnesses for the identical pattern) so
# `crate::media_sync`'s tests exercise the real `seasons`/`episodes`/
# `albums`/`tracks`/`books`/`media_files` tables through real migrations.
sqlx = { workspace = true, features = ["any", "sqlite"] }
