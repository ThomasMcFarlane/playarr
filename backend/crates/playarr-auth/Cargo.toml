[package]
name = "playarr-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Policy evaluation, JWT issuance/verification, and the RFC 8628 device authorization flow for limited-input (TV) clients."

[dependencies]
playarr-model = { path = "../playarr-model" }
playarr-db = { path = "../playarr-db" }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
# `refresh`'s in-flight rotation coalescing (`RefreshTokenService::rotate`)
# -- `tokio::sync::OnceCell` is the single-flight primitive that lets
# genuinely-concurrent callers share one rotation's result. This crate
# otherwise has no need to depend on tokio directly (its traits are
# already async via `async-trait`, run by whichever binary hosts them).
tokio = { workspace = true, features = ["sync"] }
# CIDR parsing/matching for the trusted-network trust tier (`login`).
ipnet = "2"
# IANA time zones for household schedules and budgets (`household`).
chrono-tz = "0.10"
# Refresh-token secret hashing (`refresh`) -- fast general-purpose hashing
# is deliberate here (see `secret::hash_token`'s doc comment), unlike the
# slow, salted Argon2id used for password/PIN verification below.
sha2 = "0.10"
hex = "0.4"
# `jwt`'s EdDSA mode (`docs/architecture/peer-groups.md` §5.4): a grouped
# node signs access tokens with its own Ed25519 `node_identity` keypair
# instead of the HS256 shared secret. Same version pin `playarr-api::
# peer_extractor`/`admin_peer` and `playarr-peer-sync::signing` already
# use for the identical keypair. This crate cannot depend on either of
# those (both already depend on `playarr-auth`, and `playarr-peer-sync`
# says as much in its own module doc comment), so the small seed-decode
# helper is deliberately duplicated here rather than shared -- same
# reasoning `playarr-peer-sync::signing`'s own doc comment gives for not
# sharing its `canonical_string` with `playarr-api::peer_extractor`.
ed25519-dalek = "2"
# Ed25519 keys/signatures on the wire, and this module's own manual EdDSA
# JWT encoding (`jsonwebtoken`'s `encode` requires a PKCS8-DER-wrapped key
# for EdDSA, which `node_identity.private_key` -- a raw 32-byte seed --
# is not; see `jwt.rs`'s `encode_eddsa` doc comment). Same version pin
# `playarr-api`'s own `Cargo.toml` uses.
base64 = "0.22.1"
# Password/PIN verification for the `login` module's tiers 2 and 3.
argon2 = "0.5"
# `argon2`/`password-hash` re-export `rand_core::OsRng` but don't turn on
# the feature that makes it available; declaring the same dependency
# directly with `getrandom` enabled unifies with their copy and unlocks it.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
