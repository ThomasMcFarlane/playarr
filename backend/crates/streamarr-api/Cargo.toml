[package]
name = "streamarr-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Streamarr Axum HTTP server: OpenAPI-annotated system routes, health/readiness, and the client-version-enforcement middleware."

[dependencies]
streamarr-model = { path = "../streamarr-model", features = ["openapi"] }
streamarr-config = { path = "../streamarr-config" }
streamarr-telemetry = { path = "../streamarr-telemetry" }
streamarr-db = { path = "../streamarr-db", features = ["sqlite", "postgres"] }
streamarr-cache = { path = "../streamarr-cache" }
streamarr-catalog = { path = "../streamarr-catalog" }
streamarr-artwork = { path = "../streamarr-artwork" }
streamarr-transcode = { path = "../streamarr-transcode" }
streamarr-auth = { path = "../streamarr-auth" }
streamarr-arr-sync = { path = "../streamarr-arr-sync" }
# The client side of the peer-to-peer sync protocol (signed requests, the
# join handshake, sync pollers) -- `admin_peer::join_peer_group_handler`
# delegates to `streamarr_peer_sync::enroll::join_group` rather than driving
# its own inline HTTP call, so there is exactly one implementation of
# "make a signed/token-authed request to a peer" (`docs/architecture/
# peer-groups.md` §2.6/§3.4). Correct dependency direction: `streamarr-
# peer-sync` never depends back on `streamarr-api`.
streamarr-peer-sync = { path = "../streamarr-peer-sync" }
streamarr-coordination = { path = "../streamarr-coordination" }
streamarr-arr-client = { path = "../streamarr-arr-client" }
streamarr-tdarr-client = { path = "../streamarr-tdarr-client" }
axum = { workspace = true }
futures = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true, features = ["yaml"] }
utoipa-axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
# Peer-to-peer request signing (`peer_extractor.rs`) and this node's own
# durable Ed25519 identity (`admin_peer.rs`) -- see
# `docs/architecture/peer-groups.md` §3.3. No `rand_core`/OsRng feature
# needed: keys are seeded from `Uuid::new_v4()` (OS CSPRNG-backed, same
# reasoning as `streamarr_auth::secret::opaque_token`'s own doc comment),
# not `ed25519-dalek`'s own keypair-generation helper.
ed25519-dalek = "2"
# `sha2`/`hex` for `sha256(body)` in the peer-signing canonical string --
# same version pin `streamarr-auth`'s own `secret.rs` already uses for
# refresh-token hashing.
sha2 = "0.10"
hex = "0.4"
# Base64 for Ed25519 keys/signatures on the wire -- same version pin
# `streamarr-cache` already uses for its own base64 needs.
base64 = "0.22.1"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
sqlx = { workspace = true, features = ["any", "sqlite"] }
tracing-subscriber = { workspace = true }
