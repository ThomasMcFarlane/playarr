[package]
name = "playarr-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Logging, correlation, metrics, optional OpenTelemetry export, playback analytics collection, and diagnostics endpoints for the Playarr Server backend."

[dependencies]
playarr-model = { path = "../playarr-model" }
playarr-config = { path = "../playarr-config" }
playarr-db = { path = "../playarr-db", features = ["sqlite"] }
sqlx = { workspace = true, features = ["any"] }
tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
