[package]
name = "playarr-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Playarr Server Axum HTTP server: OpenAPI-annotated system routes, health/readiness, and the client-version-enforcement middleware."

[dependencies]
playarr-model = { path = "../playarr-model", features = ["openapi"] }
playarr-config = { path = "../playarr-config" }
playarr-telemetry = { path = "../playarr-telemetry" }
playarr-db = { path = "../playarr-db", features = ["sqlite", "postgres"] }
playarr-cache = { path = "../playarr-cache" }
playarr-catalog = { path = "../playarr-catalog" }
playarr-artwork = { path = "../playarr-artwork" }
playarr-backup = { path = "../playarr-backup" }
playarr-transcode = { path = "../playarr-transcode" }
playarr-auth = { path = "../playarr-auth" }
playarr-arr-sync = { path = "../playarr-arr-sync" }
# The client side of the peer-to-peer sync protocol (signed requests, the
# join handshake, sync pollers) -- `admin_peer::join_peer_group_handler`
# delegates to `playarr_peer_sync::enroll::join_group` rather than driving
# its own inline HTTP call, so there is exactly one implementation of
# "make a signed/token-authed request to a peer" (`docs/architecture/
# peer-groups.md` §2.6/§3.4). Correct dependency direction: `playarr-
# peer-sync` never depends back on `playarr-api`.
playarr-peer-sync = { path = "../playarr-peer-sync" }
playarr-coordination = { path = "../playarr-coordination" }
playarr-arr-client = { path = "../playarr-arr-client" }
playarr-tdarr-client = { path = "../playarr-tdarr-client" }
playarr-portability = { path = "../playarr-portability" }
axum = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true, features = ["yaml"] }
utoipa-axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
# Peer-to-peer request signing (`peer_extractor.rs`) and this node's own
# durable Ed25519 identity (`admin_peer.rs`) -- see
# `docs/architecture/peer-groups.md` §3.3. No `rand_core`/OsRng feature
# needed: keys are seeded from `Uuid::new_v4()` (OS CSPRNG-backed, same
# reasoning as `playarr_auth::secret::opaque_token`'s own doc comment),
# not `ed25519-dalek`'s own keypair-generation helper.
ed25519-dalek = "2"
# `sha2`/`hex` for `sha256(body)` in the peer-signing canonical string --
# same version pin `playarr-auth`'s own `secret.rs` already uses for
# refresh-token hashing.
sha2 = "0.10"
hex = "0.4"
# Base64 for Ed25519 keys/signatures on the wire -- same version pin
# `playarr-cache` already uses for its own base64 needs.
base64 = "0.22.1"
# Seals the calendar subscription token at rest so the link can be shown again.
chacha20poly1305 = "0.10"

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
sqlx = { workspace = true, features = ["any", "sqlite"] }
tracing-subscriber = { workspace = true }
tempfile = "3"
