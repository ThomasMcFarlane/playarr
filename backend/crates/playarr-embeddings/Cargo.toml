[package]
name = "playarr-embeddings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local, CPU-only text-embedding generation for catalog 'similar items' -- a small ONNX sentence-embedding model (via fastembed), never a cloud API or a generative LLM. See Embedder's doc comment for the full rationale."

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# Pinned to the ONNX-runtime-backed, synchronous, offline-after-first-
# download local embedding runner -- see `FastEmbedEmbedder`'s doc comment.
fastembed = "5"

[dev-dependencies]
tokio = { workspace = true }
