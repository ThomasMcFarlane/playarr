[workspace]
resolver = "2"
members = [
    "crates/playarr-model",
    "crates/playarr-config",
    "crates/playarr-db",
    "crates/playarr-coordination",
    "crates/playarr-cache",
    "crates/playarr-arr-client",
    "crates/playarr-arr-sync",
    "crates/playarr-peer-sync",
    "crates/playarr-catalog",
    "crates/playarr-embeddings",
    "crates/playarr-artwork",
    "crates/playarr-tdarr-client",
    "crates/playarr-transcode",
    "crates/playarr-auth",
    "crates/playarr-telemetry",
    "crates/playarr-portability",
    "crates/playarr-api",
    "crates/playarr-backup",
]

# The workspace root manifest doubles as the `playarr-bin` package: cargo
# allows a manifest to declare both `[workspace]` and `[package]`, with the
# package's crate root resolved relative to this file (`src/main.rs`). This
# keeps the top-level binary out of `crates/` per the task's "consistent
# either way" instruction while avoiding an extra nested workspace member.
[package]
name = "playarr-bin"
version = "0.3.0"
edition = "2021"
description = "Playarr Server entrypoint: boots the API/worker roles and hosts the `playarr` CLI (update checks, etc)."
default-run = "playarr-server"
license.workspace = true

[[bin]]
name = "playarr-server"
path = "src/main.rs"

[dependencies]
playarr-model = { path = "crates/playarr-model" }
playarr-config = { path = "crates/playarr-config" }
playarr-api = { path = "crates/playarr-api" }
playarr-telemetry = { path = "crates/playarr-telemetry" }
playarr-db = { path = "crates/playarr-db" }
playarr-cache = { path = "crates/playarr-cache" }
playarr-coordination = { path = "crates/playarr-coordination" }
playarr-catalog = { path = "crates/playarr-catalog" }
playarr-transcode = { path = "crates/playarr-transcode" }
playarr-auth = { path = "crates/playarr-auth" }
playarr-arr-sync = { path = "crates/playarr-arr-sync" }
playarr-peer-sync = { path = "crates/playarr-peer-sync" }
playarr-embeddings = { path = "crates/playarr-embeddings" }
playarr-artwork = { path = "crates/playarr-artwork" }
playarr-backup = { path = "crates/playarr-backup" }
playarr-tdarr-client = { path = "crates/playarr-tdarr-client" }
axum = { workspace = true }
axum-server = { workspace = true }
rustls-acme = { version = "=0.15.3", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
futures = { workspace = true }
async-trait = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true, features = ["any", "sqlite"] }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"

[dev-dependencies]
base64 = "0.22.1"
ed25519-dalek = "2"
rcgen = "0.14"
time = "0.3"
tower = { workspace = true, features = ["util"] }

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ThomasMcFarlane/playarr"

# Centralised dependency versions so every member crate stays in lockstep.
# Individual crates opt in with `dep = { workspace = true, features = [...] }`.
[workspace.dependencies]
# --- async runtime / core ---
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# --- serde / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- error handling ---
thiserror = "1"
anyhow = "1"

# --- http client / server ---
# "stream" is needed by `playarr-api::media::proxy_response_from`
# (`docs/architecture/peer-groups.md` §5.3's `DeliveryMode::Proxy`
# passthrough): `reqwest::Response::bytes_stream()` is gated behind it.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"

# --- db ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# --- cli ---
clap = { version = "4", features = ["derive", "env"] }

# --- auth ---
jsonwebtoken = "9"

# --- caching / concurrency ---
moka = { version = "0.12", features = ["future"] }
dashmap = "6"

# --- images (artwork stage processing, thumbnails helpers) ---
# jpeg/png/webp decode+encode for server-side style presets (e.g. TV stage
# greyscale key-art). avif decode is optional; unsupported inputs fall back
# to the original bytes at the API layer when a style cannot be applied.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# --- telemetry ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = "0.26"

[workspace.lints.rust]
unused_extern_crates = "warn"

# Test speed: the suites hash PINs and passwords with Argon2id (19 MiB, 2 passes), which is
# ~100x slower unoptimised. Optimise just the hashing crates in dev/test builds; first-party
# code keeps its fast unoptimised compile and full debug assertions.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
