[workspace]
resolver = "2"
members = [
    "crates/playarr-model",
    "crates/playarr-config",
    "crates/playarr-db",
    "crates/playarr-coordination",
    "crates/playarr-cache",
    "crates/playarr-arr-client",
    "crates/playarr-arr-sync",
    "crates/playarr-peer-sync",
    "crates/playarr-catalog",
    "crates/playarr-embeddings",
    "crates/playarr-artwork",
    "crates/playarr-tdarr-client",
    "crates/playarr-transcode",
    "crates/playarr-auth",
    "crates/playarr-telemetry",
    "crates/playarr-api",
]

# The workspace root manifest doubles as the `playarr-bin` package: cargo
# allows a manifest to declare both `[workspace]` and `[package]`, with the
# package's crate root resolved relative to this file (`src/main.rs`). This
# keeps the top-level binary out of `crates/` per the task's "consistent
# either way" instruction while avoiding an extra nested workspace member.
[package]
name = "playarr-bin"
version = "0.1.0"
edition = "2021"
description = "Playarr Server entrypoint: boots the API/worker roles and hosts the `playarr` CLI (update checks, etc)."
default-run = "playarr-server"

[[bin]]
name = "playarr-server"
path = "src/main.rs"

[dependencies]
playarr-model = { path = "crates/playarr-model" }
playarr-config = { path = "crates/playarr-config" }
playarr-api = { path = "crates/playarr-api" }
playarr-telemetry = { path = "crates/playarr-telemetry" }
playarr-db = { path = "crates/playarr-db", features = ["sqlite", "postgres"] }
playarr-cache = { path = "crates/playarr-cache" }
playarr-coordination = { path = "crates/playarr-coordination" }
playarr-catalog = { path = "crates/playarr-catalog" }
playarr-transcode = { path = "crates/playarr-transcode" }
playarr-auth = { path = "crates/playarr-auth" }
playarr-arr-sync = { path = "crates/playarr-arr-sync" }
playarr-peer-sync = { path = "crates/playarr-peer-sync" }
playarr-embeddings = { path = "crates/playarr-embeddings" }
playarr-artwork = { path = "crates/playarr-artwork" }
playarr-tdarr-client = { path = "crates/playarr-tdarr-client" }
axum = { workspace = true }
axum-server = { workspace = true }
rustls-acme = { version = "=0.15.3", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
futures = { workspace = true }
async-trait = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ThomasMcFarlane/playarr"

# Centralised dependency versions so every member crate stays in lockstep.
# Individual crates opt in with `dep = { workspace = true, features = [...] }`.
[workspace.dependencies]
# --- async runtime / core ---
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# --- serde / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- error handling ---
thiserror = "1"
anyhow = "1"

# --- http client / server ---
# "stream" is needed by `playarr-api::media::proxy_response_from`
# (`docs/architecture/peer-groups.md` §5.3's `DeliveryMode::Proxy`
# passthrough): `reqwest::Response::bytes_stream()` is gated behind it.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"

# --- db ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# --- cli ---
clap = { version = "4", features = ["derive", "env"] }

# --- auth ---
jsonwebtoken = "9"

# --- caching / concurrency ---
moka = { version = "0.12", features = ["future"] }
dashmap = "6"

# --- telemetry ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = "0.26"

[workspace.lints.rust]
unused_extern_crates = "warn"
