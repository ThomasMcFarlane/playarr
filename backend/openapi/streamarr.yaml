    UpdateUserRequest:
      type: object
      description: |-
        All-optional patch body -- only fields set to `Some` are applied.
        `password`, when set, is re-hashed the same way [`CreateUserRequest`]'s
        is; `is_admin`, when set, updates the user's [`Policy`] rather than the
        `User` row itself (`is_admin` lives on `Policy`, not `User`).
      properties:
        can_stream:
          type:
          - boolean
          - 'null'
        disabled:
          type:
          - boolean
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        is_admin:
          type:
          - boolean
          - 'null'
        library_allow:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: |-
            `Some(ids)` replaces the account's entire `Policy::library_allow`
            with `ids`; `None` (the field omitted from the request body) leaves
            it untouched -- same all-optional-patch shape as every other field
            here. See [`update_user_handler`]'s doc comment for how this is
            folded into the same single conditional policy re-persist
            `is_admin`/`can_stream` already use.
        password:
          type:
          - string
          - 'null'
    UpdateWatchProgressRequest:
      type: object
      required:
      - position_ms
      - duration_ms
      properties:
        completed:
          type: boolean
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        position_ms:
          type: integer
          format: int64
          minimum: 0
    UserResponse:
      type: object
      description: |-
        The redacted, admin-facing projection of [`streamarr_model::User`] --
        same rationale as `admin.rs`'s `SourceInstanceResponse`: `User` itself
        is deliberately not `ToSchema` (it carries `password_hash`), so
        handlers map to this secret-free DTO instead. `is_admin` is pulled in
        from the user's `Policy` (see [`UserResponse::from_user`])
        since it isn't a field on `User` at all.
      required:
      - id
      - username
      - display_name
      - is_admin
      - can_stream
      - library_allow
      - disabled
      - created_at
      - preferred_audio_language
      properties:
        can_stream:
          type: boolean
          description: |-
            Whether this account is permitted to sign in to Playarr -- see
            `streamarr_model::Policy::can_stream`'s doc comment. Independent of
            `is_admin`.
        created_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `streamarr_model::Policy::library_allow`'s doc comment. Empty
            means no grants (deny-all), not all-allow; irrelevant (but still
            truthfully reported) for an `is_admin` account, since `is_admin`
            bypasses this check entirely at enforcement time.
        preferred_audio_language:
          type: string
        username:
          type: string
    VerifyProfilePinRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type: string
    VerifyProfilePinResponse:
      type: object
      required:
      - verified
      properties:
        verified:
          type: boolean
    VersionEnvelope:
      type: object
      description: Response body for `GET /api/system/version`.
      required:
      - server_version
      - api_version
      - compatibility
      properties:
        api_version:
          type: string
        build_sha:
          type:
          - string
          - 'null'
        compatibility:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityEntry'
        server_version:
          type: string
    ViewCriteriaDto:
      type: object
      properties:
        available_only:
          type: boolean
        genre:
          type:
          - string
          - 'null'
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
        release_window_days:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Only include works whose `release_date` falls within the last N
            days. `None` = no window restriction.
        source_instance_id:
          type:
          - string
          - 'null'
          format: uuid
        tag:
          type:
          - string
          - 'null'
    ViewSummary:
      type: object
      description: |-
        Public/Playarr-facing list projection -- deliberately doesn't expose
        `criteria` (Playarr never needs to interpret filter internals, only
        call `resolve`).
      required:
      - id
      - name
      - is_default
      properties:
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
    WatchProgress:
      type: object
      description: Durable resume position for one user and one media file.
      required:
      - media_file_id
      - work_id
      - position_ms
      - duration_ms
      - state
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        media_file_id:
          type: string
          format: uuid
        position_ms:
          type: integer
          format: int64
          minimum: 0
        state:
          $ref: '#/components/schemas/WatchState'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            `None` is used only for the synthetic unseen response returned when
            no durable progress row exists yet.
        work_id:
          type: string
          format: uuid
    WatchState:
      type: string
      description: The viewer-facing state derived from a durable playback position.
      enum:
      - unseen
      - part_watched
      - watched
    Work:
      type: object
      description: |-
        The aggregate root for anything in the catalog. A movie is a `Work` of
        kind `Movie` with no children; a series/artist/author is a `Work` whose
        children (seasons, albums, books) live in their own tables keyed by
        `Work::id`.
      required:
      - id
      - kind
      - external_refs
      - title
      - sort_title
      - images
      - genres
      - tags
      - added_at
      - monitored
      - availability
      properties:
        added_at:
          type: string
          format: date-time
        availability:
          $ref: '#/components/schemas/Availability'
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
        genres:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
        kind:
          $ref: '#/components/schemas/WorkKind'
        monitored:
          type: boolean
          description: |-
            Whether Streamarr should actively track/request missing children of
            this work (mirrors the *arr "monitored" concept).
        overview:
          type:
          - string
          - 'null'
        release_date:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this title was actually released, per its source *arr app
            (Radarr `digitalRelease`/`physicalRelease`, Sonarr `firstAired`) --
            distinct from `added_at` (when Streamarr itself learned about the
            work). Populated by `streamarr-arr-sync` for `Movie`/`Series`/`Site`
            kinds only; `Artist`/`Author` works have no single release date of
            their own (their children -- albums/books -- each carry one already),
            so this stays `None` for those kinds. See
            `backend/migrations/{sqlite,postgres}/00{11,14}_work_release_date.sql`.
        sort_title:
          type: string
          description: |-
            Normalized title used for alphabetical sort/browse ("Dark Knight,
            The" rather than "The Test Film").
        tags:
          type: array
          items:
            type: string
          description: |-
            Free-form user/automation tags (distinct from `genres`, which come
            from metadata providers); used by [`crate::Policy`] tag filters.
        title:
          type: string
    WorkChildrenSchema:
      oneOf:
      - type: string
        enum:
        - Movie
      - type: object
        required:
        - Series
        properties:
          Series:
            type: array
            items:
              $ref: '#/components/schemas/SeasonDetailSchema'
      - type: object
        required:
        - Artist
        properties:
          Artist:
            type: array
            items:
              $ref: '#/components/schemas/AlbumDetailSchema'
      - type: object
        required:
        - Author
        properties:
          Author:
            type: array
            items:
              $ref: '#/components/schemas/BookDetailSchema'
      description: |-
        Doc-only mirror of `streamarr_catalog::WorkChildren`; see
        [`CatalogPageSchema`].
    WorkCreditsResponse:
      type: object
      required:
      - cast
      - crew
      properties:
        cast:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
        crew:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
    WorkDetailSchema:
      type: object
      required:
      - work
      - children
      properties:
        children:
          $ref: '#/components/schemas/WorkChildrenSchema'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            The resolved `MediaFile` id for a movie's own leaf (`LeafRef::Work`);
            always `None` for series/artist/author works, whose playable leaves
            are their children instead -- see `streamarr_catalog::WorkDetail`.
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Fixed source-container runtime for a movie. Series runtimes are
            exposed on each `EpisodeDetailSchema`.
          minimum: 0
        work:
          $ref: '#/components/schemas/Work'
    WorkKind:
      type: string
      description: |-
        The top-level taxonomy Streamarr understands. Deliberately small and
        closed: everything else (season, album, book...) is a child of a `Work`
        rather than a `Work` in its own right, because those children don't have
        independent lifecycle/monitoring semantics at the top level.
      enum:
      - movie
      - series
      - site
      - artist
      - author
tags:
- name: system
  description: Process health, readiness, and version endpoints
- name: auth
  description: Session login and access-token issuance
- name: oauth
  description: RFC 8628 OAuth 2.0 device authorization endpoints
- name: webhooks
  description: '*arr webhook receiver'
- name: catalog
  description: Catalog browse/search/detail
- name: playback
  description: 'Playback negotiation: direct-play vs. transcode decision'
- name: admin
  description: 'Admin-only configuration: registering *arr source instances'
- name: users
  description: User account management and signed-in player preferences
- name: views
  description: Saved catalog filter presets ('Views') -- admin-managed, surfaced to Playarr as browsable shelves
- name: playlists
  description: User + System playlists -- named, ordered, optionally-nested lists of works
- name: credits
  description: Cast/crew for a work, and every work a given person is credited on
