          format: uuid
        monitored:
          type: boolean
        overview:
          type:
          - string
          - 'null'
        season_number:
          type: integer
          format: int32
        series_work_id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
    SeasonDetailSchema:
