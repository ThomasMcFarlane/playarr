      properties:
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeDetailSchema'
        season:
          $ref: '#/components/schemas/Season'
    SourceInstanceRequest:
      type: object
      description: |-
        Request body for registering (or re-registering, by re-POSTing with the
        same `id` you got back) a `*arr` connection. `api_key` is write-only --
        it is never echoed back in [`SourceInstanceResponse`].
      required:
      - kind
      - name
      - base_url
      - api_key
      properties:
        api_key:
          type: string
        base_url:
          type: string
        best_effort:
          type: boolean
        default_quality_profile_id:
          type:
          - integer
          - 'null'
          format: int64
        default_root_folder_id:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Omit to create a new instance (a fresh id is assigned and returned);
            set to an id from a prior response to update that same instance in
            place (e.g. to rotate its API key).
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        priority:
          type: integer
          format: int32
    SourceInstanceResponse:
      type: object
      description: |-
        The redacted, admin-facing projection of [`SourceInstance`] -- see that
        type's own doc comment for why it isn't `ToSchema`-derived directly
        (it carries the API key). `api_key` is never included, not even
        redacted-looking -- the field simply doesn't exist on the response.
      required:
      - id
      - kind
      - name
      - base_url
      - priority
      - best_effort
      properties:
        base_url:
          type: string
        best_effort:
          type: boolean
        default_quality_profile_id:
          type:
          - integer
          - 'null'
          format: int64
        default_root_folder_id:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        priority:
          type: integer
          format: int32
    SourceInstanceSyncStatusResponse:
      type: object
      description: |-
        One source instance's most recently reported reconciliation outcome --
        see `streamarr_arr_sync::SyncRunStatus`. `status`/`error`/`finished_at`
        are `None` together when no poller has reported anything for this
        instance yet (e.g. it was registered less than ~10s ago).
      required:
      - source_instance_id
      - name
      - kind
      properties:
        detail:
          type:
          - string
          - 'null'
          description: |-
            Only set when `status` is `"running"` and the poller has something
            more specific to report than "running" alone -- see
            `streamarr_arr_sync::SyncRunStatus::Running`'s doc comment (e.g. a
            large missing-media-file backfill's live "N/total" progress).
        error:
          type:
          - string
          - 'null'
          description: Only set when `status` is `"failed"`.
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        source_instance_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
          description: '`"running"` | `"succeeded"` | `"failed"`, or absent if unreported.'
    SourceKind:
      type: string
      enum:
      - sonarr
      - radarr
      - lidarr
      - bazarr
      - prowlarr
      - readarr
      - whisparr
    StopReason:
      oneOf:
      - type: string
        enum:
        - completed
      - type: string
        enum:
        - user_stopped
      - type: string
        enum:
        - error
      - type: string
        enum:
        - device_disconnected
      - type: string
        enum:
        - session_revoked
      - type: string
        enum:
        - concurrent_limit_exceeded
      - type: string
        enum:
        - idle_timeout
      - type: object
        required:
        - other
        properties:
          other:
            type: string
    TdarrConnectionRequest:
      type: object
      description: |-
        Request body for registering (or re-registering, to update in place --
        e.g. to rotate the API key) the Tdarr connection. `api_key` is
        write-only -- it is never echoed back in [`TdarrConnectionResponse`].
      required:
      - base_url
      - api_key
      properties:
        active_session_threshold:
