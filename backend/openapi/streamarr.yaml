          format: int32
        api_key:
          type: string
        base_url:
          type: string
        default_profile:
          type: string
        default_worker_limit:
          type: integer
          format: int32
        tdarr_db_id:
          type: string
        throttle_check_interval_secs:
          type: integer
          format: int64
        throttled_worker_limit:
          type: integer
          format: int32
          description: |-
            Worker limit applied while `active_session_threshold` or more
            on-demand sessions are live. Defaults to `0` -- pause background
            transcoding entirely rather than compete with live playback.
        worker_process:
          type: string
    TdarrConnectionResponse:
      type: object
      required:
      - base_url
      - tdarr_db_id
      - default_profile
      - worker_process
      - default_worker_limit
      - throttled_worker_limit
      - active_session_threshold
      - throttle_check_interval_secs
      - updated_at
      properties:
        active_session_threshold:
          type: integer
          format: int32
        base_url:
          type: string
        default_profile:
          type: string
        default_worker_limit:
          type: integer
          format: int32
        tdarr_db_id:
          type: string
        throttle_check_interval_secs:
          type: integer
          format: int64
        throttled_worker_limit:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
        worker_process:
          type: string
    TokenResponseSchema:
