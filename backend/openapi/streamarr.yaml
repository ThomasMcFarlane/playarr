            schema:
              $ref: '#/components/schemas/VerifyProfilePinRequest'
        required: true
      responses:
        '200':
          description: The profile is unlocked for switching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfilePinResponse'
        '401':
          description: The target profile is unavailable or the PIN is invalid
        '403':
          description: Caller does not have Playarr streaming access
  /api/v1/views:
    get:
      tags:
      - views
      summary: |-
        Every view, minimal projection -- the Playarr-facing shelf list. Ordered
        by [`sort_views_for_display`], identically to the admin list, so
        Playarr's shelf order always matches what the admin UI shows.
      operationId: list_views_handler
      responses:
        '200':
          description: Every view, minimal projection, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewSummary'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
  /api/v1/views/{id}/resolve:
    get:
      tags:
      - views
      summary: |-
        Runs a saved view's criteria+sort against the live catalog (via
        `CatalogService::resolve_view`) and returns a page of results, identical
        in shape to `GET /api/v1/catalog`. Also passes `viewer.allowed_libraries()`
        through, so a resolved view is silently narrowed to the caller's
        per-user library access control ceiling exactly like `GET /api/v1/
        catalog` itself is -- a saved view is just a stored `BrowseQuery` shape,
        not a separate enforcement boundary (see `CatalogService::resolve_view`'s
        doc comment).
      operationId: resolve_view_handler
      parameters:
      - name: id
        in: path
        description: View id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: A page of catalog works matching this view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageSchema'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: No view with this id
  /webhooks/{instance_id}:
    post:
      tags:
      - webhooks
      operationId: arr_webhook_handler
      parameters:
      - name: instance_id
        in: path
        description: Configured SourceInstance id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '202':
          description: Signal parsed and enqueued for the reconciliation poller
        '400':
          description: Payload has no recognizable eventType
        '404':
          description: Unknown source_instance_id
components:
  schemas:
    ActiveSessionView:
      type: object
      description: |-
        One live session, enriched (best-effort) with a human-readable user/
        media label -- the raw [`PlaybackSession`] only carries ids.
      required:
      - session_id
      - user_id
      - device_id
      - media_file_id
      - play_method
      - target_codec
      - target_container
      - client_platform
      - client_version
      - started_at
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        media_file_id:
          type: string
          format: uuid
        media_title:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `CatalogService` lookup via the media file's `work_id`;
            same "never an error" tolerance as `user_display_name`.
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        session_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        target_codec:
          type: string
        target_container:
          type: string
        user_display_name:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `UserRepo` lookup; `None` on a lookup miss/failure,
            never surfaced as an error -- a live-sessions view degrading to
            showing a bare id for one row is far better than failing the whole
            list over one bad lookup.
        user_id:
          type: string
          format: uuid
    AddPlaylistItemRequest:
      type: object
      required:
      - work_id
      properties:
        work_id:
          type: string
          format: uuid
    Album:
      type: object
      required:
      - id
      - artist_work_id
      - title
      - album_type
      - monitored
      - availability
      properties:
        album_type:
          $ref: '#/components/schemas/AlbumType'
        artist_work_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        monitored:
          type: boolean
        release_date:
          type:
          - string
          - 'null'
          format: date
        title:
          type: string
    AlbumDetailSchema:
      type: object
      required:
      - album
      - tracks
      properties:
        album:
          $ref: '#/components/schemas/Album'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackDetailSchema'
    AlbumType:
      type: string
      enum:
      - studio
      - live
      - compilation
      - ep
      - single
      - soundtrack
    Availability:
      type: string
      description: |-
        Where in the availability pipeline a `Work` (or a leaf under it) is
        sitting. This intentionally mirrors the *arr apps' own state machine
        (queued/downloading/imported) but is normalized into one shared enum so
        catalog and playback code doesn't need to know which *arr produced it.
      enum:
      - unknown
      - pending
      - processing
      - partially_available
      - available
      - deleted
    AvailableProfileResponse:
      type: object
      description: |-
        Minimal household-profile projection for Playarr's 'who is watching'
        screen. Password hashes, email addresses and policy details are never
        exposed.
      required:
      - id
      - username
      - display_name
      - is_current
      - pin_locked
      properties:
        display_name:
          type: string
        id:
          type: string
          format: uuid
        is_current:
          type: boolean
        pin_locked:
          type: boolean
        username:
          type: string
    Book:
      type: object
      required:
      - id
      - author_work_id
      - title
      - monitored
      - availability
      properties:
        author_work_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        isbn:
          type:
          - string
          - 'null'
        monitored:
          type: boolean
        release_date:
          type:
          - string
          - 'null'
          format: date
        series_name:
          type:
          - string
          - 'null'
        series_position:
          type:
          - number
          - 'null'
          format: float
        title:
          type: string
    BookDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::BookDetail`; see
        [`EpisodeDetailSchema`].
      required:
      - book
      properties:
        book:
          $ref: '#/components/schemas/Book'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
    CatalogPageSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::CatalogPage` -- see
        `catalog::CatalogPageSchema`'s own doc comment for why this can't just
        derive `ToSchema` on the real type.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        total:
          type:
          - integer
          - 'null'
          format: int64
    ClientPlatform:
      type: string
      description: |-
        Every first-party client surface Streamarr ships. Kept as a closed enum
        (rather than a free-form string) so the compatibility table, the
        `X-Streamarr-Client-Platform` header parser, and policy's
        `device_allow` list all agree on the same finite set.

        `StreamarrAdmin` is the odd one out: every other variant is a Playarr
        client (consumer streaming), but Streamarr's own admin UI is also a
        real first-party client surface that authenticates through the same
        `POST /api/v1/auth/login` endpoint, and `login_handler` needs a real,
        honest way to tell the two apart so it knows whether to require
        `Policy::can_stream` for this login attempt -- see that handler's doc
        comment. Declaring `client_platform: "streamarr-admin"` doesn't grant
        anything by itself (a caller can claim whatever platform it wants); it
        only selects which check `login_handler` applies, and every *other*
        endpoint still separately enforces the real, persisted `Policy`
        regardless of what a login request once claimed.
      enum:
      - android-mobile
      - android-tv
      - ios
      - web
      - tv-webos
      - tv-tizen
      - tv-vidaa
      - streamarr-admin
    CompatibilityEntry:
      type: object
      description: |-
        One platform's row in the compatibility table: what the latest client
        build is, the floor below which the version-gate middleware rejects
        requests outright, and the floor below which it should nag-but-allow.
      required:
      - platform
      - latest_version
      - min_supported_version
      properties:
        deprecated_below:
          type:
          - string
          - 'null'
        latest_version:
          type: string
        min_supported_version:
          type: string
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        sunset:
          type:
          - string
          - 'null'
          description: |-
            RFC 3339 timestamp after which `min_supported_version` will be
            ratcheted up; surfaced to clients so they can warn users ahead of
            time rather than being cut off with no notice.
    CreatePlaylistRequest:
      type: object
      required:
      - name
      properties:
        is_system:
          type: boolean
          description: |-
            Requires [`AdminUser`] when `true` -- a non-admin caller setting
            this is rejected with `403`, not silently downgraded to a personal
            playlist, so a client bug never creates the wrong kind of playlist
            unnoticed.
        name:
          type: string
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `Some(id)` nests this playlist under an existing one the caller can
            already write to (e.g. "Sample Movie Golf" under "MCU") -- checked in
            [`create_playlist_handler`], not structurally enforced here.
    CreateUserRequest:
      type: object
      description: |-
        Request body for provisioning a new account. `password` is write-only
        -- it is hashed via `streamarr_auth::login::hash_password` immediately
        and never echoed back in [`UserResponse`].
      required:
      - username
      - display_name
      - password
      properties:
        can_stream:
          type: boolean
          description: |-
            Grants Playarr streaming access -- see `streamarr_model::Policy::
            can_stream`'s doc comment. Independent of `is_admin`; defaults to
            `false` (least privilege), same as every other grant this handler
            starts a new account with.
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `streamarr_model::Policy::library_allow`'s doc comment. Defaults
            to empty (no grants yet, deny-all -- not all-allow), same
            least-privilege-by-default philosophy as `is_admin`/`can_stream`
            above: an admin still has to explicitly grant library access after
            creating the account.
        password:
          type: string
        username:
          type: string
    CreditResponse:
      type: object
      description: |-
        One credit, with its [`Person`] flattened in -- a caller displaying a
        cast/crew list wants the name/headshot right there, not a second
        round trip per credit.
      required:
      - id
      - person
      properties:
        character:
          type:
          - string
          - 'null'
          description: The character played. Present only on a cast credit.
        department:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        id:
          type: string
          format: uuid
        job:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        person:
          $ref: '#/components/schemas/PersonResponse'
    DeviceCodeRequest:
      type: object
      required:
      - client_platform
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
    DeviceCodeResponseSchema:
      type: object
      description: |-
        Doc-only mirror of [`DeviceCodeResponse`] (that type has no `ToSchema`;
        handlers still return it directly, serialized for real).
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - expires_in
      - interval
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
          format: int64
        interval:
          type: integer
          format: int64
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
    DeviceTokenRequest:
      type: object
      required:
      - grant_type
      - device_code
      properties:
        device_code:
          type: string
        grant_type:
          type: string
          description: |-
            Must be [`DEVICE_CODE_GRANT_TYPE`] -- any other value is rejected
            with `unsupported_grant_type` before the device code is even looked
            up, per RFC 6749 §5.2.
    Episode:
      type: object
      required:
      - id
      - season_id
      - episode_number
      - images
      - monitored
      - availability
      properties:
        air_date:
          type:
          - string
          - 'null'
          format: date
        availability:
          $ref: '#/components/schemas/Availability'
        episode_number:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
          description: Remote-hosted episode stills, normally [`crate::ImageKind::Thumb`].
        monitored:
          type: boolean
        overview:
          type:
          - string
          - 'null'
        runtime_minutes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        season_id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
    EpisodeDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::EpisodeDetail` -- the resolved
        `MediaFile` id (via `MediaFileRepo::find_by_leaf`) that plays this
        episode, `None` when no file has synced for it yet.
      required:
      - episode
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ExternalProvider:
      oneOf:
      - type: string
        enum:
        - tmdb
      - type: string
        enum:
        - tvdb
      - type: string
        enum:
        - imdb
      - type: string
        enum:
        - music_brainz_artist
      - type: string
        enum:
        - music_brainz_release_group
      - type: string
        enum:
        - goodreads
      - type: string
        enum:
        - isbn
      - type: string
        enum:
        - asin
      - type: string
        description: |-
          ThePornDB -- Whisparr's own metadata provider, structurally the same
          role for Whisparr's studio/scene catalog that `Tvdb` plays for
          Sonarr's. Given a first-class variant (rather than falling back to
          `Other`) for the same reason every other Work-owning source has one:
          `streamarr-arr-sync::arr_client::work_kind_and_provider` needs a
          stable, matchable discriminant to key `Work::external_refs` lookups
          on, and every source kind that owns `Work` rows gets one.
        enum:
        - tpdb
      - type: object
        description: |-
          Escape hatch for providers we don't have a first-class variant for
          yet (e.g. AniDB, Discogs) without needing a migration to add one.
        required:
        - other
        properties:
          other:
            type: string
            description: |-
              Escape hatch for providers we don't have a first-class variant for
              yet (e.g. AniDB, Discogs) without needing a migration to add one.
      description: |-
        A cross-reference to the identifier this `Work` (or one of its source
        records) is known by in an external catalog/metadata provider.
    ExternalRef:
      type: object
      required:
      - provider
      - external_id
      properties:
        external_id:
          type: string
        provider:
          $ref: '#/components/schemas/ExternalProvider'
    ImageAsset:
      type: object
      required:
      - kind
      - url
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        kind:
          $ref: '#/components/schemas/ImageKind'
        url:
          type: string
        width:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ImageKind:
      type: string
      enum:
      - poster
      - backdrop
      - banner
      - logo
      - thumb
    LibraryViewRequest:
      type: object
      description: |-
        Request body for both create (`POST /api/v1/admin/views`) and update
        (`PUT /api/v1/admin/views/{id}`). Structurally has no `is_default`/
        `default_order` fields, so an admin can never set them through this
        endpoint -- enforced by omission, not a runtime check (see
        [`create_view_handler`]/[`update_view_handler`]'s doc comments).
      required:
      - name
      - criteria
      properties:
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: |-
            Ordered, most-significant first -- each element one of `"title"` |
            `"title_desc"` | `"recent"` | `"oldest"` | `"released"` |
            `"last_played"`, same free-string convention as
            `catalog::BrowseQueryParams::sort`, not a typed enum on the wire.
            Empty/omitted defaults to `["title"]`. `"last_played"` orders by
            *each resolving viewer's own* last-played time (see
            `streamarr_model::ViewSort::LastPlayedByUser`'s doc comment) --
            picking it here means every caller who resolves this view sees it
            personalized to them, not a single shared order.
    LibraryViewResponse:
      type: object
      required:
      - id
      - name
      - criteria
      - sort
      - is_default
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: Same ordered, most-significant-first string list `LibraryViewRequest::sort` accepts.
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - device_id
      - device_name
      - client_platform
      - client_version
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
          description: |-
            Client-generated, stable-per-install device id -- the same id the
            caller should resend on every subsequent login/refresh from this
            install, so `Policy::device_allow`/`max_concurrent_sessions` reason
            about one `Device`, not a fresh one per login.
        device_name:
          type: string
        password:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        profile_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`AuthMode::ManagedProfiles` only; ignored by every other tier.'
        username:
          type:
          - string
          - 'null'
          description: '`AuthMode::FullAccount` only; ignored by every other tier.'
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    MediaChapter:
      type: object
      description: |-
        One real chapter embedded in a media container, as reported by ffprobe.
        Untitled chapters remain untitled rather than receiving a fabricated
        name; Playarr can display their real start time as the label.
      required:
      - index
      - start_ms
      properties:
        end_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        index:
          type: integer
          format: int32
          minimum: 0
        start_ms:
          type: integer
          format: int64
          minimum: 0
        title:
          type:
          - string
          - 'null'
    MediaMetadata:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
    MediaPlaybackOptionsResponse:
      type: object
      required:
      - quality_options
      - audio_tracks
      - subtitle_tracks
      - preferences
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
        preferences:
          $ref: '#/components/schemas/MediaPlaybackPreferenceResponse'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
    MediaPlaybackPreferenceResponse:
      type: object
      required:
      - quality_id
      properties:
        audio_track_id:
          type:
          - string
          - 'null'
        quality_id:
          type: string
        subtitle_track_id:
          type:
          - string
          - 'null'
    OAuthErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: |-
            One of RFC 8628 §3.5's four device-flow error codes, or RFC 6749
            §5.2's `unsupported_grant_type`.
    PersonResponse:
      type: object
      required:
      - id
      - name
      properties:
        headshot_url:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
    PlayMethod:
      type: string
      enum:
      - direct_play
      - direct_stream
      - transcode
    PlaybackAudioTrackOption:
      type: object
      required:
      - id
      - stream_index
      - label
      - is_default
      properties:
        channels:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        codec:
          type:
          - string
          - 'null'
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        language:
          type:
          - string
          - 'null'
        stream_index:
          type: integer
          format: int32
          minimum: 0
    PlaybackEventKind:
      oneOf:
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - start
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - pause
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - resume
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - from_ms
        - to_ms
        - kind
        properties:
          from_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - seek
          to_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - buffer_start
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - duration_ms
        - kind
        properties:
          duration_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - buffer_end
      - type: object
        required:
        - to_bps
        - kind
        properties:
          from_bps:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - bitrate_change
          to_bps:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          bytes_streamed_total:
            type:
            - integer
            - 'null'
            format: int64
            description: |-
              The client's own cumulative bytes-received counter for this
              session (e.g. from the `<video>` element / Shaka Player's
              network stats), if it's cheap for the client to report. `None`
              means the client isn't reporting this yet -- `bytes_streamed`
              on the session simply stays at whatever it last was (usually
              `0`) rather than being fabricated. See
              `streamarr_telemetry::analytics::collector`'s module doc
              comment for how this is applied.
            minimum: 0
          kind:
            type: string
            enum:
            - heartbeat
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - reason
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - stop
          position_ms:
            type: integer
            format: int64
            minimum: 0
          reason:
            $ref: '#/components/schemas/StopReason'
      - type: object
        required:
        - message
        - kind
        properties:
          kind:
            type: string
            enum:
            - error
          message:
            type: string
      description: |-
        A single timestamped occurrence within a [`PlaybackSession`]. Kept as a
        tagged enum rather than a generic `{kind: String, payload: Value}` bag
        so the analytics rollup code (`streamarr-telemetry::analytics::rollup`)
        can exhaustively match every event type the compiler knows about.
    PlaybackInfoResponse:
      type: object
      description: |-
        TODO(streaming): `url` today is a well-known, stable path convention
        (`/api/v1/media/{media_file_id}/stream` for direct-play,
        `/api/v1/media/renditions/{rendition_id}/playlist.m3u8` for a ready
        rendition, `/api/v1/media/sessions/{session_id}/playlist.m3u8` for a
        freshly spawned on-demand session) rather than a route this crate
        actually serves yet -- implementing byte-range/HLS-segment serving at
        those paths is out of this endpoint's scope (this endpoint only makes
        the direct-play/existing-rendition/on-demand-transcode *decision*).
      required:
      - mode
      - url
      - mime_type
      - duration_ms
      - source_offset_ms
      - audio_tracks
      - subtitle_tracks
      - quality_options
      - selected_quality_id
      - session_id
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
          description: |-
            Source-container audio streams. For on-demand HLS, choosing one
            creates a replacement session that maps this exact stream.
        duration_ms:
          type: integer
          format: int64
          description: |-
            Fixed runtime read from the source media container with ffprobe.
            Zero means probing failed; clients may then fall back to their
            playback engine's duration without failing negotiation.
          minimum: 0
        mime_type:
          type: string
          description: MIME type for the direct media file or adaptive manifest in `url`.
        mode:
          $ref: '#/components/schemas/PlaybackMode'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
          description: |-
            The server-owned quality ladder. Original is always first and is
            the default when the request does not explicitly force a profile.
        selected_audio_track_id:
          type:
          - string
          - 'null'
        selected_quality_id:
          type: string
          description: The option represented by this URL.
        selected_subtitle_track_id:
          type:
          - string
          - 'null'
        session_id:
          type: string
          format: uuid
          description: |-
            The freshly-created [`PlaybackSession`] id -- the client uses this
            for every subsequent `POST .../sessions/{session_id}/events` call
            (heartbeats, buffering, stop). Session creation piggybacks on this
            endpoint entirely: `device_id` comes from the caller's JWT and
            `client_platform`/`client_version` from headers the client already
            sends on every request, so no separate "start session" call is
            needed -- see [`record_playback_event_handler`]'s doc comment.
        source_offset_ms:
          type: integer
          format: int64
          description: |-
            Absolute source timestamp represented by time zero in `url`.
            Non-zero only for a freshly-created on-demand HLS session started
            part-way through the source.
          minimum: 0
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
          description: |-
            Supported embedded text subtitles, exposed as authenticated WebVTT
            sidecars. Bitmap subtitle codecs are deliberately omitted.
        url:
          type: string
    PlaybackMode:
      type: string
      enum:
      - direct
      - hls
    PlaybackQualityOption:
      type: object
      description: |-
        One quality the server can genuinely deliver through its current
        playback/transcode implementation.
      required:
      - id
      - label
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
          description: Target picture height for a rendition. Original is source-defined.
          minimum: 0
        id:
          type: string
          description: |-
            Stable selector. `"original"` means normal uncapped negotiation;
            profile qualities use their real rendition profile name.
        label:
          type: string
        profile:
          type:
          - string
          - 'null'
          description: |-
            `None` for Original; otherwise the exact profile accepted by this
            endpoint's `profile` query parameter.
        video_bitrate_bps:
          type:
          - integer
          - 'null'
          format: int64
          description: Target video bitrate for a rendition. Original is source-defined.
          minimum: 0
    PlaybackSession:
      type: object
      description: |-
        One playback attempt from start to finish. Written incrementally: a row
        is inserted at playback start and updated (`ended_at`, `stop_reason`,
        aggregate buffering counters) as the session progresses and closes.
      required:
      - id
      - user_id
      - device_id
      - media_file_id
      - started_at
      - play_method
      - source_codec
      - source_container
      - target_codec
      - target_container
      - client_platform
      - client_version
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        media_file_id:
          type: string
          format: uuid
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        rendition_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Set only when `play_method == Transcode` and an existing
            [`crate::Rendition`] served the session (as opposed to a
            short-lived on-demand transcode with no durable rendition record).
        source_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        source_codec:
          type: string
        source_container:
          type: string
        started_at:
          type: string
          format: date-time
        stop_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StopReason'
        target_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        target_codec:
          type: string
          description: |-
            The codec/container/bitrate actually delivered to the client;
            equal to the source fields for `DirectPlay`.
        target_container:
          type: string
        transcode_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TranscodeReason'
        user_id:
          type: string
          format: uuid
    PlaybackSubtitleTrackOption:
      type: object
      required:
      - id
      - stream_index
      - label
      - codec
      - is_default
      - forced
      - url
      properties:
        codec:
          type: string
        forced:
          type: boolean
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        language:
          type:
          - string
          - 'null'
        stream_index:
          type: integer
          format: int32
          minimum: 0
        url:
          type: string
          description: Authenticated WebVTT sidecar aligned to this playback URL's timeline.
    PlayerPreferencesResponse:
      type: object
      required:
      - preferred_audio_language
      properties:
        preferred_audio_language:
          type: string
    PlaylistItemResponse:
      type: object
      required:
      - id
      - playlist_id
      - work_id
      - position
      - added_at
      properties:
        added_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        playlist_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        work_id:
          type: string
          format: uuid
    PlaylistResponse:
      type: object
      required:
      - id
      - name
      - is_system
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        is_system:
          type: boolean
          description: |-
            `true` for a System (admin-managed, globally visible) playlist,
            `false` for a personal one.
        name:
          type: string
        owner_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `None` for a System playlist. Present (including for a personal
            playlist that isn't the caller's own) only on the admin
            "view everything" listing ([`list_admin_playlists_handler`]) -- the
            ordinary [`list_playlists_handler`]/[`get_playlist_handler`]
            responses a non-admin caller sees also carry this, but a caller
            only ever gets back playlists they can already read (their own +
            System, see [`can_read`]), so it's never a stranger's id in
            practice for them.
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
    ProfilePinSettingResponse:
      type: object
      required:
      - pin_locked
      properties:
        pin_locked:
          type: boolean
    RefreshRequest:
      type: object
      required:
      - device_id
      - refresh_token
      properties:
        device_id:
          type: string
          format: uuid
          description: |-
            Same `device_id` the original `POST /api/v1/auth/login` (or RFC
            8628 device-flow) call used -- `RefreshTokenService` keys its store
            by device, not by the opaque token value alone.
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
          description: |-
            Rotated -- a new refresh token, not the one presented. The caller
            must persist this and discard the old one; presenting the old one
            again is treated as reuse (see `RefreshTokenService::rotate`'s doc
            comment) and revokes the whole token family.
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    ReorderPlaylistItemsRequest:
      type: object
      required:
      - item_ids
      properties:
        item_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Every item id currently on this playlist, in the desired new order.
            An id that isn't actually one of this playlist's items is silently
            ignored -- see `PlaylistRepo::reorder_items`'s own doc comment.
    Season:
      type: object
      required:
      - id
      - series_work_id
      - season_number
      - monitored
      - availability
      properties:
