                $ref: '#/components/schemas/PlayerPreferencesResponse'
              example:
                preferred_audio_language: es
        '400':
          description: Invalid preferred audio language
        '401':
          description: Missing or invalid access token
        '404':
          description: The signed-in user no longer exists
      security:
      - bearer_auth: []
  /api/v1/users/me/profile-avatar:
    get:
      tags:
      - users
      operationId: get_profile_avatar_handler
      responses:
        '200':
          description: The signed-in user's cross-device avatar preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatarSettingResponse'
              example:
                preference:
                  kind: preset
                  value: astronaut
        '401':
          description: Missing or invalid access token
        '404':
          description: The signed-in user no longer exists
      security:
      - bearer_auth: []
    put:
      tags:
      - users
      operationId: update_profile_avatar_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileAvatarRequest'
            example:
              preference:
                kind: preset
                value: astronaut
        required: true
      responses:
        '200':
          description: Updated cross-device avatar preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAvatarSettingResponse'
              example:
                preference:
                  kind: preset
                  value: astronaut
        '400':
          description: Invalid preset or custom photo data
        '401':
          description: Missing or invalid access token
        '404':
          description: The signed-in user no longer exists
      security:
      - bearer_auth: []
  /api/v1/users/me/profile-pin:
    get:
      tags:
      - users
      operationId: get_profile_pin_setting_handler
      responses:
        '200':
          description: The signed-in user's profile PIN setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePinSettingResponse'
              example:
                pin_locked: true
        '401':
          description: Missing or invalid access token
      security:
      - bearer_auth: []
    patch:
      tags:
      - users
      operationId: update_profile_pin_setting_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfilePinRequest'
            example:
              pin: '4821'
        required: true
      responses:
        '200':
          description: Updated profile PIN setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePinSettingResponse'
              example:
                pin_locked: true
        '400':
          description: PIN is not exactly four decimal digits
        '401':
          description: Missing or invalid access token
        '404':
          description: The signed-in user no longer exists
      security:
      - bearer_auth: []
  /api/v1/users/me/push-registrations:
    post:
      tags:
      - users
      operationId: register_push_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushRequest'
            example:
              platform: web
              token: firebase-installation-id
        required: true
      responses:
        '204':
          description: Push registration saved
        '400':
          description: Unsupported platform or invalid token
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
      security:
      - bearer_auth: []
  /api/v1/users/me/user-invite-request:
    get:
      tags:
      - users
      summary: |-
        Returns the signed-in user's most recent request, or `null` before they
        have requested permission.
      operationId: get_my_user_invite_request_handler
      responses:
        '200':
          description: Latest invitation request, if any
          content:
            application/json:
              schema:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserInviteRequestResponse'
              example:
                can_stream: true
                display_name: Alice Nguyen
                generated_at: null
                id: 33333333-3333-4333-8333-333333333333
                library_allow:
                - 11111111-1111-4111-8111-111111111111
                message: Can I invite my roommate?
                requested_at: 2026-07-20T12:00:00Z
                reviewed_at: 2026-07-20T13:00:00Z
                status: approved
                user_id: 22222222-2222-4222-8222-222222222222
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      summary: |-
        Opens (or returns) the signed-in user's current invitation request. A
        pending or approved request remains the one active request; denied and
        generated requests may be followed by a new request.
      operationId: create_user_invite_request_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInviteRequest'
            example:
              message: Can I invite my roommate?
        required: true
      responses:
        '200':
          description: Current invitation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteRequestResponse'
              example:
                can_stream: true
                display_name: Alice Nguyen
                generated_at: null
                id: 33333333-3333-4333-8333-333333333333
                library_allow: []
                message: Can I invite my roommate?
                requested_at: 2026-07-20T12:00:00Z
                reviewed_at: null
                status: pending
                user_id: 22222222-2222-4222-8222-222222222222
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
      security:
      - bearer_auth: []
  /api/v1/users/me/user-invite-request/generate:
    post:
      tags:
      - users
      summary: |-
        Consumes one approval and creates the final one-use invitation. Its
        24-hour lifetime begins here, not when the administrator approved it.
      operationId: generate_user_invite_handler
      responses:
        '200':
          description: Friend invitation generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteResponse'
              example:
                expires_at: 2026-07-21T13:00:00Z
                invite_token: 9c1e2b3d4f6a8c1e2b3d4f6a8c1e2b3d
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
        '409':
          description: No unused approval is available
      security:
      - bearer_auth: []
  /api/v1/users/profiles:
    get:
      tags:
      - users
      operationId: list_available_profiles_handler
      responses:
        '200':
          description: Enabled Playarr profiles available on this server
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableProfileResponse'
              example:
              - display_name: Alice Nguyen
                id: 22222222-2222-4222-8222-222222222222
                is_current: true
                pin_locked: false
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller does not have Playarr streaming access
      security:
      - bearer_auth: []
  /api/v1/users/profiles/{id}/verify-pin:
    post:
      tags:
      - users
      operationId: verify_profile_pin_handler
      parameters:
      - name: id
        in: path
        description: Profile user id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyProfilePinRequest'
            example:
              pin: '4821'
        required: true
      responses:
        '200':
          description: The profile is unlocked for switching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfilePinResponse'
              example:
                verified: true
        '401':
          description: The target profile is unavailable or the PIN is invalid
        '403':
          description: Caller does not have Playarr streaming access
      security:
      - bearer_auth: []
  /api/v1/views:
    get:
      tags:
      - views
      summary: |-
        Every view, minimal projection -- the Playarr-facing shelf list. Ordered
        by [`sort_views_for_display`], identically to the admin list, so
        Playarr's shelf order always matches what the admin UI shows.
      operationId: list_views_handler
      responses:
        '200':
          description: Every view, minimal projection, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewSummary'
              example:
              - default_order: 0
                id: 8f14e45f-ceea-467e-adc0-8b95e6b0a0f1
                is_default: true
                name: Newly Added
              - default_order: 1
                id: 0c85e0f1-9c6e-4b3a-9a6b-4a1f2e9c7d3b
                is_default: true
                name: Newly Released
              - default_order: null
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                is_default: false
                name: Newly Added Action
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
      security:
      - bearer_auth: []
  /api/v1/views/{id}/resolve:
    get:
      tags:
      - views
      summary: |-
        Runs a saved view's criteria+sort against the live catalog (via
        `CatalogService::resolve_view`) and returns a page of results, identical
        in shape to `GET /api/v1/catalog`. Also passes `viewer.allowed_libraries()`
        through, so a resolved view is silently narrowed to the caller's
        per-user library access control ceiling exactly like `GET /api/v1/
        catalog` itself is -- a saved view is just a stored `BrowseQuery` shape,
        not a separate enforcement boundary (see `CatalogService::resolve_view`'s
        doc comment).
      operationId: resolve_view_handler
      parameters:
      - name: id
        in: path
        description: View id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: A page of catalog works matching this view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageSchema'
              example:
                items:
                - added_at: 2026-01-10T08:30:00Z
                  availability: available
                  external_refs:
                  - external_id: '603'
                    provider: tmdb
                  genres:
                  - Action
                  - Science Fiction
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  images:
                  - height: 750
                    kind: poster
                    url: https://image.tmdb.org/t/p/original/poster.jpg
                    width: 500
                  kind: movie
                  monitored: true
                  overview: A computer hacker learns about the true nature of reality.
                  release_date: 1999-03-31T00:00:00Z
                  sort_title: Matrix, The
                  tags: []
                  title: Sample Movie Kilo
                total: 1
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: No view with this id
      security:
      - bearer_auth: []
  /webhooks/{instance_id}:
    post:
      tags:
      - webhooks
      operationId: arr_webhook_handler
      parameters:
      - name: instance_id
        in: path
        description: Configured SourceInstance id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
            example:
              eventType: SeriesAdd
              series:
                id: 42
                title: Test Series T
                tvdbId: 275908
        required: true
      responses:
        '202':
          description: Signal parsed and enqueued for the reconciliation poller
        '400':
          description: Payload has no recognizable eventType
        '404':
          description: Unknown source_instance_id
components:
  schemas:
    ActiveSessionView:
      type: object
      description: |-
        One live session, enriched with the labels and route target used by the
        administrator Activity and Tasks pages.
      required:
      - session_id
      - user_id
      - device_id
      - media_file_id
      - play_method
      - target_codec
      - target_container
      - client_platform
      - client_version
      - started_at
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        media_file_id:
          type: string
          format: uuid
        media_title:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `CatalogService` lookup. For child media, this names the
            actual episode, track, or book rather than only its parent work.
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        session_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        target_codec:
          type: string
        target_container:
          type: string
        user_display_name:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `UserRepo` lookup; `None` on a lookup miss/failure,
            never surfaced as an error -- a live-sessions view degrading to
            showing a bare id for one row is far better than failing the whole
            list over one bad lookup.
        user_id:
          type: string
          format: uuid
        work_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Best-effort media-file lookup; provides the route target for the
            linked item title in Streamarr Admin.
    AddPlaylistItemRequest:
      type: object
      required:
      - work_id
      properties:
        track_id:
          type:
          - string
          - 'null'
          format: uuid
        work_id:
          type: string
          format: uuid
    Album:
      type: object
      required:
      - id
      - artist_work_id
      - title
      - images
      - album_type
      - monitored
      - availability
      properties:
        album_type:
          $ref: '#/components/schemas/AlbumType'
        artist_work_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
        monitored:
          type: boolean
        release_date:
          type:
          - string
          - 'null'
          format: date
        title:
          type: string
    AlbumDetailSchema:
      type: object
      required:
      - album
      - tracks
      properties:
        album:
          $ref: '#/components/schemas/Album'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackDetailSchema'
    AlbumType:
      type: string
      enum:
      - studio
      - live
      - compilation
      - ep
      - single
      - soundtrack
    Availability:
      type: string
      description: |-
        Where in the availability pipeline a `Work` (or a leaf under it) is
        sitting. This intentionally mirrors the *arr apps' own state machine
        (queued/downloading/imported) but is normalized into one shared enum so
        catalog and playback code doesn't need to know which *arr produced it.
      enum:
      - unknown
      - pending
      - processing
      - partially_available
      - available
      - deleted
    AvailableProfileResponse:
      type: object
      description: |-
        Minimal household-profile projection for Playarr's 'who is watching'
        screen. Password hashes, email addresses and policy details are never
        exposed.
      required:
      - id
      - username
      - display_name
      - is_current
      - pin_locked
      properties:
        display_name:
          type: string
        id:
          type: string
          format: uuid
        is_current:
          type: boolean
        pin_locked:
          type: boolean
        username:
          type: string
    Book:
      type: object
      required:
      - id
      - author_work_id
      - title
      - monitored
      - availability
      properties:
        author_work_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        isbn:
          type:
          - string
          - 'null'
        monitored:
          type: boolean
        release_date:
          type:
          - string
          - 'null'
          format: date
        series_name:
          type:
          - string
          - 'null'
        series_position:
          type:
          - number
          - 'null'
          format: float
        title:
          type: string
    BookDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::BookDetail`; see
        [`EpisodeDetailSchema`].
      required:
      - book
      properties:
        book:
          $ref: '#/components/schemas/Book'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
    CatalogPageSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::CatalogPage` -- see
        `catalog::CatalogPageSchema`'s own doc comment for why this can't just
        derive `ToSchema` on the real type.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        total:
          type:
          - integer
          - 'null'
          format: int64
    ClientPlatform:
      type: string
      description: |-
        Every first-party client surface Streamarr ships. Kept as a closed enum
        (rather than a free-form string) so the compatibility table, the
        `X-Streamarr-Client-Platform` header parser, and policy's
        `device_allow` list all agree on the same finite set.

        `StreamarrAdmin` is the odd one out: every other variant is a Playarr
        client (consumer streaming), but Streamarr's own admin UI is also a
        real first-party client surface that authenticates through the same
        `POST /api/v1/auth/login` endpoint, and `login_handler` needs a real,
        honest way to tell the two apart so it knows whether to require
        `Policy::can_stream` for this login attempt -- see that handler's doc
        comment. Declaring `client_platform: "streamarr-admin"` doesn't grant
        anything by itself (a caller can claim whatever platform it wants); it
        only selects which check `login_handler` applies, and every *other*
        endpoint still separately enforces the real, persisted `Policy`
        regardless of what a login request once claimed.
      enum:
      - android-mobile
      - android-tv
      - ios
      - web
      - tv-webos
      - tv-tizen
      - tv-vidaa
      - streamarr-admin
    CompatibilityEntry:
      type: object
      description: |-
        One platform's row in the compatibility table: what the latest client
        build is, the floor below which the version-gate middleware rejects
        requests outright, and the floor below which it should nag-but-allow.
      required:
      - platform
      - latest_version
      - min_supported_version
      properties:
        deprecated_below:
          type:
          - string
          - 'null'
        latest_version:
          type: string
        min_supported_version:
          type: string
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        sunset:
          type:
          - string
          - 'null'
          description: |-
            RFC 3339 timestamp after which `min_supported_version` will be
            ratcheted up; surfaced to clients so they can warn users ahead of
            time rather than being cut off with no notice.
    CreateDownloadTicketRequest:
      type: object
      required:
      - media_file_id
      - quality_id
      properties:
        media_file_id:
          type: string
          format: uuid
        quality_id:
          type: string
          description: |-
            `"original"`, or a transcode profile name from
            `GET /api/v1/media/{media_file_id}/download-options`.
    CreatePlaylistRequest:
      type: object
      required:
      - name
      properties:
        is_system:
          type: boolean
          description: |-
            Requires [`AdminUser`] when `true` -- a non-admin caller setting
            this is rejected with `403`, not silently downgraded to a personal
            playlist, so a client bug never creates the wrong kind of playlist
            unnoticed.
        media_type:
          $ref: '#/components/schemas/PlaylistMediaType'
          description: |-
            Existing clients default to video; new clients present this choice
            when creating a top-level playlist.
        name:
          type: string
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `Some(id)` nests this playlist under an existing one the caller can
            already write to (e.g. "Sample Movie Golf" under "MCU") -- checked in
            [`create_playlist_handler`], not structurally enforced here.
    CreateUserInvite:
      type: object
      description: Access attached to a direct administrator-issued invitation.
      properties:
        can_stream:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
    CreateUserInviteRequest:
      type: object
      description: Optional context supplied by the Playarr user requesting an invitation.
      properties:
        message:
          type:
          - string
          - 'null'
    CreateUserRequest:
      type: object
      description: |-
        Request body for provisioning a new account. `password` is write-only
        -- it is hashed via `streamarr_auth::login::hash_password` immediately
        and never echoed back in [`UserResponse`].
      required:
      - username
      - display_name
      - password
      properties:
        can_download:
          type: boolean
          description: |-
            Grants permission to create/fetch downloads of media this account
            can already stream -- see `streamarr_model::Policy::can_download`'s
            doc comment. Defaults to `false` (least privilege), same philosophy
            as `can_stream`/`library_allow` above: an admin has to explicitly
            grant download access, it is never on by default.
        can_stream:
          type: boolean
          description: |-
            Grants Playarr streaming access -- see `streamarr_model::Policy::
            can_stream`'s doc comment. Independent of `is_admin`; defaults to
            `false` (least privilege), same as every other grant this handler
            starts a new account with.
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `streamarr_model::Policy::library_allow`'s doc comment. Defaults
            to empty (no grants yet, deny-all -- not all-allow), same
            least-privilege-by-default philosophy as `is_admin`/`can_stream`
            above: an admin still has to explicitly grant library access after
            creating the account.
        password:
          type: string
        username:
          type: string
    CreditResponse:
      type: object
      description: |-
        One credit, with its [`Person`] flattened in -- a caller displaying a
        cast/crew list wants the name/headshot right there, not a second
        round trip per credit.
      required:
      - id
      - person
      properties:
        character:
          type:
          - string
          - 'null'
          description: The character played. Present only on a cast credit.
        department:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        id:
          type: string
          format: uuid
        job:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        person:
          $ref: '#/components/schemas/PersonResponse'
    DeviceAuthorizationRequest:
      type: object
      description: |-
        The short code displayed by a TV and entered (or supplied by a QR-code
        link) on an already-authenticated browser or mobile device.
      required:
      - user_code
      properties:
        user_code:
          type: string
    DeviceCodeRequest:
      type: object
      required:
      - client_platform
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
    DeviceCodeResponseSchema:
      type: object
      description: |-
        Doc-only mirror of [`DeviceCodeResponse`] (that type has no `ToSchema`;
        handlers still return it directly, serialized for real).
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - expires_in
      - interval
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
          format: int64
        interval:
          type: integer
          format: int64
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
    DeviceTokenRequest:
      type: object
      required:
      - grant_type
      - device_code
      properties:
        device_code:
          type: string
        grant_type:
          type: string
          description: |-
            Must be [`DEVICE_CODE_GRANT_TYPE`] -- any other value is rejected
            with `unsupported_grant_type` before the device code is even looked
            up, per RFC 6749 §5.2.
    DownloadOptionsResponse:
      type: object
      required:
      - media_file_id
      - container
      - options
      properties:
        container:
          type: string
        media_file_id:
          type: string
          format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/DownloadQualityOption'
    DownloadQualityOption:
      type: object
      description: |-
        One quality `GET /api/v1/media/{media_file_id}/download-options` offers
        -- the same `id`/`label`/`profile`/`height` shape
        [`crate::playback::PlaybackQualityOption`] already exposes for playback,
        plus a download-specific size estimate. `"original"` is always exact
        (`size_is_estimate: false`, `estimated_size_bytes` is the real
        `MediaFile::size_bytes`); every named transcode profile is a rough
        `video_bitrate_bps * duration_ms / 8000` estimate (`size_is_estimate:
        true`) since nothing has actually encoded it yet.
      required:
      - id
      - label
      - size_is_estimate
      properties:
        estimated_size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        id:
          type: string
        label:
          type: string
        profile:
          type:
          - string
          - 'null'
        size_is_estimate:
          type: boolean
    DownloadStatus:
      type: string
      enum:
      - queued
      - processing
      - ready
      - failed
      - expired
      - canceled
    DownloadTicketResponse:
      type: object
      description: |-
        Wire projection of [`DownloadTicket`] -- not the model type directly,
        same reasoning as `MediaFile`/`Rendition`'s own DTOs elsewhere in this
        crate: `DownloadTicket::output_path` is a `PathBuf` (no `ToSchema`
        mapping, and not something a caller should see the server's real
        filesystem layout through anyway). `profile` is deliberately omitted --
        it's an internal detail of how a `Ready` ticket got produced, not part
        of the documented response contract; `quality_id` is what callers key
        off of.
      required:
      - id
      - media_file_id
      - quality_id
      - status
      - container
      - requested_at
      properties:
        container:
          type: string
        error_message:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        media_file_id:
          type: string
          format: uuid
        quality_id:
          type: string
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
        requested_at:
          type: string
          format: date-time
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/DownloadStatus'
    Episode:
      type: object
      required:
      - id
      - season_id
      - episode_number
      - images
      - monitored
      - availability
      properties:
        air_date:
          type:
          - string
          - 'null'
          format: date
        availability:
          $ref: '#/components/schemas/Availability'
        episode_number:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
          description: Remote-hosted episode stills, normally [`crate::ImageKind::Thumb`].
        monitored:
          type: boolean
        overview:
          type:
          - string
          - 'null'
        runtime_minutes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        season_id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
    EpisodeDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::EpisodeDetail` -- the resolved
        `MediaFile` id (via `MediaFileRepo::find_by_leaf`) that plays this
        episode, `None` when no file has synced for it yet.
      required:
      - episode
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: |-
            A short, stable, machine-matchable code -- e.g. `"not_found"`,
            `"invalid_transition"`. Deliberately not the `Display` text of the
            underlying error (which can change wording without that being a
            breaking API change); `message` carries that instead.
        message:
          type: string
    ExternalProvider:
      oneOf:
      - type: string
        enum:
        - tmdb
      - type: string
        enum:
        - tvdb
      - type: string
        enum:
        - imdb
      - type: string
        enum:
        - music_brainz_artist
      - type: string
        enum:
        - music_brainz_release_group
      - type: string
        enum:
        - goodreads
      - type: string
        enum:
        - isbn
      - type: string
        enum:
        - asin
      - type: string
        description: |-
          ThePornDB -- Whisparr's own metadata provider, structurally the same
          role for Whisparr's studio/scene catalog that `Tvdb` plays for
          Sonarr's. Given a first-class variant (rather than falling back to
          `Other`) for the same reason every other Work-owning source has one:
          `streamarr-arr-sync::arr_client::work_kind_and_provider` needs a
          stable, matchable discriminant to key `Work::external_refs` lookups
          on, and every source kind that owns `Work` rows gets one.
        enum:
        - tpdb
      - type: object
        description: |-
          Escape hatch for providers we don't have a first-class variant for
          yet (e.g. AniDB, Discogs) without needing a migration to add one.
        required:
        - other
        properties:
          other:
            type: string
            description: |-
              Escape hatch for providers we don't have a first-class variant for
              yet (e.g. AniDB, Discogs) without needing a migration to add one.
      description: |-
        A cross-reference to the identifier this `Work` (or one of its source
        records) is known by in an external catalog/metadata provider.
    ExternalRef:
      type: object
      required:
      - provider
      - external_id
      properties:
        external_id:
          type: string
        provider:
          $ref: '#/components/schemas/ExternalProvider'
    FirebaseWebConfig:
      type: object
      required:
      - api_key
      - auth_domain
      - project_id
      - storage_bucket
      - messaging_sender_id
      - app_id
      - vapid_public_key
      properties:
        api_key:
          type: string
        app_id:
          type: string
        auth_domain:
          type: string
        messaging_sender_id:
          type: string
        project_id:
          type: string
        storage_bucket:
          type: string
        vapid_public_key:
          type: string
    ImageAsset:
      type: object
      required:
      - kind
      - url
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        kind:
          $ref: '#/components/schemas/ImageKind'
        url:
          type: string
        width:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    ImageKind:
      type: string
      enum:
      - poster
      - backdrop
      - banner
      - logo
      - thumb
    ImpersonationResponse:
      type: object
      description: |-
        Response body for [`impersonate_user_handler`] -- mirrors
        [`crate::login::LoginResponse`]'s shape but deliberately has no
        `refresh_token`: impersonation mints a single stateless access token (no
        persisted `Session`/`Device` row backs it -- see the handler's doc
        comment), so there is nothing to refresh.
      required:
      - access_token
      - token_type
      - expires_in
      - user_id
      - impersonated_by
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        impersonated_by:
          type: string
          format: uuid
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    LibraryViewRequest:
      type: object
      description: |-
        Request body for both create (`POST /api/v1/admin/views`) and update
        (`PUT /api/v1/admin/views/{id}`). Structurally has no `is_default`/
        `default_order` fields, so an admin can never set them through this
        endpoint -- enforced by omission, not a runtime check (see
        [`create_view_handler`]/[`update_view_handler`]'s doc comments).
      required:
      - name
      - criteria
      properties:
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: |-
            Ordered, most-significant first -- each element one of `"title"` |
            `"title_desc"` | `"recent"` | `"oldest"` | `"released"` |
            `"last_played"`, same free-string convention as
            `catalog::BrowseQueryParams::sort`, not a typed enum on the wire.
            Empty/omitted defaults to `["title"]`. `"last_played"` orders by
            *each resolving viewer's own* last-played time (see
            `streamarr_model::ViewSort::LastPlayedByUser`'s doc comment) --
            picking it here means every caller who resolves this view sees it
            personalized to them, not a single shared order.
    LibraryViewResponse:
      type: object
      required:
      - id
      - name
      - criteria
      - sort
      - is_default
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: Same ordered, most-significant-first string list `LibraryViewRequest::sort` accepts.
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - device_id
      - device_name
      - client_platform
      - client_version
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
          description: |-
            Client-generated, stable-per-install device id -- the same id the
            caller should resend on every subsequent login/refresh from this
            install, so `Policy::device_allow`/`max_concurrent_sessions` reason
            about one `Device`, not a fresh one per login.
        device_name:
          type: string
        password:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        profile_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`AuthMode::ManagedProfiles` only; ignored by every other tier.'
        username:
          type:
          - string
          - 'null'
          description: '`AuthMode::FullAccount` only; ignored by every other tier.'
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    MediaChapter:
      type: object
      description: |-
        One real chapter embedded in a media container, as reported by ffprobe.
        Untitled chapters remain untitled rather than receiving a fabricated
        name; Playarr can display their real start time as the label.
      required:
      - index
      - start_ms
      properties:
        end_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        index:
          type: integer
          format: int32
          minimum: 0
        start_ms:
          type: integer
          format: int64
          minimum: 0
        title:
          type:
          - string
          - 'null'
    MediaMetadata:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
    MediaPlaybackOptionsResponse:
      type: object
      required:
      - quality_options
      - audio_tracks
      - subtitle_tracks
      - preferences
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
        preferences:
          $ref: '#/components/schemas/MediaPlaybackPreferenceResponse'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
    MediaPlaybackPreferenceResponse:
      type: object
      required:
      - quality_id
      properties:
        audio_track_id:
          type:
          - string
          - 'null'
        quality_id:
          type: string
        subtitle_track_id:
          type:
          - string
          - 'null'
    OAuthErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: |-
            One of RFC 8628 §3.5's four device-flow error codes, or RFC 6749
            §5.2's `unsupported_grant_type`.
    PersonResponse:
      type: object
      required:
      - id
      - name
      properties:
        headshot_url:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
    PlayMethod:
      type: string
      enum:
      - direct_play
      - direct_stream
      - transcode
    PlaybackAudioTrackOption:
      type: object
      required:
      - id
      - stream_index
      - label
      - is_default
      properties:
        channels:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        codec:
          type:
          - string
          - 'null'
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        language:
          type:
          - string
          - 'null'
        stream_index:
          type: integer
          format: int32
          minimum: 0
    PlaybackEventKind:
      oneOf:
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - start
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - pause
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - resume
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - from_ms
        - to_ms
        - kind
        properties:
          from_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - seek
          to_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - buffer_start
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - duration_ms
        - kind
        properties:
          duration_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - buffer_end
      - type: object
        required:
        - to_bps
        - kind
        properties:
          from_bps:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - bitrate_change
          to_bps:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          bytes_streamed_total:
            type:
            - integer
            - 'null'
            format: int64
            description: |-
              The client's own cumulative bytes-received counter for this
              session (e.g. from the `<video>` element / Shaka Player's
              network stats), if it's cheap for the client to report. `None`
              means the client isn't reporting this yet -- `bytes_streamed`
              on the session simply stays at whatever it last was (usually
              `0`) rather than being fabricated. See
              `streamarr_telemetry::analytics::collector`'s module doc
              comment for how this is applied.
            minimum: 0
          kind:
            type: string
            enum:
            - heartbeat
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - reason
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - stop
          position_ms:
            type: integer
            format: int64
            minimum: 0
          reason:
            $ref: '#/components/schemas/StopReason'
      - type: object
        required:
        - message
        - kind
        properties:
          kind:
            type: string
            enum:
            - error
          message:
            type: string
      description: |-
        A single timestamped occurrence within a [`PlaybackSession`]. Kept as a
        tagged enum rather than a generic `{kind: String, payload: Value}` bag
        so the analytics rollup code (`streamarr-telemetry::analytics::rollup`)
        can exhaustively match every event type the compiler knows about.
    PlaybackInfoResponse:
      type: object
      description: |-
        TODO(streaming): `url` today is a well-known, stable path convention
        (`/api/v1/media/{media_file_id}/stream` for direct-play,
        `/api/v1/media/renditions/{rendition_id}/playlist.m3u8` for a ready
        rendition, `/api/v1/media/sessions/{session_id}/playlist.m3u8` for a
        freshly spawned on-demand session) rather than a route this crate
        actually serves yet -- implementing byte-range/HLS-segment serving at
        those paths is out of this endpoint's scope (this endpoint only makes
        the direct-play/existing-rendition/on-demand-transcode *decision*).
      required:
      - mode
      - url
      - mime_type
      - duration_ms
      - source_offset_ms
      - audio_tracks
      - subtitle_tracks
      - quality_options
      - selected_quality_id
      - session_id
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
          description: |-
            Source-container audio streams. For on-demand HLS, choosing one
            creates a replacement session that maps this exact stream.
        duration_ms:
          type: integer
          format: int64
          description: |-
            Fixed runtime read from the source media container with ffprobe.
            Zero means probing failed; clients may then fall back to their
            playback engine's duration without failing negotiation.
          minimum: 0
        mime_type:
          type: string
          description: MIME type for the direct media file or adaptive manifest in `url`.
        mode:
          $ref: '#/components/schemas/PlaybackMode'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
          description: |-
            The server-owned quality ladder. Original is always first and is
            the default when the request does not explicitly force a profile.
        selected_audio_track_id:
          type:
          - string
          - 'null'
        selected_quality_id:
          type: string
          description: The option represented by this URL.
        selected_subtitle_track_id:
          type:
          - string
          - 'null'
        session_id:
          type: string
          format: uuid
          description: |-
            The freshly-created [`PlaybackSession`] id -- the client uses this
            for every subsequent `POST .../sessions/{session_id}/events` call
            (heartbeats, buffering, stop). Session creation piggybacks on this
            endpoint entirely: `device_id` comes from the caller's JWT and
            `client_platform`/`client_version` from headers the client already
            sends on every request, so no separate "start session" call is
            needed -- see [`record_playback_event_handler`]'s doc comment.
        source_offset_ms:
          type: integer
          format: int64
          description: |-
            Absolute source timestamp represented by time zero in `url`.
            Non-zero only for a freshly-created on-demand HLS session started
            part-way through the source.
          minimum: 0
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
          description: |-
            Supported embedded text subtitles, exposed as authenticated WebVTT
            sidecars. Bitmap subtitle codecs are deliberately omitted.
        url:
          type: string
    PlaybackMode:
      type: string
      enum:
      - direct
      - hls
    PlaybackQualityOption:
      type: object
      description: |-
        One quality the server can genuinely deliver through its current
        playback/transcode implementation.
      required:
      - id
      - label
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
          description: Target picture height for a rendition. Original is source-defined.
          minimum: 0
        id:
          type: string
          description: |-
            Stable selector. `"original"` means normal uncapped negotiation;
            profile qualities use their real rendition profile name.
        label:
          type: string
        profile:
          type:
          - string
          - 'null'
          description: |-
            `None` for Original; otherwise the exact profile accepted by this
            endpoint's `profile` query parameter.
        video_bitrate_bps:
          type:
          - integer
          - 'null'
          format: int64
          description: Target video bitrate for a rendition. Original is source-defined.
          minimum: 0
    PlaybackSession:
      type: object
      description: |-
        One playback attempt from start to finish. Written incrementally: a row
        is inserted at playback start and updated (`ended_at`, `stop_reason`,
        aggregate buffering counters) as the session progresses and closes.
      required:
      - id
      - user_id
      - device_id
      - media_file_id
      - started_at
      - play_method
      - source_codec
      - source_container
      - target_codec
      - target_container
      - client_platform
      - client_version
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        media_file_id:
          type: string
          format: uuid
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        rendition_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Set only when `play_method == Transcode` and an existing
            [`crate::Rendition`] served the session (as opposed to a
            short-lived on-demand transcode with no durable rendition record).
        source_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        source_codec:
          type: string
        source_container:
          type: string
        started_at:
          type: string
          format: date-time
        stop_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StopReason'
        target_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        target_codec:
          type: string
          description: |-
            The codec/container/bitrate actually delivered to the client;
            equal to the source fields for `DirectPlay`.
        target_container:
          type: string
        transcode_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TranscodeReason'
        user_id:
          type: string
          format: uuid
    PlaybackSubtitleTrackOption:
      type: object
      required:
      - id
      - stream_index
      - label
      - codec
      - is_default
      - forced
      - url
      properties:
        codec:
          type: string
        forced:
          type: boolean
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        language:
          type:
          - string
          - 'null'
        stream_index:
          type: integer
          format: int32
          minimum: 0
        url:
          type: string
          description: Authenticated WebVTT sidecar aligned to this playback URL's timeline.
    PlayerPreferencesResponse:
      type: object
      required:
      - preferred_audio_language
      properties:
        preferred_audio_language:
          type: string
    PlaylistItemResponse:
      type: object
      required:
      - id
      - playlist_id
      - work_id
      - position
      - added_at
      properties:
        added_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        playlist_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        track_id:
          type:
          - string
          - 'null'
          format: uuid
        work_id:
          type: string
          format: uuid
    PlaylistMediaType:
      type: string
      description: The single class of media a playlist accepts.
      enum:
      - video
      - audio
    PlaylistResponse:
      type: object
      required:
      - id
      - name
      - is_system
      - media_type
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        is_system:
          type: boolean
          description: |-
            `true` for a System (admin-managed, globally visible) playlist,
            `false` for a personal one.
        media_type:
          $ref: '#/components/schemas/PlaylistMediaType'
        name:
          type: string
        owner_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `None` for a System playlist. Present (including for a personal
            playlist that isn't the caller's own) only on the admin
            "view everything" listing ([`list_admin_playlists_handler`]) -- the
            ordinary [`list_playlists_handler`]/[`get_playlist_handler`]
            responses a non-admin caller sees also carry this, but a caller
            only ever gets back playlists they can already read (their own +
            System, see [`can_read`]), so it's never a stranger's id in
            practice for them.
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
    ProfileAvatarKind:
      type: string
      description: |-
        The two durable avatar sources a Playarr profile can select. Custom
        photos are cropped and resized by the client before persistence.
      enum:
      - preset
      - custom
    ProfileAvatarPreference:
      type: object
      description: |-
        A signed-in profile's server-backed avatar choice. `value` is a known
        preset id for [`ProfileAvatarKind::Preset`] or a resized JPEG data URL
        for [`ProfileAvatarKind::Custom`].
      required:
      - kind
      - value
      properties:
        kind:
          $ref: '#/components/schemas/ProfileAvatarKind'
        value:
          type: string
    ProfileAvatarSettingResponse:
      type: object
      properties:
        preference:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ProfileAvatarPreference'
            description: |-
              `null` means this profile has not chosen an avatar yet; clients may
              render their deterministic built-in default.
    ProfilePinSettingResponse:
      type: object
      required:
      - pin_locked
      properties:
        pin_locked:
          type: boolean
    RefreshRequest:
      type: object
      required:
      - device_id
      - refresh_token
      properties:
        device_id:
          type: string
          format: uuid
          description: |-
            Same `device_id` the original `POST /api/v1/auth/login` (or RFC
            8628 device-flow) call used -- `RefreshTokenService` keys its store
            by device, not by the opaque token value alone.
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
          description: |-
            Rotated -- a new refresh token, not the one presented. The caller
            must persist this and discard the old one; presenting the old one
            again is treated as reuse (see `RefreshTokenService::rotate`'s doc
            comment) and revokes the whole token family.
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    RegisterPushRequest:
      type: object
      required:
      - token
      - platform
      properties:
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        token:
          type: string
    ReorderPlaylistItemsRequest:
      type: object
      required:
      - item_ids
      properties:
        item_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Every item id currently on this playlist, in the desired new order.
            An id that isn't actually one of this playlist's items is silently
            ignored -- see `PlaylistRepo::reorder_items`'s own doc comment.
    ReviewUserInviteRequest:
      type: object
      required:
      - approved
      properties:
        approved:
          type: boolean
          description: '`true` grants exactly one generation; `false` denies this request.'
        can_stream:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
    Season:
      type: object
      required:
      - id
      - series_work_id
      - season_number
      - monitored
      - availability
      properties:
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        monitored:
          type: boolean
        overview:
          type:
          - string
          - 'null'
        season_number:
          type: integer
          format: int32
        series_work_id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
    SeasonDetailSchema:
      type: object
      required:
      - season
      - episodes
      properties:
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeDetailSchema'
        season:
          $ref: '#/components/schemas/Season'
    SessionHistoryView:
      type: object
      description: |-
        Historical playback-session fields plus the same best-effort linked
        user/media context as [`ActiveSessionView`]. The original raw-session
        fields stay intact so enriching the endpoint remains backwards compatible.
      required:
      - id
      - user_id
      - device_id
      - media_file_id
      - started_at
      - play_method
      - source_codec
      - source_container
      - target_codec
      - target_container
      - client_platform
      - client_version
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        media_file_id:
          type: string
          format: uuid
        media_title:
          type:
          - string
          - 'null'
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        rendition_id:
          type:
          - string
          - 'null'
          format: uuid
        source_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        source_codec:
          type: string
        source_container:
          type: string
        started_at:
          type: string
          format: date-time
        stop_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StopReason'
        target_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        target_codec:
          type: string
        target_container:
          type: string
        transcode_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TranscodeReason'
        user_display_name:
          type:
          - string
          - 'null'
        user_id:
          type: string
          format: uuid
        work_id:
          type:
          - string
          - 'null'
          format: uuid
    SignupRequest:
      type: object
      description: |-
        Public account-creation body. The bearer invitation is write-only and
        grants exactly one ordinary Playarr account with the access chosen by the
        administrator who issued or approved it.
      required:
      - invite_token
      - username
      - display_name
      - password
      properties:
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        invite_token:
          type: string
        password:
          type: string
        username:
          type: string
    SourceInstanceRequest:
      type: object
      description: |-
        Request body for registering (or re-registering, by re-POSTing with the
        same `id` you got back) a `*arr` connection. `api_key` is write-only --
        it is never echoed back in [`SourceInstanceResponse`].
      required:
      - kind
      - name
      - base_url
      - api_key
      properties:
        api_key:
          type: string
        base_url:
          type: string
        best_effort:
          type: boolean
        default_quality_profile_id:
          type:
          - integer
          - 'null'
          format: int64
        default_root_folder_id:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Omit to create a new instance (a fresh id is assigned and returned);
            set to an id from a prior response to update that same instance in
            place (e.g. to rotate its API key).
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        priority:
          type: integer
          format: int32
    SourceInstanceResponse:
      type: object
      description: |-
        The redacted, admin-facing projection of [`SourceInstance`] -- see that
        type's own doc comment for why it isn't `ToSchema`-derived directly
        (it carries the API key). `api_key` is never included, not even
        redacted-looking -- the field simply doesn't exist on the response.
      required:
      - id
      - kind
      - name
      - base_url
      - priority
      - best_effort
      properties:
        base_url:
          type: string
        best_effort:
          type: boolean
        default_quality_profile_id:
          type:
          - integer
          - 'null'
          format: int64
        default_root_folder_id:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        priority:
          type: integer
          format: int32
    SourceInstanceSyncStatusResponse:
      type: object
      description: |-
        One source instance's most recently reported reconciliation outcome --
        see `streamarr_arr_sync::SyncRunStatus`. `status`/`error`/`finished_at`
        are `None` together when no poller has reported anything for this
        instance yet (e.g. it was registered less than ~10s ago).
      required:
      - source_instance_id
      - name
      - kind
      properties:
        detail:
          type:
          - string
          - 'null'
          description: |-
            Only set when `status` is `"running"` and the poller has something
            more specific to report than "running" alone -- see
            `streamarr_arr_sync::SyncRunStatus::Running`'s doc comment (e.g. a
            large missing-media-file backfill's live "N/total" progress).
        error:
          type:
          - string
          - 'null'
          description: Only set when `status` is `"failed"`.
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        source_instance_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
          description: '`"running"` | `"succeeded"` | `"failed"`, or absent if unreported.'
    SourceKind:
      type: string
      enum:
      - sonarr
      - radarr
      - lidarr
      - bazarr
      - prowlarr
      - readarr
      - whisparr
    StopReason:
      oneOf:
      - type: string
        enum:
        - completed
      - type: string
        enum:
        - user_stopped
      - type: string
        enum:
        - error
      - type: string
        enum:
        - device_disconnected
      - type: string
        enum:
        - session_revoked
      - type: string
        enum:
        - concurrent_limit_exceeded
      - type: string
        enum:
        - idle_timeout
      - type: object
        required:
        - other
        properties:
          other:
            type: string
    SystemSettings:
      type: object
      description: Singleton system configuration stored in the database.
      required:
      - instance_name
      properties:
        instance_name:
          type: string
    TdarrConnectionRequest:
      type: object
      description: |-
        Request body for registering (or re-registering, to update in place --
        e.g. to rotate the API key) the Tdarr connection. `api_key` is
        write-only -- it is never echoed back in [`TdarrConnectionResponse`].
      required:
      - base_url
      - api_key
      properties:
        active_session_threshold:
          type: integer
          format: int32
        api_key:
          type: string
        base_url:
          type: string
        default_profile:
          type: string
        default_worker_limit:
          type: integer
          format: int32
        tdarr_db_id:
          type: string
        throttle_check_interval_secs:
          type: integer
          format: int64
        throttled_worker_limit:
          type: integer
          format: int32
          description: |-
            Worker limit applied while `active_session_threshold` or more
            on-demand sessions are live. Defaults to `0` -- pause background
            transcoding entirely rather than compete with live playback.
        worker_process:
          type: string
    TdarrConnectionResponse:
      type: object
      required:
      - base_url
      - tdarr_db_id
      - default_profile
      - worker_process
      - default_worker_limit
      - throttled_worker_limit
      - active_session_threshold
      - throttle_check_interval_secs
      - updated_at
      properties:
        active_session_threshold:
          type: integer
          format: int32
        base_url:
          type: string
        default_profile:
          type: string
        default_worker_limit:
          type: integer
          format: int32
        tdarr_db_id:
          type: string
        throttle_check_interval_secs:
          type: integer
          format: int64
        throttled_worker_limit:
          type: integer
          format: int32
        updated_at:
          type: string
          format: date-time
        worker_process:
          type: string
    TokenResponseSchema:
      type: object
      description: Doc-only mirror of [`TokenResponse`]; see [`DeviceCodeResponseSchema`].
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    Track:
      type: object
      required:
      - id
      - album_id
      - disc_number
      - track_number
      - title
      - availability
      properties:
        album_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        disc_number:
          type: integer
          format: int32
          minimum: 0
        duration_seconds:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        id:
          type: string
          format: uuid
        title:
          type: string
        track_number:
          type: integer
          format: int32
          minimum: 0
    TrackDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `streamarr_catalog::TrackDetail`; see
        [`EpisodeDetailSchema`].
      required:
      - track
      properties:
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        track:
          $ref: '#/components/schemas/Track'
    TranscodeReason:
      oneOf:
      - type: string
        enum:
        - container_not_supported
      - type: string
        enum:
        - video_codec_not_supported
      - type: string
        enum:
        - audio_codec_not_supported
      - type: string
        enum:
        - video_bitrate_exceeds_limit
      - type: string
        enum:
        - resolution_exceeds_limit
      - type: string
        enum:
        - subtitle_burn_in_required
      - type: string
        description: |-
          Server-side policy override (e.g. bandwidth cap) rather than a
          client capability gap.
        enum:
        - server_policy
      - type: object
        required:
        - other
        properties:
          other:
            type: string
      description: |-
        Why a session couldn't direct-play/direct-stream and had to fall back to
        a transcode. Populated only when `play_method == Transcode`.
    UpdateMediaPlaybackPreferencesRequest:
      type: object
      required:
      - quality_id
      properties:
        audio_track_id:
          type:
          - string
          - 'null'
        quality_id:
          type: string
        subtitle_track_id:
          type:
          - string
          - 'null'
    UpdatePlayerPreferencesRequest:
      type: object
      required:
      - preferred_audio_language
      properties:
        preferred_audio_language:
          type: string
    UpdatePlaylistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
    UpdateProfileAvatarRequest:
      type: object
      required:
      - preference
      properties:
        preference:
          $ref: '#/components/schemas/ProfileAvatarPreference'
    UpdateProfilePinRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type:
          - string
          - 'null'
          description: Exactly four ASCII decimal digits. `null` removes the profile lock.
    UpdateSystemSettingsRequest:
      type: object
      required:
      - instance_name
      properties:
        instance_name:
          type: string
    UpdateUserRequest:
      type: object
      description: |-
        All-optional patch body -- only fields set to `Some` are applied.
        `password`, when set, is re-hashed the same way [`CreateUserRequest`]'s
        is; `is_admin`, when set, updates the user's [`Policy`] rather than the
        `User` row itself (`is_admin` lives on `Policy`, not `User`).
      properties:
        can_download:
          type:
          - boolean
          - 'null'
          description: |-
            `Some(bool)` replaces the account's `Policy::can_download`; `None`
            (the field omitted) leaves it untouched -- same all-optional-patch
            shape as every other field here.
        can_stream:
          type:
          - boolean
          - 'null'
        disabled:
          type:
          - boolean
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        is_admin:
          type:
          - boolean
          - 'null'
        library_allow:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: |-
            `Some(ids)` replaces the account's entire `Policy::library_allow`
            with `ids`; `None` (the field omitted from the request body) leaves
            it untouched -- same all-optional-patch shape as every other field
            here. See [`update_user_handler`]'s doc comment for how this is
            folded into the same single conditional policy re-persist
            `is_admin`/`can_stream` already use.
        password:
          type:
          - string
          - 'null'
    UpdateWatchProgressRequest:
      type: object
      required:
      - position_ms
      - duration_ms
      properties:
        completed:
          type: boolean
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this progress update actually happened, RFC3339. Optional and
            additive -- lets an offline-buffered client (one that kept recording
            progress while disconnected and is only now replaying it) timestamp
            the update for when it occurred rather than when it's replayed after
            reconnecting. Omitted by every existing caller, who get the prior
            behaviour unchanged: the server falls back to `Utc::now()`.
        position_ms:
          type: integer
          format: int64
          minimum: 0
    UserInviteRequestResponse:
      type: object
      description: |-
        One Playarr user's request for permission to invite a friend. User
        identity is included so the admin console can review the queue without
        making a second request per row.
      required:
      - id
      - user_id
      - username
      - display_name
      - status
      - requested_at
      - can_stream
      - library_allow
      properties:
        can_stream:
          type: boolean
        display_name:
          type: string
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        library_allow:
          type: array
          items:
            type: string
            format: uuid
        message:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/UserInviteRequestStatus'
        user_id:
          type: string
          format: uuid
        username:
          type: string
    UserInviteRequestStatus:
      type: string
      enum:
      - pending
      - approved
      - denied
      - generated
    UserInviteResponse:
      type: object
      description: |-
        The raw invite token is returned only when it is issued. Persistence
        stores its digest, so this response is the administrator's sole chance to
        put the bearer token into the QR link.
      required:
      - invite_token
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        invite_token:
          type: string
    UserResponse:
      type: object
      description: |-
        The redacted, admin-facing projection of [`streamarr_model::User`] --
        same rationale as `admin.rs`'s `SourceInstanceResponse`: `User` itself
        is deliberately not `ToSchema` (it carries `password_hash`), so
        handlers map to this secret-free DTO instead. `is_admin` is pulled in
        from the user's `Policy` (see [`UserResponse::from_user`])
        since it isn't a field on `User` at all.
      required:
      - id
      - username
      - display_name
      - is_admin
      - can_stream
      - library_allow
      - can_download
      - disabled
      - created_at
      - preferred_audio_language
      properties:
        can_download:
          type: boolean
          description: |-
            Whether this account may create/fetch downloads -- see
            `streamarr_model::Policy::can_download`'s doc comment. Independent
            of `can_stream`/`library_allow`; defaults to `false` for a newly
            created account.
        can_stream:
          type: boolean
          description: |-
            Whether this account is permitted to sign in to Playarr -- see
            `streamarr_model::Policy::can_stream`'s doc comment. Independent of
            `is_admin`.
        created_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `streamarr_model::Policy::library_allow`'s doc comment. Empty
            means no grants (deny-all), not all-allow; irrelevant (but still
            truthfully reported) for an `is_admin` account, since `is_admin`
            bypasses this check entirely at enforcement time.
        preferred_audio_language:
          type: string
        username:
          type: string
    VerifyProfilePinRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type: string
    VerifyProfilePinResponse:
      type: object
      required:
      - verified
      properties:
        verified:
          type: boolean
    VersionEnvelope:
      type: object
      description: Response body for `GET /api/system/version`.
      required:
      - instance_name
      - server_version
      - api_version
      - compatibility
      properties:
        api_version:
          type: string
        build_sha:
          type:
          - string
          - 'null'
        compatibility:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityEntry'
        instance_name:
          type: string
        server_version:
          type: string
    ViewCriteriaDto:
      type: object
      properties:
        available_only:
          type: boolean
        genre:
          type:
          - string
          - 'null'
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
        release_window_days:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Only include works whose `release_date` falls within the last N
            days. `None` = no window restriction.
        source_instance_id:
          type:
          - string
          - 'null'
          format: uuid
        tag:
          type:
          - string
          - 'null'
    ViewSummary:
      type: object
      description: |-
        Public/Playarr-facing list projection -- deliberately doesn't expose
        `criteria` (Playarr never needs to interpret filter internals, only
        call `resolve`).
      required:
      - id
      - name
      - is_default
      properties:
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
    WatchProgress:
      type: object
      description: Durable resume position for one user and one media file.
      required:
      - media_file_id
      - work_id
      - position_ms
      - duration_ms
      - state
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        media_file_id:
          type: string
          format: uuid
        position_ms:
          type: integer
          format: int64
          minimum: 0
        state:
          $ref: '#/components/schemas/WatchState'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            `None` is used only for the synthetic unseen response returned when
            no durable progress row exists yet.
        work_id:
          type: string
          format: uuid
    WatchState:
      type: string
      description: The viewer-facing state derived from a durable playback position.
      enum:
      - unseen
      - part_watched
      - watched
    Work:
      type: object
      description: |-
        The aggregate root for anything in the catalog. A movie is a `Work` of
        kind `Movie` with no children; a series/artist/author is a `Work` whose
        children (seasons, albums, books) live in their own tables keyed by
        `Work::id`.
      required:
      - id
      - kind
      - external_refs
      - title
      - sort_title
      - images
      - genres
      - tags
      - added_at
      - monitored
      - availability
      properties:
        added_at:
          type: string
          format: date-time
        availability:
          $ref: '#/components/schemas/Availability'
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
        genres:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
        kind:
          $ref: '#/components/schemas/WorkKind'
        monitored:
          type: boolean
          description: |-
            Whether Streamarr should actively track/request missing children of
            this work (mirrors the *arr "monitored" concept).
        overview:
          type:
          - string
          - 'null'
        release_date:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this title was actually released, per its source *arr app
            (Radarr `digitalRelease`/`physicalRelease`, Sonarr `firstAired`) --
            distinct from `added_at` (when Streamarr itself learned about the
            work). Populated by `streamarr-arr-sync` for `Movie`/`Series`/`Site`
            kinds only; `Artist`/`Author` works have no single release date of
            their own (their children -- albums/books -- each carry one already),
            so this stays `None` for those kinds. See
            `backend/migrations/{sqlite,postgres}/00{11,14}_work_release_date.sql`.
        sort_title:
          type: string
          description: |-
            Normalized title used for alphabetical sort/browse ("Dark Knight,
            The" rather than "The Test Film").
        tags:
          type: array
          items:
            type: string
          description: |-
            Free-form user/automation tags (distinct from `genres`, which come
            from metadata providers); used by [`crate::Policy`] tag filters.
        title:
          type: string
    WorkChildrenSchema:
      oneOf:
      - type: string
        enum:
        - Movie
      - type: object
        required:
        - Series
        properties:
          Series:
            type: array
            items:
              $ref: '#/components/schemas/SeasonDetailSchema'
      - type: object
        required:
        - Artist
        properties:
          Artist:
            type: array
            items:
              $ref: '#/components/schemas/AlbumDetailSchema'
      - type: object
        required:
        - Author
        properties:
          Author:
            type: array
            items:
              $ref: '#/components/schemas/BookDetailSchema'
      description: |-
        Doc-only mirror of `streamarr_catalog::WorkChildren`; see
        [`CatalogPageSchema`].
    WorkCreditsResponse:
      type: object
      required:
      - cast
      - crew
      properties:
        cast:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
        crew:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
    WorkDetailSchema:
      type: object
      required:
      - work
      - children
      properties:
        children:
          $ref: '#/components/schemas/WorkChildrenSchema'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            The resolved `MediaFile` id for a movie's own leaf (`LeafRef::Work`);
            always `None` for series/artist/author works, whose playable leaves
            are their children instead -- see `streamarr_catalog::WorkDetail`.
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Fixed source-container runtime for a movie. Series runtimes are
            exposed on each `EpisodeDetailSchema`.
          minimum: 0
        work:
          $ref: '#/components/schemas/Work'
    WorkKind:
      type: string
      description: |-
        The top-level taxonomy Streamarr understands. Deliberately small and
        closed: everything else (season, album, book...) is a child of a `Work`
        rather than a `Work` in its own right, because those children don't have
        independent lifecycle/monitoring semantics at the top level.
      enum:
      - movie
      - series
      - site
      - artist
      - author
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: system
  description: Process health, readiness, and version endpoints
- name: auth
  description: Session login and access-token issuance
- name: oauth
  description: RFC 8628 OAuth 2.0 device authorization endpoints
- name: webhooks
  description: '*arr webhook receiver'
- name: catalog
  description: Catalog browse/search/detail
- name: playback
  description: 'Playback negotiation: direct-play vs. transcode decision'
- name: admin
  description: 'Admin-only configuration: registering *arr source instances'
- name: users
  description: User account management and signed-in player preferences
- name: views
  description: Saved catalog filter presets ('Views') -- admin-managed, surfaced to Playarr as browsable shelves
- name: playlists
  description: User + System playlists -- named, ordered, optionally-nested lists of video works or audio tracks
- name: credits
  description: Cast/crew for a work, and every work a given person is credited on
- name: downloads
  description: Server-staged, quality-selectable, resumable downloads of media the caller already has playback access to
