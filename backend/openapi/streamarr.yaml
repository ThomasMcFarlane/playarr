openapi: 3.1.0
info:
  title: Streamarr API
  description: 'The Streamarr Axum HTTP server: OpenAPI-annotated system routes, health/readiness, and the client-version-enforcement middleware.'
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /api/system/health:
    get:
      tags:
      - system
      operationId: health_handler
      responses:
        '200':
          description: The process is alive and serving HTTP requests
  /api/system/ready:
    get:
      tags:
      - system
      operationId: readiness_handler
      responses:
        '200':
          description: Ready to serve traffic
        '503':
          description: Not ready yet (or no longer ready)
  /api/system/version:
    get:
      tags:
      - system
      operationId: version_handler
      responses:
        '200':
          description: Server version and client compatibility table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEnvelope'
  /api/v1/admin/playback/sessions/active:
    get:
      tags:
      - admin
      summary: |-
        Every currently-active playback session, newest first -- backs the
        admin Activity page's "live" section. Concurrently-active sessions are a
        small set (dozens, not thousands), so the N+1 user/media lookups
        `enrich` does per row are acceptable here.
      operationId: list_active_sessions_handler
      responses:
        '200':
          description: Every currently-active playback session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveSessionView'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/playback/sessions/history:
    get:
      tags:
      - admin
      summary: |-
        Filtered, paginated raw session history -- backs the admin Activity
        page's "history" section. `limit` is clamped to 500 server-side
        regardless of what's requested, matching the two indexes
        (`idx_playback_sessions_user_id`/`idx_playback_sessions_started_at`)
        this query is built to actually use.
      operationId: list_session_history_handler
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Filtered, paginated playback session history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaybackSession'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/playback/sessions/{session_id}/stop:
    post:
      tags:
      - admin
      summary: |-
        Force-stops a live playback session -- the "let me stop it" half of the
        admin Activity/Tasks in-progress-transcode view. Kills the underlying
        ffmpeg process too, if this session has one (`TranscodeOrchestrator::
        expire_playback_session` is a harmless no-op for direct-play/durable-
        rendition sessions, which were never associated with a transcode
        process in the first place -- see that method's own doc comment), then
        finalizes the durable record with `StopReason::Other("admin_stopped")`
        (not `UserStopped`, since the *viewer* didn't stop it -- an operator
        did, from the admin UI, which callers reading session history should be
        able to tell apart from a normal end-of-playback stop).
      operationId: stop_session_handler
      parameters:
      - name: session_id
        in: path
        description: PlaybackSession id (see ActiveSessionView::session_id)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session stopped (or was already gone -- stopping a session that already ended is not an error)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/playlists:
    get:
      tags:
      - playlists
      summary: Every playlist regardless of owner -- see the module doc comment.
      operationId: list_admin_playlists_handler
      responses:
        '200':
          description: Every playlist, System and personal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/source-instances:
    get:
      tags:
      - admin
      summary: Every currently-registered `*arr` connection.
      operationId: list_source_instances_handler
      responses:
        '200':
          description: All registered source instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceInstanceResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
    post:
      tags:
      - admin
      summary: |-
        Registers a new `*arr` connection, or updates an existing one in place
        when `id` is set. Confirms the instance is actually reachable with the
        given `base_url`/`api_key` before accepting it.
      operationId: create_source_instance_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInstanceRequest'
        required: true
      responses:
        '200':
          description: Registered (or updated) and confirmed reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceInstanceResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '502':
          description: base_url/api_key rejected, or the instance could not be reached
  /api/v1/admin/source-instances/sync-status:
    get:
      tags:
      - admin
      summary: |-
        Every registered source instance's last-known sync status in one call --
        backs the admin "Tasks" screen. Purely in-memory/runtime, like `POST
        .../sync`'s underlying trigger channel: nothing here survives a restart,
        and an instance with no poller running yet (or one that's never
        completed a pass) simply has `status: null`, not a synthetic "idle" or
        "unknown" state.
      operationId: sync_status_handler
      responses:
        '200':
          description: Every registered instance's last-known sync status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceInstanceSyncStatusResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/source-instances/{id}:
    delete:
      tags:
      - admin
      summary: |-
        De-registers a `*arr` connection. `arr-sync` stops polling it on its
        next reconciliation tick; already-imported catalog data is untouched.
      operationId: delete_source_instance_handler
      parameters:
      - name: id
        in: path
        description: Source instance id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed (or was already absent)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/source-instances/{id}/sync:
    post:
      tags:
      - admin
      summary: |-
        Asks this source instance's running `ReconciliationPoller` to do a full
        sync right now, instead of waiting for its next scheduled (every 300s)
        pass -- the "Sync now" action every `*arr` app itself exposes per
        configured connection. Fire-and-forget: a `202` means the request
        reached the poller, not that the resulting sync has finished yet.
      operationId: sync_source_instance_handler
      parameters:
      - name: id
        in: path
        description: Source instance id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Sync request handed to the running reconciliation poller
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No source instance registered with this id
        '503':
          description: No reconciliation poller is currently running for this instance yet
  /api/v1/admin/tdarr:
    get:
      tags:
      - admin
      summary: The currently-registered Tdarr connection, if any.
      operationId: get_tdarr_connection_handler
      responses:
        '200':
          description: The registered connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TdarrConnectionResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No Tdarr connection has been registered yet
    post:
      tags:
      - admin
      summary: |-
        Registers (or updates) Streamarr's Tdarr connection. Confirms Tdarr is
        actually reachable with the given `base_url`/`api_key` before
        accepting it.
      operationId: create_tdarr_connection_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TdarrConnectionRequest'
        required: true
      responses:
        '200':
          description: Registered (or updated) and confirmed reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TdarrConnectionResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '502':
          description: base_url/api_key rejected, or Tdarr could not be reached
    delete:
      tags:
      - admin
      summary: |-
        De-registers the Tdarr connection. The background dispatch loop stops
        on its next watch tick (see this module's doc comment); already-cached
        `Rendition`s are untouched.
      operationId: delete_tdarr_connection_handler
      responses:
        '204':
          description: Removed (or was already absent)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/users:
    get:
      tags:
      - users
      summary: |-
        Every provisioned account. A user whose `Policy` has gone missing (a
        data-integrity gap, not something a caller can cause through this API)
        is still listed -- just with `is_admin: false` and a logged warning --
        rather than failing the whole list over one bad row.
      operationId: list_users_handler
      responses:
        '200':
          description: All provisioned accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
    post:
      tags:
      - users
      summary: |-
        Provisions a new account: hashes the password, creates a default
        [`Policy`] for it (see [`default_policy`]), and persists the policy
        *before* the user -- same write-ordering rationale as `admin.rs`'s
        create handler (the durable dependency first), except here it's an
        actual foreign key: `User::policy_id` must resolve.
      operationId: create_user_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: Username is already taken
  /api/v1/admin/users/{id}:
    delete:
      tags:
      - users
      summary: |-
        Removes an account and, best-effort, its `Policy`. Mirrors
        `admin.rs`'s `delete_source_instance_handler`: a `NotFound` deleting the
        policy is not a caller-facing failure (an already-absent/shared/
        orphaned policy is exactly as much a no-op as deleting an
        already-absent user would be).
      operationId: delete_user_handler
      parameters:
      - name: id
        in: path
        description: User id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed (or was already absent)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
    patch:
      tags:
      - users
      summary: |-
        Applies a partial update to an existing account. Only fields present as
        `Some` in the body are changed; `password`, when set, is re-hashed the
        same way [`create_user_handler`] does; `is_admin`/`can_stream`/
        `library_allow`, when set, update the user's `Policy` row (loaded via
        `policy_id`) rather than `User` itself.
      operationId: update_user_handler
      parameters:
      - name: id
        in: path
        description: User id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No user with this id
  /api/v1/admin/views:
    get:
      tags:
      - views
      summary: |-
        Every view, full projection (including `criteria`) -- the admin list
        screen. Ordered by [`sort_views_for_display`].
      operationId: list_admin_views_handler
      responses:
        '200':
          description: Every view, full projection, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryViewResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
    post:
      tags:
      - views
      summary: |-
        Creates a new, admin-authored view. `is_default` is always `false` and
        `default_order` is always `None` for a view created through this
        endpoint -- both are set only by the boot-time seed step (see
        `streamarr_db::repo::library_view::seed_default_views`).
      operationId: create_view_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryViewRequest'
        required: true
      responses:
        '200':
          description: The created view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryViewResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
  /api/v1/admin/views/{id}:
    put:
      tags:
      - views
      summary: |-
        Updates a view's `name`/`criteria`/`sort` in place, preserving `id`/
        `is_default`/`default_order`/`created_at`. This means an admin **can**
        rename/retune a default view's criteria -- only deletion is blocked (see
        [`delete_view_handler`]) since Playarr's Home shelves depend on the id
        remaining resolvable.
      operationId: update_view_handler
      parameters:
      - name: id
        in: path
        description: View id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryViewRequest'
        required: true
      responses:
        '200':
          description: The updated view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryViewResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No view with this id
    delete:
      tags:
      - views
      summary: |-
        Deletes a custom (non-default) view. Rejects with `409 Conflict` for a
        seeded default view -- Playarr's Home shelves depend on those ids
        remaining resolvable; an admin who wants to change one should rename/
        retune it via [`update_view_handler`] instead.
      operationId: delete_view_handler
      parameters:
      - name: id
        in: path
        description: View id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No view with this id
        '409':
          description: This is a seeded default view and cannot be deleted
  /api/v1/artwork/work/{work_id}/{kind}:
    get:
      tags:
      - catalog
      operationId: work_artwork_handler
      parameters:
      - name: work_id
        in: path
        description: Work id
        required: true
        schema:
          type: string
          format: uuid
      - name: kind
        in: path
        description: poster, backdrop, banner, logo, or thumb
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Streamarr-cached source artwork
          content:
            image/*: {}
        '304':
          description: The caller already has the current cached artwork
        '400':
          description: Unsupported artwork kind
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: Unknown work or unavailable artwork kind
        '502':
          description: The metadata-provider artwork could not be safely cached
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: login_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Access + refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: credentials_required | pin_required
        '401':
          description: untrusted_network | invalid_credentials | invalid_pin | account_disabled
        '403':
          description: authenticated, but this account has no Playarr streaming access
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Fresh access + rotated refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: refresh token is invalid, expired, revoked, or reused
  /api/v1/catalog:
    get:
      tags:
      - catalog
      operationId: browse_catalog_handler
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
      - name: available_only
        in: query
        description: |-
          Return only works that own at least one synced media file. Playarr
          enables this; Streamarr Admin leaves it unset so records without
          playable leaves remain visible for library reconciliation.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: source_instance_id
        in: query
        description: |-
          Restricts results to works with at least one synced file from this
          source instance -- the "library" filter (two source instances of the
          same kind, e.g. two Radarr instances, browse as separate libraries).
          See `streamarr_catalog::BrowseQuery::source_instance_id`'s doc
          comment for how this is resolved.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: genre
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: tag
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: sort
        in: query
        description: |-
          `"title"` (default) or `"date_added"` (`"recent"` remains a
          backwards-compatible alias for date-added descending).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: order
        in: query
        description: '`"asc"` (default for title) or `"desc"` (default for date added).'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: A page of catalog works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageSchema'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
  /api/v1/catalog/kinds:
    get:
      tags:
      - catalog
      operationId: catalog_kinds_handler
      responses:
        '200':
          description: Configured catalog kinds visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkKind'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
  /api/v1/catalog/search:
    get:
      tags:
      - catalog
      operationId: search_catalog_handler
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Matching works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Work'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
  /api/v1/catalog/{id}:
    get:
      tags:
      - catalog
      operationId: get_work_handler
      parameters:
      - name: id
        in: path
        description: Work id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A work and its full kind-specific tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetailSchema'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: No work with this id
  /api/v1/catalog/{id}/credits:
    get:
      tags:
      - credits
      summary: |-
        A work's cast and crew, in the source's own billing/department order
        -- empty (not 404) for a work with no credits, which is the normal
        case for every non-Radarr-sourced work (see this module's doc
        comment).
      operationId: work_credits_handler
      parameters:
      - name: id
        in: path
        description: Work id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: This work's cast and crew
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkCreditsResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
  /api/v1/catalog/{id}/similar:
    get:
      tags:
      - catalog
      summary: |-
        "What else is like this" -- semantic similarity over a locally-cached
        embedding (see `streamarr_model::embedding`'s module doc comment), not
        genre/tag overlap. `404`s both for an unknown work id and for one that
        hasn't been embedded yet (not yet synced, or this deployment hasn't
        configured embedding generation) -- `streamarr_catalog::CatalogService::
        similar`'s doc comment covers why those collapse to one status here
        rather than a distinct "not available" shape.
      operationId: similar_works_handler
      parameters:
      - name: id
        in: path
        description: Work id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: Works ranked by semantic similarity to this one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Work'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: No work with this id, or it has no cached embedding yet
  /api/v1/media/renditions/{rendition_id}/{file_name}:
    get:
      tags:
      - playback
