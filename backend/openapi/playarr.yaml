          $ref: '#/components/schemas/PlaylistMediaType'
        name:
          type: string
        owner_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `None` for a System playlist. Present (including for a personal
            playlist that isn't the caller's own) only on the admin
            "view everything" listing ([`list_admin_playlists_handler`]) -- the
            ordinary [`list_playlists_handler`]/[`get_playlist_handler`]
            responses a non-admin caller sees also carry this, but a caller
            only ever gets back playlists they can already read (their own +
            System, see [`can_read`]), so it's never a stranger's id in
            practice for them.
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
        updated_at:
          type: string
          format: date-time
    PlaylistSummary:
      type: object
      required:
      - total
      - new
      - existing
      - items_total
      - items_to_add
      - items_already_present
      - items_unmatched
      properties:
        existing:
          type: integer
          minimum: 0
        items_already_present:
          type: integer
          minimum: 0
        items_to_add:
          type: integer
          minimum: 0
        items_total:
