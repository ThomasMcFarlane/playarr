          - string
          - 'null'
          description: Raw ffprobe `profile` (e.g. "DTS-HD MA"), when the stream reports one.
        stream_index:
          type: integer
          format: int32
          minimum: 0
    PlaybackByExternalRefRequest:
      type: object
      description: |-
        Request body for [`by_external_ref_playback_info_handler`] -- §4.3/§5.2:
        the `RemoteOnlyWork` entry point, used when the client's starting point
        was a title it can browse (via cross-peer availability, §4.3) but has no
        local `media_file_id` to call [`playback_info_handler`] with at all.
      required:
      - provider
      - external_id
      - leaf_selector
      properties:
        external_id:
          type: string
        group_library_id:
          type:
          - string
          - 'null'
          format: uuid
        leaf_selector:
          $ref: '#/components/schemas/LeafSelector'
        provider:
          $ref: '#/components/schemas/ExternalProvider'
    PlaybackEventKind:
      oneOf:
      - type: object
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - start
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - pause
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - resume
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - from_ms
        - to_ms
        - kind
        properties:
          from_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - seek
          to_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - buffer_start
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - duration_ms
        - kind
        properties:
          duration_ms:
            type: integer
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - buffer_end
      - type: object
        required:
        - to_bps
        - kind
        properties:
          from_bps:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
          kind:
            type: string
            enum:
            - bitrate_change
          to_bps:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - position_ms
        - kind
        properties:
          bytes_streamed_total:
            type:
            - integer
            - 'null'
            format: int64
            description: |-
              The client's own cumulative bytes-received counter for this
              session (e.g. from the `<video>` element / Shaka Player's
              network stats), if it's cheap for the client to report. `None`
              means the client isn't reporting this yet -- `bytes_streamed`
              on the session simply stays at whatever it last was (usually
              `0`) rather than being fabricated. See
              `playarr_telemetry::analytics::collector`'s module doc
              comment for how this is applied.
            minimum: 0
          kind:
            type: string
            enum:
            - heartbeat
          position_ms:
            type: integer
            format: int64
            minimum: 0
      - type: object
        required:
        - reason
        - position_ms
        - kind
        properties:
          kind:
            type: string
            enum:
            - stop
          position_ms:
            type: integer
            format: int64
            minimum: 0
          reason:
