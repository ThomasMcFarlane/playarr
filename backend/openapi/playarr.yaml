          - string
          - 'null'
          format: date-time
          default: null
        library_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
        limit:
          type: integer
          format: int64
          default: 100
        max_bytes_streamed:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        max_duration_ms:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        min_bytes_streamed:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        min_duration_ms:
          type:
          - integer
          - 'null'
          format: int64
          default: null
        offset:
          type: integer
          format: int64
          description: |-
            Legacy first-page compatibility field. Only zero is accepted; use
            `cursor` for continuation.
          default: 0
        peer_node_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
        play_methods:
          type: array
          items:
            $ref: '#/components/schemas/PlayMethod'
          default: []
        stop_reasons:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackActivityStopReason'
          default: []
        title_terms:
          type: array
          items:
            type: string
          default: []
        to:
          type:
          - string
          - 'null'
          format: date-time
          default: null
        user_ids:
          type: array
          items:
            type: string
            format: uuid
          default: []
    PlaybackActivityHistoryResponse:
      type: object
      required:
      - sessions
      - unavailable_nodes
      - has_more
      - snapshot_to
      properties:
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Opaque keyset continuation. Send this with the same filters to request
            the next page. `None` means the result has been exhausted.
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionHistoryView'
        snapshot_to:
          type: string
          format: date-time
          description: |-
            Stable inclusive upper bound applied to every node for this cursor
            sequence. This remains exposed for result labelling and compatibility;
            callers should continue with `next_cursor`, not an offset.
        unavailable_nodes:
          type: array
          items:
            $ref: '#/components/schemas/UnavailableNodeView'
    PlaybackActivityLibraryFacet:
      type: object
      description: |-
        One complete effective-library choice for the Activity filter. Grouped
        sources collapse onto their portable group-library id; an ungrouped source
        keeps its own source-instance id so standalone activity remains filterable.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PlaybackActivityStopReason:
      type: string
      enum:
      - completed
      - user_stopped
      - error
      - device_disconnected
      - session_revoked
      - concurrent_limit_exceeded
      - idle_timeout
      - other
      - in_progress
    PlaybackAudioTrackOption:
      type: object
