        name:
          type: string
        path:
          type:
          - string
          - 'null'
          description: Resolved binary path or device list, when found.
        required:
          type: boolean
          description: '`true` when playback features fail outright without this item.'
        status:
          $ref: '#/components/schemas/CapabilityStatus'
        version:
          type:
          - string
          - 'null'
    CapabilityStatus:
      type: string
      enum:
      - present
      - missing
      - degraded
    CatalogPageSchema:
      type: object
      description: |-
        Doc-only mirror of `playarr_catalog::CatalogPage` -- see
        `catalog::CatalogPageSchema`'s own doc comment for why this can't just
        derive `ToSchema` on the real type.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Work'
        total:
          type:
          - integer
          - 'null'
          format: int64
    ClientPlatform:
      type: string
      description: |-
        Every first-party client surface Playarr Server ships. Kept as a closed enum
        (rather than a free-form string) so the compatibility table, the
        `X-Playarr-Client-Platform` header parser, and policy's
        `device_allow` list all agree on the same finite set.

        `PlayarrAdmin` is the odd one out: every other variant is a Playarr
        client (consumer streaming), but Playarr Server's own admin UI is also a
        real first-party client surface that authenticates through the same
        `POST /api/v1/auth/login` endpoint, and `login_handler` needs a real,
        honest way to tell the two apart so it knows whether to require
        `Policy::can_stream` for this login attempt -- see that handler's doc
        comment. Declaring `client_platform: "playarr-admin"` doesn't grant
        anything by itself (a caller can claim whatever platform it wants); it
        only selects which check `login_handler` applies, and every *other*
        endpoint still separately enforces the real, persisted `Policy`
        regardless of what a login request once claimed.

        `Cast` identifies the CAF Custom Web Receiver page, not a device the
        user signs into directly -- it is provisioned via delegated device
        authorization from an already-signed-in sender.
      enum:
      - android-mobile
      - android-tv
      - ios
      - web
      - tv-webos
      - tv-tizen
      - tv-vidaa
      - cast
      - tv-fire
      - xbox
      - harmony-mobile
      - harmony-tv
      - playarr-admin
    ClientPlaybackReport:
      type: object
      properties:
        measured:
          $ref: '#/components/schemas/MeasuredPlayback'
        reported:
          $ref: '#/components/schemas/ReportedCapabilities'
    CommandAccepted:
      type: object
      required:
      - command_id
      - seq
