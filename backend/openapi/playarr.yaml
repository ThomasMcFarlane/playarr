        destination:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
          description: False until `PLAYARR_BACKUP_DIR` and `PLAYARR_BACKUP_RECIPIENTS` are set.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BackupFailure'
        keep_days:
