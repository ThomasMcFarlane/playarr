        play_method:
          $ref: '#/components/schemas/PlayMethod'
        qualification:
          $ref: '#/components/schemas/HealthQualification'
        severity:
          $ref: '#/components/schemas/HealthSeverity'
    PlaybackInfoResponse:
      type: object
      description: |-
        TODO(streaming): `url` today is a well-known, stable path convention
        (`/api/v1/media/{media_file_id}/stream` for direct-play,
        `/api/v1/media/renditions/{rendition_id}/playlist.m3u8` for a ready
        rendition, `/api/v1/media/sessions/{session_id}/playlist.m3u8` for a
        freshly spawned on-demand session) rather than a route this crate
        actually serves yet -- implementing byte-range/HLS-segment serving at
        those paths is out of this endpoint's scope (this endpoint only makes
        the direct-play/existing-rendition/on-demand-transcode *decision*).
      required:
      - mode
      - url
      - mime_type
      - duration_ms
      - source_offset_ms
      - audio_tracks
      - subtitle_tracks
      - quality_options
      - selected_quality_id
      - session_id
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
          description: |-
            Source-container audio streams. For on-demand HLS, choosing one
            creates a replacement session that maps this exact stream.
        duration_ms:
          type: integer
          format: int64
          description: |-
            Fixed runtime read from the source media container with ffprobe.
            Zero means probing failed; clients may then fall back to their
            playback engine's duration without failing negotiation.
          minimum: 0
        mime_type:
          type: string
          description: MIME type for the direct media file or adaptive manifest in `url`.
        mode:
          $ref: '#/components/schemas/PlaybackMode'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
          description: |-
            The server-owned quality ladder. Original is always first and is
            the default when the request does not explicitly force a profile.
        selected_audio_track_id:
          type:
          - string
          - 'null'
        selected_quality_id:
          type: string
          description: The option represented by this URL.
        selected_subtitle_track_id:
          type:
          - string
          - 'null'
        session_id:
          type: string
          format: uuid
          description: |-
            The freshly-created [`PlaybackSession`] id -- the client uses this
            for every subsequent `POST .../sessions/{session_id}/events` call
            (heartbeats, buffering, stop). Session creation piggybacks on this
            endpoint entirely: `device_id` comes from the caller's JWT and
            `client_platform`/`client_version` from headers the client already
            sends on every request, so no separate "start session" call is
            needed -- see [`record_playback_event_handler`]'s doc comment.
        source_offset_ms:
          type: integer
          format: int64
          description: |-
            Absolute source timestamp represented by time zero in `url`.
            Non-zero only for a freshly-created on-demand HLS session started
            part-way through the source.
          minimum: 0
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
          description: |-
            Supported embedded text subtitles, exposed as authenticated WebVTT
            sidecars. Bitmap subtitle codecs are deliberately omitted.
        url:
          type: string
    PlaybackMode:
      type: string
      enum:
      - direct
      - hls
    PlaybackQualityOption:
      type: object
      description: |-
        One quality the server can genuinely deliver through its current
        playback/transcode implementation.
      required:
      - id
      - label
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
          description: Target picture height for a rendition. Original is source-defined.
          minimum: 0
        id:
          type: string
          description: |-
            Stable selector. `"original"` means normal uncapped negotiation;
            profile qualities use their real rendition profile name.
        label:
          type: string
        profile:
          type:
          - string
          - 'null'
          description: |-
            `None` for Original; otherwise the exact profile accepted by this
            endpoint's `profile` query parameter.
        video_bitrate_bps:
          type:
          - integer
          - 'null'
          format: int64
          description: Target video bitrate for a rendition. Original is source-defined.
          minimum: 0
    PlaybackQuery:
      type: object
      properties:
        audio_codecs:
          type: string
          description: |-
            Comma-separated audio codecs the client can play; informational
            only today -- see `TranscodeOrchestrator::can_direct_play`'s docs.
        audio_stream_index:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Global ffprobe stream index of the source audio track to encode into
            an on-demand HLS session. Supplying this forces a fresh transcode so
            a track-specific stream never reuses a default-audio rendition.
          minimum: 0
        containers:
          type: string
          description: Comma-separated container names the client can play, e.g. `"mp4"`.
        force_transcode:
          type: boolean
          description: |-
            Skip direct play and produce the requested rendition profile. Used
            by an explicit player quality choice; omitted/false keeps Original
            as the default uncapped negotiation behaviour.
        ignore_saved_preferences:
          type: boolean
          description: |-
            Ignore this viewer's remembered per-media choices for this request.
            Used when the player explicitly switches back to Original/automatic.
        max_bitrate_bps:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        profile:
          type:
          - string
          - 'null'
          description: |-
            Target rendition profile name if a transcode is needed; defaults to
            `"h264-720p-4mbps"` (an unrecognized name still resolves to a sane
            default -- see `TranscodeTargetProfile::resolve`).
        start_position_ms:
          type: integer
          format: int64
          description: |-
            Absolute source timestamp at which a newly-created on-demand
            transcode should begin. Direct play and complete renditions ignore
            this and remain normally seekable by the player.
          minimum: 0
        video_codecs:
          type: string
          description: Comma-separated video codecs the client can play, e.g. `"h264"`.
    PlaybackSession:
      type: object
      description: |-
        One playback attempt from start to finish. Written incrementally: a row
        is inserted at playback start and updated (`ended_at`, `stop_reason`,
        aggregate buffering counters) as the session progresses and closes.
      required:
      - id
      - user_id
      - device_id
      - media_file_id
      - started_at
      - play_method
      - source_codec
      - source_container
      - target_codec
      - target_container
      - client_platform
      - client_version
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        ip_address:
          type:
          - string
          - 'null'
        media_file_id:
          type: string
          format: uuid
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        rendition_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Set only when `play_method == Transcode` and an existing
            [`crate::Rendition`] served the session (as opposed to a
            short-lived on-demand transcode with no durable rendition record).
        source_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        source_codec:
          type: string
        source_container:
          type: string
        started_at:
          type: string
          format: date-time
        stop_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/StopReason'
        target_bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        target_codec:
          type: string
          description: |-
            The codec/container/bitrate actually delivered to the client;
            equal to the source fields for `DirectPlay`.
        target_container:
          type: string
        transcode_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TranscodeReason'
        user_id:
          type: string
          format: uuid
    PlaybackSnapshot:
