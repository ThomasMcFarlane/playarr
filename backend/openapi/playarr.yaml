  /api/v1/catalog:
    get:
      tags:
      - catalog
      operationId: browse_catalog_handler
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
      - name: available_only
        in: query
        description: |-
          Return only works that own at least one synced media file. Playarr
          enables this; Playarr Server Admin leaves it unset so records without
          playable leaves remain visible for library reconciliation.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: source_instance_id
        in: query
        description: |-
          Restricts results to works with at least one synced file from this
          source instance -- the "library" filter (two source instances of the
          same kind, e.g. two Radarr instances, browse as separate libraries).
          See `playarr_catalog::BrowseQuery::source_instance_id`'s doc
          comment for how this is resolved.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: genre
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: tag
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: sort
        in: query
        description: |-
          `"title"` (default) or `"date_added"` (`"recent"` remains a
          backwards-compatible alias for date-added descending).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: order
        in: query
        description: '`"asc"` (default for title) or `"desc"` (default for date added).'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: audio_lang
        in: query
        description: |-
          Comma-separated audio languages (ISO 639 codes or English names,
          e.g. `en,ja`). A work matches when any of its audio tracks has any
          listed language (`lang_match=all` requires every listed language).
          Combined with `subtitle_lang` using AND.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: subtitle_lang
        in: query
        description: |-
          Comma-separated subtitle languages, embedded or sidecar (same
          format and semantics as `audio_lang`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: lang_match
        in: query
        description: |-
          `any` (default): a work needs at least one listed language per
          filter. `all`: it needs every listed language.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: lang_scope
        in: query
        description: |-
          `any_file` (default): a series counts a language if any episode
          has it. `every_file`: every file of the work must have it.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: A page of catalog works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageSchema'
              example:
                items:
                - added_at: 2024-01-15T10:30:00Z
                  availability: available
                  external_refs:
                  - external_id: '155'
                    provider: tmdb
                  genres:
                  - Action
                  - Crime
                  - Drama
                  id: 4c9e2a1b-7f3d-4e6a-9b2c-8d5f1e3a7c90
                  images:
                  - height: 3000
                    kind: poster
                    url: https://image.tmdb.org/t/p/original/qJ2tW6WMUDux911r6m7haRef0WH.jpg
                    width: 2000
                  kind: movie
                  monitored: true
                  overview: A sample synopsis for a test film.
                  release_date: 2008-07-16T00:00:00Z
                  sort_title: Test Film, The
                  tags: []
                  title: The Test Film
                total: 1
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
      security:
      - bearer_auth: []
