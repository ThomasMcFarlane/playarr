    SourceInstanceSyncStatusResponse:
      type: object
      description: |-
        One source instance's most recently reported reconciliation outcome --
        see `playarr_arr_sync::SyncRunStatus`. `status`/`error`/`finished_at`
        are `None` together when no poller has reported anything for this
        instance yet (e.g. it was registered less than ~10s ago).
      required:
      - source_instance_id
      - name
      - kind
      properties:
        calendar_error:
          type:
          - string
          - 'null'
          description: Reason of the most recent failed calendar refresh, cleared by the next success.
        calendar_last_success_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this source's calendar data was last refreshed successfully
            (admin diagnostics only; the calendar itself never reports source health).
        detail:
          type:
          - string
          - 'null'
          description: |-
            Only set when `status` is `"running"` and the poller has something
            more specific to report than "running" alone -- see
            `playarr_arr_sync::SyncRunStatus::Running`'s doc comment (e.g. a
            large missing-media-file backfill's live "N/total" progress).
        error:
          type:
          - string
          - 'null'
          description: Only set when `status` is `"failed"`.
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
        source_instance_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
          description: '`"running"` | `"succeeded"` | `"failed"`, or absent if unreported.'
