            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTitle'
        '400':
          description: Empty title
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
      security:
      - bearer_auth: []
  /api/v1/watchlist/{title_key}:
    delete:
      tags:
      - discovery
      operationId: remove_watchlist_handler
      parameters:
      - name: title_key
        in: path
        description: Identity key from the watchlist entry
