      - type: object
        required:
        - message
        - kind
        properties:
          kind:
            type: string
            enum:
            - error
          message:
            type: string
      description: |-
        A single timestamped occurrence within a [`PlaybackSession`]. Kept as a
        tagged enum rather than a generic `{kind: String, payload: Value}` bag
        so the analytics rollup code (`playarr-telemetry::analytics::rollup`)
        can exhaustively match every event type the compiler knows about.
    PlaybackHealthExport:
      type: object
      description: |-
        Redacted evidence safe to copy or share: no identifiers, titles, paths,
        URLs, addresses or tokens.
      required:
      - schema
      - generated_at
      - client_platform
      - client_version
      - play_method
      - facts
      - finding_codes
      - redaction
      properties:
        client_platform:
          type: string
        client_version:
          type: string
        facts:
          type: array
          items:
            $ref: '#/components/schemas/HealthExportFact'
        finding_codes:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        redaction:
          type: string
        schema:
          type: string
        transcode_reason:
          type:
          - string
          - 'null'
    PlaybackHealthReport:
      type: object
      required:
      - headline
      - severity
      - play_method
      - facts
      - findings
      - qualification
      - export
      properties:
        export:
