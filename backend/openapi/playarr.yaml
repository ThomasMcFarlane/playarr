    CalendarAction:
      type: object
      description: |-
        One server-computed action. A disabled action carries a `reason` so a
        client can explain it rather than hide it.
      required:
      - action
      - enabled
      properties:
        action:
          $ref: '#/components/schemas/CalendarActionKind'
        active:
          type: boolean
          description: |-
            `watchlist`: the title is already on the caller's watchlist.
            `request`: the title is already requested (so the action is disabled).
        enabled:
          type: boolean
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        position_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        reason:
          type:
          - string
          - 'null'
        work_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Library work to open or play.
    CalendarActionKind:
      type: string
      enum:
      - open
      - play
      - resume
      - request
      - watchlist
    CalendarEntry:
      type: object
      required:
      - id
      - media_kind
      - release_type
      - title
      - date
      - monitored
      - has_file
      - sources
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/CalendarAction'
          description: |-
            What the caller can do with this entry, computed by the server for that
            caller (library access, household limits, `can_request`, request
            provider, existing requests, watchlist). Clients show these as given.
        average_lag_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Average seconds from air to library availability for the series.
        date:
          type: string
          format: date
          description: UTC calendar day of the release.
        episode_number:
          type:
          - integer
          - 'null'
          format: int64
        has_file:
          type: boolean
        id:
          type: string
          description: Stable across refreshes; derived from the deduplication key.
        media_kind:
          $ref: '#/components/schemas/CalendarMediaKind'
        members:
          type: array
          items:
            $ref: '#/components/schemas/CalendarGroupMember'
          description: |-
            Present on a grouped entry (`group=series_day`): every episode folded
            into this entry, in season and episode order.
        monitored:
          type: boolean
        poster_url:
          type:
          - string
          - 'null'
          description: Absolute external artwork URL only, never an instance-local path.
        release_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Exact instant when the source provides one; absent for all-day entries.
        release_type:
          $ref: '#/components/schemas/CalendarReleaseType'
        season_number:
          type:
          - integer
          - 'null'
          format: int64
        snapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TitleSnapshot'
            description: |-
              Identity of the title for the request and watchlist endpoints
              (`POST /api/v1/discover/request`, `POST /api/v1/watchlist`); clients send
              it back verbatim instead of building their own. Absent when the entry
              has no external id to identify it by.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEntrySource'
        subtitle:
          type:
          - string
          - 'null'
          description: Episode, album or book title.
        title:
          type: string
          description: Series, movie, artist or author title.
        work_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The catalog `Work` this entry belongs to, when it is in the catalog.
    CalendarEntrySource:
      type: object
      description: One instance that reported a calendar entry.
      required:
      - source_instance_id
      - source_name
      - source_kind
      - arr_id
      properties:
        arr_id:
          type: integer
          format: int64
          description: The source app's own id for the episode, movie, album or book.
        display_label:
          type: string
          description: Neutral label (for example "Movies"); safe to show to any user.
        source_instance_id:
          type: string
          format: uuid
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_name:
          type: string
          description: |-
            The instance name as the admin set it. User-facing responses replace it with
            `display_label`, so only admins ever see the real name.
    CalendarFeedCreated:
      type: object
      required:
      - url
      - token
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: The secret path component.
        url:
          type: string
          description: Full subscription URL.
    CalendarFeedStatus:
      type: object
      required:
      - active
      properties:
        active:
          type: boolean
        created_at:
          type:
          - string
          - 'null'
