  /api/v1/playback/{media_file_id}:
    get:
      tags:
      - playback
      operationId: playback_info_handler
      parameters:
      - name: media_file_id
        in: path
        description: MediaFile id
        required: true
        schema:
          type: string
          format: uuid
      - name: containers
        in: query
        description: Comma-separated container names the client can play, e.g. `"mp4"`.
        required: false
        schema:
          type: string
      - name: video_codecs
        in: query
        description: Comma-separated video codecs the client can play, e.g. `"h264"`.
        required: false
        schema:
          type: string
      - name: audio_codecs
        in: query
        description: |-
          Comma-separated audio codecs the client can play; informational
          only today -- see `TranscodeOrchestrator::can_direct_play`'s docs.
        required: false
        schema:
          type: string
      - name: max_bitrate_bps
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: profile
        in: query
        description: |-
          Target rendition profile name if a transcode is needed; defaults to
          `"h264-720p-4mbps"` (an unrecognized name still resolves to a sane
          default -- see `TranscodeTargetProfile::resolve`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: force_transcode
        in: query
        description: |-
          Skip direct play and produce the requested rendition profile. Used
          by an explicit player quality choice; omitted/false keeps Original
          as the default uncapped negotiation behaviour.
        required: false
        schema:
          type: boolean
      - name: start_position_ms
        in: query
        description: |-
          Absolute source timestamp at which a newly-created on-demand
          transcode should begin. Direct play and complete renditions ignore
          this and remain normally seekable by the player.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: audio_stream_index
        in: query
        description: |-
          Global ffprobe stream index of the source audio track to encode into
          an on-demand HLS session. Supplying this forces a fresh transcode so
          a track-specific stream never reuses a default-audio rendition.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: ignore_saved_preferences
        in: query
        description: |-
          Ignore this viewer's remembered per-media choices for this request.
          Used when the player explicitly switches back to Original/automatic.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Direct-play URL or HLS manifest URL, plus the new PlaybackSession id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackInfoResponse'
              example:
                audio_tracks:
                - channels: 6
                  codec: aac
                  id: source-audio-1
                  is_default: true
                  label: English (AAC 5.1)
                  language: eng
                  stream_index: 1
                duration_ms: 5400000
                mime_type: application/x-mpegURL
                mode: hls
                quality_options:
                - height: null
                  id: original
                  label: Original
                  profile: null
                  video_bitrate_bps: 15000000
                - height: 720
                  id: h264-720p-4mbps
                  label: HD Medium
                  profile: h264-720p-4mbps
                  video_bitrate_bps: 4000000
                selected_audio_track_id: source-audio-1
                selected_quality_id: h264-720p-4mbps
                selected_subtitle_track_id: null
                session_id: 9c8b7a6f-5e4d-3c2b-1a0f-9e8d7c6b5a4f
                source_offset_ms: 0
                subtitle_tracks:
                - codec: subrip
                  forced: false
                  id: source-subtitle-2
                  is_default: false
                  label: English
                  language: eng
                  stream_index: 2
                  url: /api/v1/media/3f9c1e2d-5a6b-4c7d-8e9f-0a1b2c3d4e5f/subtitles/2?source_offset_ms=0
                url: /api/v1/media/sessions/6a5e2c3e-2b9a-4b3e-9b7a-8e2f1c3d4a5b/playlist.m3u8
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller does not have Playarr streaming access
        '404':
          description: Unknown media_file_id
        '503':
          description: No on-demand transcode capacity available on this node
      security:
      - bearer_auth: []
