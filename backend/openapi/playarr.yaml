      type: object
      required:
      - season
      - episodes
      properties:
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeDetailSchema'
        season:
          $ref: '#/components/schemas/Season'
    SeasonalRule:
      type: object
      description: |-
        One seasonal rule. A rule is active when `date` falls in its window and
        (if set) its `hemisphere` matches the configured one.
      required:
      - key
      properties:
        easter_after_days:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Easter-relative window: days after Easter Sunday the rule ends.'
          minimum: 0
        easter_before_days:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Easter-relative window: days before Easter Sunday the rule starts.'
          minimum: 0
        end:
          type:
          - string
          - 'null'
          description: '`MM-DD` end of a fixed window (inclusive).'
        genres:
          type: array
          items:
            type: string
          description: Exact (case-insensitive) genre names.
        hemisphere:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Hemisphere'
            description: Only active for this hemisphere; `None` = both.
        key:
          type: string
          description: Stable key, also the localisation key for built-ins (`christmas`).
        keywords:
          type: array
          items:
            type: string
          description: Whole words/phrases matched against title and overview.
        name:
          type:
          - string
          - 'null'
          description: Display name override; `None` uses the localised built-in name.
        start:
          type:
          - string
          - 'null'
          description: |-
            `MM-DD` start of a fixed window (inclusive). The window wraps the new
            year when `end` is earlier than `start`.
        tags:
          type: array
          items:
            type: string
          description: Exact (case-insensitive) tags, e.g. an admin's `christmas` tag.
    SectionSummary:
      type: object
