        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        link_available:
          type: boolean
          description: |-
            `POST /api/v1/calendar/feed` would return the existing link unchanged.
            False for a link created before links could be shown again: asking for
            it then replaces it. Servers without this field always replace.
    CalendarGroupMember:
      type: object
      description: An episode folded into a grouped calendar entry.
      required:
      - id
      - monitored
      - has_file
      properties:
        episode_number:
          type:
          - integer
          - 'null'
          format: int64
        has_file:
          type: boolean
        id:
          type: string
        monitored:
          type: boolean
        season_number:
          type:
          - integer
          - 'null'
          format: int64
        subtitle:
          type:
          - string
          - 'null'
    CalendarMediaKind:
      type: string
      enum:
      - episode
      - movie
      - album
      - book
    CalendarReleaseType:
      type: string
      enum:
      - air
      - cinema
      - digital
      - physical
      - release
    CalendarResponse:
      type: object
      required:
      - start
      - end
      - entries
      - sources
      properties:
        end:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEntry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSourceStatus'
        start:
          type: string
          format: date
    CalendarSourceState:
      type: string
      enum:
      - ok
      - unreachable
      - rejected
      - error
    CalendarSourceStatus:
      type: object
      description: Per-instance outcome of one calendar query.
      required:
      - source_instance_id
      - name
      - kind
      - status
      - entry_count
      properties:
        display_label:
          type: string
          description: Neutral label (for example "Movies"); safe to show to any user.
        entry_count:
          type: integer
          format: int32
          minimum: 0
        error:
          type:
          - string
          - 'null'
          description: Short reason; never contains URLs or credentials.
        kind:
          $ref: '#/components/schemas/SourceKind'
        name:
          type: string
          description: Equals `display_label` in user-facing responses.
        source_instance_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CalendarSourceState'
    CapabilitiesResponse:
      type: object
      required:
      - generated_at
      - cached
      - items
      properties:
        cached:
          type: boolean
          description: '`true` when this response came from the short-lived cache.'
        generated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityItem'
    CapabilityCategory:
      type: string
      enum:
      - binary
      - encoder
      - hardware
    CapabilityItem:
