          - integer
          - 'null'
          format: int64
        keep_last:
          type:
          - integer
          - 'null'
          minimum: 0
        mode:
          type:
          - string
          - 'null'
        recipient_fingerprints:
          type: array
          items:
            type: string
          description: Short identifiers of the configured recovery public keys.
        restore_command:
          type: string
          description: Command to run on the replacement server to restore a backup.
        schedule_hours:
          type:
          - integer
          - 'null'
          format: int64
          description: Hours between scheduled runs; absent means manual only.
          minimum: 0
    BackupRunStatus:
      type: object
      required:
      - id
      - started_at
      - trigger
      - phase
      - bytes_staged
      properties:
        bytes_staged:
          type: integer
          format: int64
          minimum: 0
        id:
          type: string
        phase:
          type: string
          description: '`starting`, `preflight`, `snapshot`, `assets`, `archive`, `publish` or `retention`.'
        started_at:
          type: string
          format: date-time
        trigger:
          type: string
          description: '`manual`, `schedule` or `cli`.'
    BackupSummary:
      type: object
      required:
      - id
      - created_at
      - archive_name
      - size_bytes
      - engine
      - schema_version
      - server_version
      - mode
      - partial
      - complete
      - tables
      - rows
      - included
      - excluded
      - unavailable
      - library_roots
      - required_secrets
      properties:
        archive_name:
          type: string
        complete:
          type: boolean
          description: |-
            False when the archive named by the commit record is missing or has the
            wrong size. Incomplete backups are never offered for restore.
        created_at:
          type: string
          format: date-time
        engine:
          type: string
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/BackupInventoryItem'
        id:
          type: string
        included:
          type: array
          items:
            $ref: '#/components/schemas/BackupInventoryItem'
        library_roots:
          type: array
          items:
            type: string
        mode:
          type: string
          description: '`full` or `database`.'
        partial:
          type: boolean
          description: |-
            True when the backup does not contain everything (database mode, or an
            asset class skipped); see `unavailable` and `excluded`.
        required_secrets:
          type: array
          items:
            type: string
        rows:
          type: integer
          format: int64
          minimum: 0
        schema_version:
          type: integer
          format: int64
        server_version:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        tables:
          type: integer
          minimum: 0
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/BackupInventoryItem'
    BackupVerification:
      type: object
      required:
      - ok
      - expected_sha256
      - actual_sha256
      - size_bytes
      properties:
        actual_sha256:
          type: string
        expected_sha256:
          type: string
        ok:
          type: boolean
        size_bytes:
          type: integer
          format: int64
          minimum: 0
    Book:
