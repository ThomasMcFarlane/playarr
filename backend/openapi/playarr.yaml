      properties:
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
        kind:
          $ref: '#/components/schemas/DiscoveryKind'
        poster_url:
          type:
          - string
          - 'null'
        title:
          type: string
        work_id:
          type:
          - string
          - 'null'
          format: uuid
        year:
          type:
          - integer
          - 'null'
          format: int32
    TitleSource:
      type: object
      description: One source's claim on a title.
      required:
      - source
      - label
      - availability
      properties:
        availability:
          $ref: '#/components/schemas/SourceAvailability'
        edition:
          type:
          - string
          - 'null'
        label:
          type: string
          description: Human label, for example the library or peer name.
        provider_instance_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Provider instance (for example a Radarr source instance) for requests.
        reason:
          type:
          - string
          - 'null'
        source:
          $ref: '#/components/schemas/SourceKindTag'
        work_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Local work id when this source is the library.
    TokenResponseSchema:
      type: object
      description: Doc-only mirror of [`TokenResponse`]; see [`DeviceCodeResponseSchema`].
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        token_type:
          type: string
    Track:
      type: object
      required:
      - id
      - album_id
      - disc_number
      - track_number
      - title
      - availability
      properties:
        album_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        disc_number:
          type: integer
          format: int32
          minimum: 0
        duration_seconds:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        id:
          type: string
          format: uuid
        title:
          type: string
        track_number:
          type: integer
          format: int32
          minimum: 0
    TrackDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `playarr_catalog::TrackDetail`; see
        [`EpisodeDetailSchema`].
      required:
      - track
      properties:
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        track:
          $ref: '#/components/schemas/Track'
    TranscodeReason:
      oneOf:
      - type: string
        enum:
        - container_not_supported
      - type: string
        enum:
        - video_codec_not_supported
      - type: string
        enum:
        - audio_codec_not_supported
      - type: string
        enum:
        - video_bitrate_exceeds_limit
      - type: string
        enum:
        - resolution_exceeds_limit
      - type: string
        enum:
        - subtitle_burn_in_required
      - type: string
        description: |-
          Server-side policy override (e.g. bandwidth cap) rather than a
          client capability gap.
        enum:
        - server_policy
      - type: object
        required:
        - other
        properties:
          other:
            type: string
      description: |-
        Why a session couldn't direct-play/direct-stream and had to fall back to
        a transcode. Populated only when `play_method == Transcode`.
    TransferLinkResponse:
      type: object
      required:
      - path
      - url
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: |-
            The link stops working at this time (at most 15 minutes) or after its
            first use, whichever is first.
        path:
          type: string
          description: |-
            Origin-relative path of the one-time link; resolve it against the
            server address the client already uses and show it as a QR code.
        url:
          type: string
          description: |-
            The same link as an absolute URL built from the address the request
            arrived on (proxy headers honoured), ready for a QR code.
    UnavailableNodeView:
      type: object
      description: |-
        A peer that could not contribute to a group-wide activity response.
        Failures are row-level metadata rather than whole-request errors so an
        administrator can still inspect every reachable node.
      required:
      - peer_node_id
      - peer_node_name
      - error
      properties:
        error:
          type: string
        peer_node_id:
          type: string
          format: uuid
        peer_node_name:
          type: string
    UnlockRequest:
      type: object
      description: |-
        Body of `POST /api/v1/auth/unlock`: the stored refresh credential of a
        PIN-locked profile plus its PIN.
      required:
      - device_id
      - refresh_token
      - pin
      properties:
        device_id:
          type: string
          format: uuid
        pin:
          type: string
        refresh_token:
          type: string
    UnratedContent:
      type: string
      description: |-
        What to do with content that has no usable rating when the profile has a
        `max_rating` ceiling. Defaults to blocking: an unknown rating must not be
        treated as "safe" for a child profile.
      enum:
      - block
      - allow
    UpdateFolderRootRequest:
      type: object
      properties:
        local_path:
          type:
          - string
          - 'null'
          description: Absolute directory on this server; an empty string clears the override.
        name:
          type:
          - string
          - 'null'
        scan_enabled:
          type:
          - boolean
          - 'null'
    UpdateHomeRailRequest:
      type: object
      properties:
        config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HomeRailConfig'
        enabled:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
          description: |-
            `null`/absent keeps the current title; an empty string clears the
            override.
        view_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Custom rails only.
    UpdateMediaPlaybackPreferencesRequest:
      type: object
      required:
      - quality_id
      properties:
        audio_track_id:
          type:
          - string
          - 'null'
        quality_id:
          type: string
        subtitle_track_id:
          type:
          - string
          - 'null'
    UpdatePlayerPreferencesRequest:
      type: object
      required:
      - preferred_audio_language
      properties:
        preferred_audio_language:
          type: string
    UpdatePlaylistRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
    UpdateProfileAvatarRequest:
      type: object
      required:
      - preference
      properties:
        preference:
          $ref: '#/components/schemas/ProfileAvatarPreference'
    UpdateProfilePinRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type:
          - string
          - 'null'
          description: Exactly four ASCII decimal digits. `null` removes the profile lock.
    UpdateSystemSettingsRequest:
      type: object
      required:
      - instance_name
      properties:
        instance_name:
          type: string
    UpdateUserRequest:
      type: object
      description: |-
        All-optional patch body -- only fields set to `Some` are applied.
        `password`, when set, is re-hashed the same way [`CreateUserRequest`]'s
        is; `is_admin`, when set, updates the user's [`Policy`] rather than the
        `User` row itself (`is_admin` lives on `Policy`, not `User`).
      properties:
        can_download:
          type:
          - boolean
          - 'null'
          description: |-
            `Some(bool)` replaces the account's `Policy::can_download`; `None`
            (the field omitted) leaves it untouched -- same all-optional-patch
            shape as every other field here.
        can_request:
          type:
          - boolean
          - 'null'
          description: |-
            `Some(bool)` replaces the account's `Policy::can_request`; `None`
            leaves it untouched.
        can_stream:
          type:
          - boolean
          - 'null'
        disabled:
          type:
          - boolean
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        is_admin:
          type:
          - boolean
          - 'null'
        library_allow:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: |-
            `Some(ids)` replaces the account's entire `Policy::library_allow`
            with `ids`; `None` (the field omitted from the request body) leaves
            it untouched -- same all-optional-patch shape as every other field
            here. See [`update_user_handler`]'s doc comment for how this is
            folded into the same single conditional policy re-persist
            `is_admin`/`can_stream` already use.
        password:
          type:
          - string
          - 'null'
    UpdateWatchProgressRequest:
      type: object
      required:
      - position_ms
      - duration_ms
      properties:
        completed:
          type: boolean
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this progress update actually happened, RFC3339. Optional and
            additive -- lets an offline-buffered client (one that kept recording
            progress while disconnected and is only now replaying it) timestamp
            the update for when it occurred rather than when it's replayed after
            reconnecting. Omitted by every existing caller, who get the prior
            behaviour unchanged: the server falls back to `Utc::now()`.
        position_ms:
          type: integer
          format: int64
          minimum: 0
    UserInviteRequestResponse:
      type: object
      description: |-
        One Playarr user's request for permission to invite a friend. User
        identity is included so the admin console can review the queue without
        making a second request per row.
      required:
      - id
      - user_id
      - username
      - display_name
      - status
      - requested_at
      - can_stream
      - library_allow
      properties:
        can_stream:
          type: boolean
        display_name:
          type: string
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        library_allow:
          type: array
          items:
            type: string
            format: uuid
        message:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/UserInviteRequestStatus'
        user_id:
          type: string
          format: uuid
        username:
          type: string
    UserInviteRequestStatus:
      type: string
      enum:
      - pending
      - approved
      - denied
      - generated
    UserInviteResponse:
      type: object
      description: |-
        The raw invite token is returned only when it is issued. Persistence
        stores its digest, so this response is the administrator's sole chance to
        put the bearer token into the QR link.
      required:
      - invite_token
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        invite_token:
          type: string
    UserMappingStrategy:
      type: string
      description: How a Playarr user is matched to a user of the external system.
      enum:
      - email
      - username
      - map
    UserResponse:
      type: object
      description: |-
        The redacted, admin-facing projection of [`playarr_model::User`] --
        same rationale as `admin.rs`'s `SourceInstanceResponse`: `User` itself
        is deliberately not `ToSchema` (it carries `password_hash`), so
        handlers map to this secret-free DTO instead. `is_admin` is pulled in
        from the user's `Policy` (see [`UserResponse::from_user`])
        since it isn't a field on `User` at all.
      required:
      - id
      - username
      - display_name
      - is_admin
      - can_stream
      - library_allow
      - can_download
      - can_request
      - disabled
      - created_at
      - preferred_audio_language
      properties:
        can_download:
          type: boolean
          description: |-
            Whether this account may create/fetch downloads -- see
            `playarr_model::Policy::can_download`'s doc comment. Independent
            of `can_stream`/`library_allow`; defaults to `false` for a newly
            created account.
        can_request:
          type: boolean
          description: |-
            Whether this account may request titles that are not in the
            library -- see `playarr_model::Policy::can_request`'s doc comment.
        can_stream:
          type: boolean
          description: |-
            Whether this account is permitted to sign in to Playarr -- see
            `playarr_model::Policy::can_stream`'s doc comment. Independent of
            `is_admin`.
        created_at:
          type: string
          format: date-time
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `playarr_model::Policy::library_allow`'s doc comment. Empty
            means no grants (deny-all), not all-allow; irrelevant (but still
            truthfully reported) for an `is_admin` account, since `is_admin`
            bypasses this check entirely at enforcement time.
        preferred_audio_language:
          type: string
        username:
          type: string
    VerifyProfilePinRequest:
      type: object
      required:
      - pin
      properties:
        pin:
          type: string
    VerifyProfilePinResponse:
      type: object
      required:
      - verified
      properties:
        verified:
          type: boolean
    VersionEnvelope:
      type: object
      description: Response body for `GET /api/system/version`.
      required:
      - instance_name
      - server_version
      - api_version
      - compatibility
      properties:
        api_version:
          type: string
        build_sha:
          type:
          - string
          - 'null'
        compatibility:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilityEntry'
        instance_name:
          type: string
        server_version:
          type: string
    ViewCriteriaDto:
      type: object
      properties:
        audio_languages:
          type: array
          items:
            type: string
          description: Canonical audio language codes (e.g. `"ja"`); empty = any.
        available_only:
          type: boolean
        genre:
          type:
          - string
          - 'null'
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
        language_every_file:
          type: boolean
          description: Require each wanted language on every file of the work.
        language_match_all:
          type: boolean
          description: Require every listed language instead of any of them.
        release_window_days:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Only include works whose `release_date` falls within the last N
            days. `None` = no window restriction.
        source_instance_id:
          type:
          - string
          - 'null'
          format: uuid
        subtitle_languages:
          type: array
          items:
            type: string
          description: Canonical subtitle language codes; empty = any.
        tag:
          type:
          - string
          - 'null'
        unwatched_only:
          type: boolean
          description: Hide works the viewer has already watched (per-user).
    ViewSummary:
      type: object
      description: |-
        Public/Playarr-facing list projection -- deliberately doesn't expose
        `criteria` (Playarr never needs to interpret filter internals, only
        call `resolve`).
      required:
      - id
      - name
      - is_default
      properties:
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
    WatchProgress:
      type: object
      description: Durable resume position for one user and one media file.
      required:
      - media_file_id
      - work_id
      - position_ms
      - duration_ms
      - state
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        media_file_id:
          type: string
          format: uuid
        position_ms:
          type: integer
          format: int64
          minimum: 0
        state:
          $ref: '#/components/schemas/WatchState'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            `None` is used only for the synthetic unseen response returned when
            no durable progress row exists yet.
        work_id:
          type: string
          format: uuid
    WatchState:
      type: string
      description: The viewer-facing state derived from a durable playback position.
      enum:
      - unseen
      - part_watched
      - watched
    WatchlistEntry:
      allOf:
      - $ref: '#/components/schemas/ResolvedTitle'
      - type: object
        required:
        - added_at
        properties:
          added_at:
            type: string
            format: date-time
    WatchlistResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistEntry'
    WatchlistSummary:
      type: object
      required:
      - total
      - will_add
      - already_present
      - unmatched
      properties:
        already_present:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        unmatched:
          type: integer
          description: Records that are invalid or of a kind this server does not know.
          minimum: 0
        will_add:
          type: integer
          minimum: 0
    WebhookAck:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    Weekday:
      type: string
      enum:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    Work:
      type: object
      description: |-
        The aggregate root for anything in the catalog. A movie is a `Work` of
        kind `Movie` with no children; a series/artist/author is a `Work` whose
        children (seasons, albums, books) live in their own tables keyed by
        `Work::id`.
      required:
      - id
      - kind
      - external_refs
      - title
      - sort_title
      - images
      - genres
      - tags
      - added_at
      - monitored
      - availability
      properties:
        added_at:
          type: string
          format: date-time
        availability:
          $ref: '#/components/schemas/Availability'
        end_date:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When an ended `Series` last aired, per Sonarr (`lastAired`, else
            `previousAiring`, only while Sonarr reports the series as ended). `None`
            for movies, running series and anything without a known last-aired date.
            Clients show it as the end of the year range ("Series · 2011-2019").
            See `backend/migrations/sqlite/0080_work_end_date.sql`.
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
        genres:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
        kind:
          $ref: '#/components/schemas/WorkKind'
        monitored:
          type: boolean
          description: |-
            Whether Playarr Server should actively track/request missing children of
            this work (mirrors the *arr "monitored" concept).
        overview:
          type:
          - string
          - 'null'
        release_date:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When this title was actually released, per its source *arr app
            (Radarr `digitalRelease`/`physicalRelease`, Sonarr `firstAired`) --
            distinct from `added_at` (when Playarr Server itself learned about the
            work). Populated by `playarr-arr-sync` for `Movie`/`Series`/`Site`
            kinds only; `Artist`/`Author` works have no single release date of
            their own (their children -- albums/books -- each carry one already),
            so this stays `None` for those kinds. See
            `backend/migrations/sqlite/00{11,14}_work_release_date.sql`.
        sort_title:
          type: string
          description: |-
            Normalized title used for alphabetical sort/browse ("Test Film,
            The" rather than "The Test Film").
        tags:
          type: array
          items:
            type: string
          description: |-
            Free-form user/automation tags (distinct from `genres`, which come
            from metadata providers); used by [`crate::Policy`] tag filters.
        title:
          type: string
    WorkChildrenSchema:
      oneOf:
      - type: string
        enum:
        - Movie
      - type: object
        required:
        - Series
        properties:
          Series:
            type: array
            items:
              $ref: '#/components/schemas/SeasonDetailSchema'
      - type: object
        required:
        - Artist
        properties:
          Artist:
            type: array
            items:
              $ref: '#/components/schemas/AlbumDetailSchema'
      - type: object
        required:
        - Author
        properties:
          Author:
            type: array
            items:
              $ref: '#/components/schemas/BookDetailSchema'
      description: |-
        Doc-only mirror of `playarr_catalog::WorkChildren`; see
        [`CatalogPageSchema`].
    WorkCreditsResponse:
      type: object
      required:
      - cast
      - crew
      properties:
        cast:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
        crew:
          type: array
          items:
            $ref: '#/components/schemas/CreditResponse'
    WorkDetailSchema:
      type: object
      required:
      - work
      - children
      - available_on
      properties:
        available_on:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityBadge'
          description: |-
            Cross-peer availability for `work` (§4.3) -- empty for a deployment
            not part of a peer group.
        children:
          $ref: '#/components/schemas/WorkChildrenSchema'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            The resolved `MediaFile` id for a movie's own leaf (`LeafRef::Work`);
            always `None` for series/artist/author works, whose playable leaves
            are their children instead -- see `playarr_catalog::WorkDetail`.
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Fixed source-container runtime for a movie. Series runtimes are
            exposed on each `EpisodeDetailSchema`.
          minimum: 0
        work:
          $ref: '#/components/schemas/Work'
    WorkKind:
      type: string
      description: |-
        The top-level taxonomy Playarr Server understands. Deliberately small and
        closed: everything else (season, album, book...) is a child of a `Work`
        rather than a `Work` in its own right, because those children don't have
        independent lifecycle/monitoring semantics at the top level.
      enum:
      - movie
      - series
      - site
      - artist
      - author
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    peer_id_header:
      type: apiKey
      in: header
      name: X-Playarr-Peer-Id
      description: UUID of the peer signing this request
    peer_nonce_header:
      type: apiKey
      in: header
      name: X-Playarr-Nonce
      description: Unique nonce covered by the peer signature
    peer_signature_header:
      type: apiKey
      in: header
      name: X-Playarr-Signature
      description: Base64 Ed25519 signature over the canonical request
    peer_timestamp_header:
      type: apiKey
      in: header
      name: X-Playarr-Timestamp
      description: Unix timestamp covered by the peer signature
tags:
- name: system
  description: Process health, readiness, and version endpoints
- name: auth
  description: Session login and access-token issuance
- name: oauth
  description: RFC 8628 OAuth 2.0 device authorization endpoints
- name: webhooks
  description: '*arr webhook receiver'
- name: catalog
  description: Catalog browse/search/detail
- name: calendar
  description: Aggregated release calendar across the connected *arr instances, and the external iCal subscription
- name: playback
  description: 'Playback negotiation: direct-play vs. transcode decision'
- name: admin
  description: 'Admin-only configuration: registering *arr source instances'
- name: users
  description: User account management and signed-in player preferences
- name: home
  description: Server-computed Home rails (recently added/released, top unwatched, rediscover, seasonal, custom) with admin management and per-user preferences
- name: views
  description: Saved catalog filter presets ('Views') -- admin-managed, surfaced to Playarr as browsable shelves
- name: requests
  description: Unified media requests and the Ombi/Seerr integrations
- name: discovery
  description: Unified discovery search across library, peers and request catalogues, plus the per-profile watchlist and source-aware title actions
- name: playlists
  description: User + System playlists -- named, ordered, optionally-nested lists of video works or audio tracks
- name: portability
  description: Self-service export and import of the signed-in user's own library data (watch progress, playlists, preferences)
- name: credits
  description: Cast/crew for a work, and every work a given person is credited on
- name: downloads
  description: Server-staged, quality-selectable, resumable downloads of media the caller already has playback access to
- name: events
  description: Per-user live change stream (server-sent events; see docs/architecture/live-events.md)
- name: remote
  description: Phone remote pairing, remote commands and transactional playback handoff (see docs/architecture/remote-control.md)
- name: household
  description: 'Household and child controls: profile status, schedules, guardian approvals'
- name: folders
  description: Native folder browsing of administrator-enabled root folders (unsorted media)
- name: peer-groups
  description: Multi-node peer group identity, founding, and join flow (see docs/architecture/peer-groups.md)
