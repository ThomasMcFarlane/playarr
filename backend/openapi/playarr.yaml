        command_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
    CommandRequest:
      type: object
      required:
      - kind
      - payload
      properties:
        kind:
          type: string
          description: '`navigate`, `text`, `playback` or `input`.'
        payload:
          description: |-
            navigate: `{key}`; text: `{value, mode?: insert|replace|backspace, submit?}`;
            playback: `{action, position_ms?, delta_ms?, language?, level?}`; input: `{input_id}`.
    CommandStatusResponse:
      type: object
      required:
      - command_id
      - status
      properties:
        command_id:
          type: string
          format: uuid
        detail:
          type:
          - string
          - 'null'
        status:
          type: string
          description: '`queued`, `delivered`, `ok`, `failed`, `unsupported`, `revoked` or `expired`.'
    CompatibilityEntry:
      type: object
      description: |-
        One platform's row in the compatibility table: what the latest client
        build is, the floor below which the version-gate middleware rejects
        requests outright, and the floor below which it should nag-but-allow.
      required:
      - platform
      - latest_version
      - min_supported_version
      properties:
        deprecated_below:
          type:
          - string
          - 'null'
        latest_version:
          type: string
        min_supported_version:
          type: string
        platform:
          $ref: '#/components/schemas/ClientPlatform'
        sunset:
          type:
          - string
          - 'null'
          description: |-
            RFC 3339 timestamp after which `min_supported_version` will be
            ratcheted up; surfaced to clients so they can warn users ahead of
            time rather than being cut off with no notice.
    CreateApprovalRequest:
      type: object
      required:
      - kind
      - subject
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        note:
          type:
          - string
          - 'null'
        subject:
          type: string
          description: '`content`: a work id. `time`: `schedule` or `budget`.'
