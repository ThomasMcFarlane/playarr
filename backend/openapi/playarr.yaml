  /api/v1/users/me/user-invite-request:
    get:
      tags:
      - users
      summary: |-
        Returns the signed-in user's most recent request, or `null` before they
        have requested permission.
      operationId: get_my_user_invite_request_handler
      responses:
        '200':
          description: Latest invitation request, if any
          content:
            application/json:
              schema:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/UserInviteRequestResponse'
              example:
                can_stream: true
                display_name: Alice Nguyen
                generated_at: null
                id: 33333333-3333-4333-8333-333333333333
                library_allow:
                - 11111111-1111-4111-8111-111111111111
                message: Can I invite my roommate?
                requested_at: 2026-07-20T12:00:00Z
                reviewed_at: 2026-07-20T13:00:00Z
                status: approved
                user_id: 22222222-2222-4222-8222-222222222222
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
      security:
      - bearer_auth: []
    post:
      tags:
      - users
      summary: |-
        Opens (or returns) the signed-in user's current invitation request. A
        pending or approved request remains the one active request; denied and
        generated requests may be followed by a new request.
      operationId: create_user_invite_request_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInviteRequest'
            example:
              message: Can I invite my roommate?
        required: true
      responses:
        '200':
          description: Current invitation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteRequestResponse'
              example:
                can_stream: true
                display_name: Alice Nguyen
                generated_at: null
                id: 33333333-3333-4333-8333-333333333333
                library_allow: []
                message: Can I invite my roommate?
                requested_at: 2026-07-20T12:00:00Z
                reviewed_at: null
                status: pending
                user_id: 22222222-2222-4222-8222-222222222222
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
      security:
      - bearer_auth: []
  /api/v1/users/me/user-invite-request/generate:
    post:
      tags:
      - users
      summary: |-
        Consumes one approval and creates the final one-use invitation. Its
        24-hour lifetime begins here, not when the administrator approved it.
      operationId: generate_user_invite_handler
      responses:
        '200':
          description: Friend invitation generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteResponse'
              example:
                expires_at: 2026-07-21T13:00:00Z
                invite_token: 9c1e2b3d4f6a8c1e2b3d4f6a8c1e2b3d
        '401':
          description: Missing or invalid access token
        '403':
          description: Account cannot use Playarr
        '409':
          description: No unused approval is available
      security:
      - bearer_auth: []
  /api/v1/users/profiles:
    get:
      tags:
      - users
      summary: |-
        Every account this endpoint returns is implicitly disclosed -- id,
        username, display name, PIN-lock status -- to every other account it's
        also returned to. That's the intended "who's watching" tradeoff *within
        one household* (`AuthMode::TrustedNetwork`/`ManagedProfiles`: nobody
        reaches this endpoint who isn't already on the trusted LAN, so household
        members already know who else lives there). It stops being a reasonable
        tradeoff the moment two accounts might belong to unrelated people
        (`AuthMode::FullAccount`, "remote access, shared with people outside the
        household" per `docs/architecture/auth-modes.md`) -- there is no
        `household_id` or account-grouping concept anywhere in `playarr-model`/
        `playarr-db` to scope by (see that doc's "no `household_id`... claim"
        note), so under `FullAccount` this must fall back to "every account is a
        stranger" and list only the caller's own profile. This is a strict
        server-side gate, not merely relied on by the client: it must hold even
        for a direct API call, not just Playarr's own UI.
      operationId: list_available_profiles_handler
      responses:
        '200':
          description: Enabled Playarr profiles available to the caller -- every enabled account under AuthMode::TrustedNetwork/ManagedProfiles (single trusted household), or only the caller's own account under AuthMode::FullAccount (accounts may belong to unrelated people)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableProfileResponse'
              example:
              - display_name: Alice Nguyen
                id: 22222222-2222-4222-8222-222222222222
                is_current: true
                pin_locked: false
                username: alice
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller does not have Playarr streaming access
      security:
      - bearer_auth: []
  /api/v1/users/profiles/{id}/verify-pin:
    post:
      tags:
      - users
      operationId: verify_profile_pin_handler
      parameters:
      - name: id
        in: path
        description: Profile user id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyProfilePinRequest'
            example:
              pin: '4821'
        required: true
      responses:
        '200':
          description: The profile is unlocked for switching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyProfilePinResponse'
              example:
                verified: true
        '401':
          description: The target profile is unavailable or the PIN is invalid
        '403':
          description: Caller does not have Playarr streaming access, or a restricted caller targets a less restricted profile that has no PIN (`guardian_pin_required`)
        '429':
          description: Too many incorrect PIN attempts (`pin_locked`, with `retry_after_seconds`)
      security:
      - bearer_auth: []
  /api/v1/views:
    get:
      tags:
      - views
      summary: |-
        Every view, minimal projection -- the Playarr-facing shelf list. Ordered
        by [`sort_views_for_display`], identically to the admin list, so
        Playarr's shelf order always matches what the admin UI shows.
      operationId: list_views_handler
      responses:
        '200':
          description: Every view, minimal projection, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewSummary'
              example:
              - default_order: 0
                id: 8f14e45f-ceea-467e-adc0-8b95e6b0a0f1
                is_default: true
                name: Newly Added
              - default_order: 1
                id: 0c85e0f1-9c6e-4b3a-9a6b-4a1f2e9c7d3b
                is_default: true
                name: Newly Released
              - default_order: null
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                is_default: false
                name: Newly Added Action
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
      security:
      - bearer_auth: []
  /api/v1/views/{id}/resolve:
    get:
      tags:
      - views
      summary: |-
        Runs a saved view's criteria+sort against the live catalog (via
        `CatalogService::resolve_view`) and returns a page of results, identical
        in shape to `GET /api/v1/catalog`. Also passes `viewer.allowed_libraries()`
        through, so a resolved view is silently narrowed to the caller's
        per-user library access control ceiling exactly like `GET /api/v1/
        catalog` itself is -- a saved view is just a stored `BrowseQuery` shape,
        not a separate enforcement boundary (see `CatalogService::resolve_view`'s
        doc comment).
      operationId: resolve_view_handler
      parameters:
      - name: id
        in: path
        description: View id
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: A page of catalog works matching this view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageSchema'
              example:
                items:
                - added_at: 2026-01-10T08:30:00Z
                  availability: available
                  external_refs:
                  - external_id: '603'
                    provider: tmdb
                  genres:
                  - Action
                  - Science Fiction
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  images:
                  - height: 750
                    kind: poster
                    url: https://image.tmdb.org/t/p/original/poster.jpg
                    width: 500
                  kind: movie
                  monitored: true
                  overview: A computer hacker learns about the true nature of reality.
                  release_date: 1999-03-31T00:00:00Z
                  sort_title: Sample Movie, The
                  tags: []
                  title: The Sample Movie
                total: 1
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
        '404':
          description: No view with this id
      security:
      - bearer_auth: []
  /api/v1/watchlist:
    get:
      tags:
      - discovery
      operationId: list_watchlist_handler
      responses:
        '200':
          description: The caller's watchlist, newest first, with current actions
          content:
            application/json:
