        '401':
          description: Missing or invalid access token
        '403':
          description: Caller has neither Playarr streaming access nor admin access
      security:
      - bearer_auth: []
  /webhooks/{instance_id}:
    post:
      tags:
      - webhooks
      operationId: arr_webhook_handler
      parameters:
      - name: instance_id
        in: path
        description: Configured SourceInstance id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
            example:
              eventType: SeriesAdd
              series:
                id: 42
                title: Test Series D
                tvdbId: 275908
        required: true
      responses:
        '202':
          description: Signal parsed and enqueued for the reconciliation poller
        '400':
          description: Payload has no recognizable eventType
        '404':
          description: Unknown source_instance_id
components:
  schemas:
    AccessWindow:
      type: object
      required:
      - weekday
      - time_range
      properties:
        time_range:
          $ref: '#/components/schemas/TimeRange'
        weekday:
          $ref: '#/components/schemas/Weekday'
    AccountsResponse:
      type: object
      description: |-
        Response body for [`accounts_handler`] -- `docs/architecture/
        peer-groups.md` §3.6: `{users, policies}` upserts/tombstones.
      required:
      - users
      - policies
      - server_time
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PeerPolicyRow'
        server_time:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/PeerUserRow'
    AckEventRequest:
      type: object
      required:
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Short non-sensitive reason (never user input).
        status:
          type: string
          description: '`ok`, `failed` or `unsupported`.'
    AckHandoffRequest:
      type: object
      required:
      - status
      properties:
        position_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Position the destination actually started at (required for `playing`).
          minimum: 0
        reason:
          type:
          - string
          - 'null'
        status:
          type: string
          description: '`playing` or `failed`.'
    ActionKind:
      type: string
      enum:
      - play
      - resume
      - request
      - record
      - launch
    ActiveSessionView:
      type: object
      description: |-
        One live session, enriched with the labels and route target used by the
        administrator Activity and Tasks pages.
      required:
      - session_id
      - user_id
      - device_id
      - media_file_id
      - peer_node_id
      - peer_node_name
      - peer_node_is_self
      - duration_ms
      - play_method
      - target_codec
      - target_container
      - client_platform
      - client_version
      - started_at
      - bytes_streamed
      - buffering_events
      - buffering_ms_total
      properties:
        buffering_events:
          type: integer
          format: int32
          minimum: 0
        buffering_ms_total:
          type: integer
          format: int64
          minimum: 0
        bytes_streamed:
          type: integer
          format: int64
          minimum: 0
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        library_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Group-wide library id when the source is mapped to one; otherwise the
            node-local source-instance id is the effective standalone library id.
        library_name:
          type:
          - string
          - 'null'
        media_file_id:
          type: string
          format: uuid
        media_title:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `CatalogService` lookup. For child media, this names the
            actual episode, track, or book rather than only its parent work.
        peer_node_id:
          type: string
          format: uuid
        peer_node_is_self:
          type: boolean
        peer_node_name:
          type: string
        play_method:
          $ref: '#/components/schemas/PlayMethod'
        session_id:
          type: string
          format: uuid
        source_instance_id:
          type:
          - string
          - 'null'
          format: uuid
        source_instance_name:
          type:
          - string
          - 'null'
        started_at:
          type: string
          format: date-time
        target_codec:
          type: string
        target_container:
          type: string
        user_display_name:
          type:
          - string
          - 'null'
          description: |-
            Best-effort `UserRepo` lookup; `None` on a lookup miss/failure,
            never surfaced as an error -- a live-sessions view degrading to
            showing a bare id for one row is far better than failing the whole
            list over one bad lookup.
        user_id:
          type: string
          format: uuid
        work_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Best-effort media-file lookup; provides the route target for the
            linked item title in Playarr Server Admin.
    AddPlaylistItemRequest:
      type: object
      required:
      - work_id
      properties:
        track_id:
          type:
          - string
          - 'null'
          format: uuid
        work_id:
          type: string
          format: uuid
    AdminFolderRootResponse:
      type: object
      required:
      - id
      - source_instance_id
      - source_name
      - library_kind
      - name
      - reported_path
      - effective_path
      - manual
      - active
      - scan_enabled
      - path_available
      - scan_status
      - item_count
      properties:
        active:
          type: boolean
        effective_path:
          type: string
          description: The directory the scanner will actually walk.
        id:
          type: string
          format: uuid
        item_count:
          type: integer
          format: int64
          minimum: 0
        last_scanned_at:
          type:
          - string
          - 'null'
          format: date-time
        library_kind:
          $ref: '#/components/schemas/WorkKind'
        local_path:
          type:
          - string
          - 'null'
          description: Explicit path on this server, when set.
        manual:
          type: boolean
        name:
          type: string
        path_available:
          type: boolean
          description: Whether the effective path is a readable directory on this server.
        reported_path:
          type: string
          description: The path as the source application (or the administrator) reported it.
        scan_enabled:
          type: boolean
        scan_error:
          type:
          - string
          - 'null'
        scan_status:
          $ref: '#/components/schemas/FolderScanStatus'
        source_instance_id:
          type: string
          format: uuid
        source_name:
          type: string
    AdminFolderRootsResponse:
      type: object
      required:
      - roots
      - failed_source_instance_ids
      properties:
        failed_source_instance_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Sources whose root folders could not be discovered (only on `discover`).
        roots:
          type: array
          items:
            $ref: '#/components/schemas/AdminFolderRootResponse'
    Album:
      type: object
      required:
      - id
      - artist_work_id
      - title
      - images
      - album_type
      - monitored
      - availability
      properties:
        album_type:
          $ref: '#/components/schemas/AlbumType'
        artist_work_id:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/Availability'
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
        monitored:
          type: boolean
        release_date:
          type:
          - string
          - 'null'
          format: date
        title:
          type: string
    AlbumDetailSchema:
      type: object
      required:
      - album
      - tracks
      properties:
        album:
          $ref: '#/components/schemas/Album'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackDetailSchema'
    AlbumType:
      type: string
      enum:
      - studio
      - live
      - compilation
      - ep
      - single
      - soundtrack
    Approval:
      type: object
      description: A guardian approval request and, once decided, its bounded grant.
      required:
      - id
      - profile_user_id
      - kind
      - subject
      - status
      - requested_at
      - request_expires_at
      - bonus_seconds
      properties:
        bonus_seconds:
          type: integer
          format: int64
          description: Extra watch seconds for a `Time`/`budget` grant.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_by:
          type:
          - string
          - 'null'
          format: uuid
        grant_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: An approved grant is unusable at or after this time.
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        note:
          type:
          - string
          - 'null'
        profile_user_id:
          type: string
          format: uuid
        request_expires_at:
          type: string
          format: date-time
          description: |-
            A pending request that is not decided by this time can no longer be
            approved.
        requested_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        subject:
          type: string
          description: '`Content`: the work id. `Time`: `"schedule"` or `"budget"`.'
    ApprovalKind:
      type: string
      description: Things a guardian can be asked to approve.
      enum:
      - content
      - time
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - denied
    ApprovePairingRequest:
      type: object
      properties:
        scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Narrow the granted scopes to a subset of those requested.
    Availability:
      type: string
      description: |-
        Where in the availability pipeline a `Work` (or a leaf under it) is
        sitting. This intentionally mirrors the *arr apps' own state machine
        (queued/downloading/imported) but is normalized into one shared enum so
        catalog and playback code doesn't need to know which *arr produced it.
      enum:
      - unknown
      - pending
      - processing
      - partially_available
      - available
      - deleted
    AvailabilityBadge:
      type: object
      description: |-
        One peer's reported availability for a `Work`, per
        `docs/architecture/peer-groups.md` §4.3's Rust sketch. Mirrors
        [`playarr_catalog::AvailabilityBadge`] field-for-field: that type
        can't implement `ToSchema` itself (`playarr-catalog` deliberately
        doesn't depend on `utoipa`, same as every other type this file mirrors
        for OpenAPI purposes), and [`SearchResponse`] below needs a real,
        `ToSchema`-implementing type to actually return -- so, unlike
        `CatalogPageSchema`/`WorkDetailSchema`'s purely-decorative mirrors, this
        one is genuinely constructed (via the `From` impl below), not just
        `#[allow(dead_code)]` documentation. Named without the `Schema` suffix
        those use, matching the design doc's own naming for this DTO exactly.
      required:
      - peer_node_id
      - peer_name
      - availability
      - updated_at
      properties:
        availability:
          $ref: '#/components/schemas/Availability'
        peer_name:
          type: string
        peer_node_id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
    AvailabilityLag:
      type: object
      description: Average time until availability for one series, movie, artist or author.
      required:
      - sample_count
      - backfill_count
      - unknown_count
      - backfill_threshold_days
      - samples
      properties:
        average_grab_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Mean seconds from release to first grab over the same samples.
        average_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Mean seconds from air/release to first import; `null` with no samples.
        backfill_count:
          type: integer
          format: int32
          description: |-
            Items first imported more than `backfill_threshold_days` after release:
            counted here and excluded from the average.
          minimum: 0
        backfill_threshold_days:
          type: integer
          format: int32
          minimum: 0
        sample_count:
          type: integer
          format: int32
          description: Items that contributed to `average_seconds`.
          minimum: 0
        samples:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityLagSample'
          description: Most recent samples, newest first (at most 20).
        unknown_count:
          type: integer
          format: int32
          description: 'Items with no release time, or imported before it aired: excluded.'
          minimum: 0
    AvailabilityLagSample:
      type: object
      required:
      - air_at
      - imported_at
      - lag_seconds
      properties:
        air_at:
          type: string
          format: date-time
        episode_number:
          type:
          - integer
          - 'null'
          format: int64
        imported_at:
          type: string
          format: date-time
        lag_seconds:
          type: integer
          format: int64
        season_number:
          type:
          - integer
          - 'null'
          format: int64
    AvailabilityResponse:
      type: object
      description: Response body for [`availability_handler`].
      required:
      - rows
      - server_time
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PeerAvailabilityRow'
        server_time:
          type: string
    AvailableProfileResponse:
      type: object
      description: |-
        Minimal household-profile projection for Playarr's 'who is watching'
        screen. Password hashes, email addresses and policy details are never
        exposed.

        Only ever lists *sibling* profiles -- accounts that share the operator's
        single-household trust boundary. See
        [`list_available_profiles_handler`]'s doc comment for what "sibling"
        means per `AuthMode` and why this must never include a stranger's
        account.
      required:
      - id
      - username
      - display_name
      - is_current
      - pin_locked
      properties:
        display_name:
          type: string
        id:
          type: string
          format: uuid
        is_current:
          type: boolean
        pin_locked:
          type: boolean
        username:
          type: string
    BackupFailure:
      type: object
      required:
      - id
      - at
      - phase
      - error
      properties:
        at:
          type: string
          format: date-time
        error:
          type: string
        id:
          type: string
        phase:
          type: string
    BackupInventoryItem:
      type: object
      required:
