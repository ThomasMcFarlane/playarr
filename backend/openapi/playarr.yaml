openapi: 3.1.0
info:
  title: Playarr Server API
  description: 'The Playarr Server Axum HTTP server: OpenAPI-annotated system routes, health/readiness, and the client-version-enforcement middleware.'
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /api/system/health:
    get:
      tags:
      - system
      operationId: health_handler
      responses:
        '200':
          description: The process is alive and serving HTTP requests
  /api/system/ready:
    get:
      tags:
      - system
      operationId: readiness_handler
      responses:
        '200':
          description: Ready to serve traffic
        '503':
          description: Not ready yet (or no longer ready)
  /api/system/version:
    get:
      tags:
      - system
      operationId: version_handler
      responses:
        '200':
          description: Server version and client compatibility table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEnvelope'
              example:
                api_version: '1.4'
                build_sha: 9f3a1c2
                compatibility:
                - deprecated_below: 1.3.0
                  latest_version: 1.4.2
                  min_supported_version: 1.2.0
                  platform: web
                  sunset: 2026-09-01T00:00:00Z
                - deprecated_below: null
                  latest_version: 1.4.0
                  min_supported_version: 1.1.0
                  platform: android-tv
                  sunset: null
                instance_name: Playarr Server
                server_version: 1.4.2
  /api/v1/admin/backups:
    get:
      tags:
      - admin
      operationId: get_backups_handler
      responses:
        '200':
          description: Backup configuration, current run, history and recent failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupOverview'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
    post:
      tags:
      - admin
      operationId: start_backup_handler
      responses:
        '202':
          description: A backup run was started in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedBackup'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: Backups are not configured
        '409':
          description: A backup is already running
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}:
    delete:
      tags:
      - admin
      operationId: delete_backup_handler
      parameters:
      - name: id
        in: path
        description: Backup id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Backup deleted
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No backup with this id
        '409':
          description: This is the only complete backup
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}/download:
    get:
      tags:
      - admin
      operationId: download_backup_handler
      parameters:
      - name: id
        in: path
        description: Backup id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The encrypted archive, byte for byte
          content:
            application/octet-stream: {}
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No complete backup with this id
      security:
      - bearer_auth: []
  /api/v1/admin/backups/{id}/verify:
    post:
      tags:
      - admin
      operationId: verify_backup_handler
      parameters:
      - name: id
        in: path
        description: Backup id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Whether the stored archive still matches its recorded checksum. Decrypting needs the recovery key and is done with the CLI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupVerification'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No backup with this id
      security:
      - bearer_auth: []
  /api/v1/admin/folders/discover:
    post:
      tags:
      - admin
      operationId: admin_discover_folder_roots_handler
      responses:
        '200':
          description: Root folders re-read from every media-owning source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFolderRootsResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/folders/roots:
    get:
      tags:
      - admin
      operationId: admin_list_folder_roots_handler
      responses:
        '200':
          description: Every known root folder with its scan configuration and state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFolderRootsResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
      security:
      - bearer_auth: []
    post:
      tags:
      - admin
      operationId: admin_create_folder_root_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRootRequest'
        required: true
      responses:
        '201':
          description: Root added, enabled and scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFolderRootResponse'
        '400':
          description: Invalid path or source
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
        '409':
          description: This folder is already configured for that source
      security:
      - bearer_auth: []
  /api/v1/admin/folders/roots/{root_id}:
    delete:
      tags:
      - admin
      operationId: admin_delete_folder_root_handler
      parameters:
      - name: root_id
        in: path
        description: Folder root id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Root and its scanned files removed
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
        '404':
          description: Unknown root
        '409':
          description: Roots reported by a source cannot be deleted; disable them instead
      security:
      - bearer_auth: []
    patch:
      tags:
      - admin
      operationId: admin_update_folder_root_handler
      parameters:
      - name: root_id
        in: path
        description: Folder root id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRootRequest'
        required: true
      responses:
        '200':
          description: Updated root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFolderRootResponse'
        '400':
          description: Invalid path
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
        '404':
          description: Unknown root
      security:
      - bearer_auth: []
  /api/v1/admin/folders/roots/{root_id}/scan:
    post:
      tags:
      - admin
      operationId: admin_scan_folder_root_handler
      parameters:
      - name: root_id
        in: path
        description: Folder root id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scan finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanSummary'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is not an admin
        '404':
          description: Unknown root
        '409':
          description: A scan of this root is already running
        '422':
          description: The root could not be scanned
      security:
      - bearer_auth: []
  /api/v1/admin/group-libraries:
    get:
      operationId: list_group_libraries_handler
      responses:
        '200':
          description: Group libraries for this server's peer group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupLibrary'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: Server has not joined a peer group
      security:
      - bearer_auth: []
    post:
      operationId: create_group_library_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupLibraryRequest'
        required: true
      responses:
        '201':
          description: Group library created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLibrary'
        '400':
          description: Invalid library name
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: Server has not joined a peer group
      security:
      - bearer_auth: []
  /api/v1/admin/group-libraries/{id}:
    put:
      operationId: rename_group_library_handler
      parameters:
      - name: id
        in: path
        description: Group library ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupLibraryRequest'
        required: true
      responses:
        '200':
          description: Group library renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupLibrary'
        '400':
          description: Invalid library name
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: Group library not found
      security:
      - bearer_auth: []
  /api/v1/admin/home-rails:
    get:
      tags:
      - home
      operationId: list_admin_rails_handler
      responses:
        '200':
          description: Every rail definition in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeRailDefinitionResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
    post:
      tags:
      - home
      operationId: create_admin_rail_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHomeRailRequest'
        required: true
      responses:
        '200':
          description: The created custom rail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRailDefinitionResponse'
        '400':
          description: Invalid name or config
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No view with this id
      security:
      - bearer_auth: []
  /api/v1/admin/home-rails/order:
    put:
      tags:
      - home
      operationId: reorder_admin_rails_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderHomeRailsRequest'
        required: true
      responses:
        '200':
          description: Every rail definition in the new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeRailDefinitionResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/home-rails/{id}:
    put:
      tags:
      - home
      operationId: update_admin_rail_handler
      parameters:
      - name: id
        in: path
        description: Rail id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHomeRailRequest'
        required: true
      responses:
        '200':
          description: The updated rail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRailDefinitionResponse'
        '400':
          description: Invalid config
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No rail or view with this id
      security:
      - bearer_auth: []
    delete:
      tags:
      - home
      operationId: delete_admin_rail_handler
      parameters:
      - name: id
        in: path
        description: Rail id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No rail with this id
        '409':
          description: This is a default rail; disable it instead
      security:
      - bearer_auth: []
  /api/v1/admin/library/source-matrix:
    get:
      tags:
      - admin
      summary: Physical media-file inventory reported by every node in this peer group.
      operationId: source_matrix_handler
      responses:
        '200':
          description: Peer nodes and their reported physical files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceMatrixResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/metrics/http-latency:
    get:
      tags:
      - admin
      summary: |-
        Aggregated p50/p95/p99/avg/max/count HTTP latency per (method, route
        template), computed on demand from whatever
        `request_timing_middleware::record_request_timing` has recorded in
        `AppState::request_timing` since this process started -- see that
        registry's own doc comment for the bounded-ring-buffer shape backing
        it. Sorted by `p95_ms` descending, so the routes worth investigating
        first are always at the top. Purely in-memory and per-node, like
        `sync_status_handler`'s view of sync state: nothing here survives a
        restart, and a multi-node deployment reports each node's own traffic
        only.
      operationId: http_latency_handler
      responses:
        '200':
          description: Aggregated request-duration stats per (method, route template), sorted by p95_ms descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteLatencyStats'
              example:
              - avg_ms: 4.2
                max_ms: 58.7
                method: GET
                p50_ms: 3.1
                p95_ms: 11.4
                p99_ms: 22.0
                route: /api/v1/catalog/{id}
                sample_count: 812
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/peer-groups:
    post:
      tags:
      - peer-groups
      summary: |-
        Founds a brand-new peer group with this node as its first (and, until
        another node joins, only) member -- `docs/architecture/peer-groups.md`
        §3.4's founding step 2. Mints this node's Ed25519 keypair + `peer_id`
        if it doesn't have one yet, and requires `PUT /api/v1/admin/
        peer-nodes/self` to have been called first (400 otherwise).
      operationId: found_peer_group_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoundPeerGroupRequest'
            example:
              name: Home Group
        required: true
      responses:
        '200':
          description: Group founded, this node is its first member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundPeerGroupResponse'
        '400':
          description: This node's name/addresses have not been set yet (call PUT .../peer-nodes/self first)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: This node has already founded or joined a peer group
      security:
      - bearer_auth: []
  /api/v1/admin/peer-groups/join:
    post:
      tags:
      - peer-groups
      summary: |-
        Joins an existing peer group by calling another member's
        `POST /api/v1/peer/enroll` -- `docs/architecture/peer-groups.md` §3.4's
        joining step 2 (which itself triggers steps 3-4 over the network).
        Mints this node's Ed25519 keypair + `peer_id` if it doesn't have one
        yet, and requires `PUT /api/v1/admin/peer-nodes/self` to have been
        called first (400 otherwise). On success, persists `group_id` into this
        node's own `node_identity` and upserts every member the seed node
        reported (including that node itself) into this node's own
        `peer_nodes` -- correcting `is_self` to reflect *this* node's own
        perspective rather than trusting the flag as reported by the seed node.
      operationId: join_peer_group_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinPeerGroupRequest'
            example:
              join_token: 5f8a1c2e9b3d4f6a8c1e2b3d4f6a8c1e
              seed_address: https://home.example.com
        required: true
      responses:
        '200':
          description: Joined -- full current group membership returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          description: This node's name/addresses have not been set yet (call PUT .../peer-nodes/self first)
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: This node has already founded or joined a peer group
        '502':
          description: The seed node could not be reached, or rejected the join token
      security:
      - bearer_auth: []
  /api/v1/admin/peer-groups/join-tokens:
    post:
      tags:
      - peer-groups
      summary: |-
        Issues a single-use, 15-minute join token for another node to redeem
        via `POST /api/v1/peer/enroll` -- `docs/architecture/peer-groups.md`
        §3.4's joining step 1, run by an admin on the **already-grouped**
        (founding, or previously joined) node.
      operationId: create_peer_join_token_handler
      responses:
        '200':
          description: Join token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerJoinTokenResponse'
              example:
                expires_at: 2026-07-21T12:15:00Z
                join_token: 5f8a1c2e9b3d4f6a8c1e2b3d4f6a8c1e
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: This node has not founded or joined a peer group yet
      security:
      - bearer_auth: []
  /api/v1/admin/peer-groups/self:
    delete:
      tags:
      - peer-groups
      summary: |-
        Leaves this node's current peer group. Reachable members are notified
        with this node's signed identity first; local group-scoped metadata is
        then removed and token issuance returns to standalone mode. The durable
        peer id/keypair is retained, and this node's name/addresses are staged
        for the next create or join operation.
      operationId: leave_peer_group_handler
      responses:
        '200':
          description: This node left its peer group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePeerGroupResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '409':
          description: This node has not founded or joined a peer group
      security:
      - bearer_auth: []
  /api/v1/admin/peer-groups/self/address-bundle:
    get:
      tags:
      - peer-groups
      summary: |-
        This node's current address bundle -- `docs/architecture/
        peer-groups.md` §6.1. Invite-link/QR builders (`users.rs`/`admin.rs`'s
        invite-creation handlers, client-side) call this at link-build time
        instead of reading a single configured base URL directly, so an invite
        generated on any one member of a group carries every member's
        client-reachable address, not just the issuing node's own.
      operationId: address_bundle_handler
      responses:
        '200':
          description: This node's (or, once grouped, this group's) current address bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerAddressBundle'
              example:
                addresses:
                - peer_node_id: 11111111-1111-4111-8111-111111111111
                  url: https://home.example.com
                - peer_node_id: 22222222-2222-4222-8222-222222222222
                  url: https://east.example.com
                group_id: 11111111-1111-4111-8111-111111111111
                group_name: Home Group
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/peer-nodes:
    get:
      tags:
      - peer-groups
      summary: |-
        Every known member of this node's peer group, including this node's
        own `is_self = true` row.
      operationId: list_peer_nodes_handler
      responses:
        '200':
          description: Every known peer node, including self
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeerNode'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/peer-nodes/self:
    put:
      tags:
      - peer-groups
      summary: |-
        Sets this node's own display name and reachable addresses --
        `docs/architecture/peer-groups.md` §3.4's founding step 1 / joining
        step 2. Callable at any time: before this node has founded/joined a
        group, the values are only staged in memory (see
        [`PendingSelfPeerProfile`]); afterward, this writes straight through to
        the persisted self [`PeerNode`] row (e.g. to rename this node or add a
        new address later).
      operationId: update_self_peer_node_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfPeerNodeRequest'
            example:
              addresses:
              - client_reachable: true
                label: wan
                priority: 0
                url: https://home.example.com
              - client_reachable: false
                label: lan
                priority: 1
                url: http://192.168.1.10:8080
              name: home
        required: true
      responses:
        '200':
          description: Self profile set or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfPeerNodeResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/peer-nodes/{id}/sync-status:
    get:
      tags:
      - peer-groups
      summary: |-
        A single peer node's last-known sync status -- always the "never
        reported" shape in Phase 1; see [`PeerSyncStatusResponse::status`]'s
        doc comment.
      operationId: peer_node_sync_status_handler
      parameters:
      - name: id
        in: path
        description: Peer node id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Last-known sync status (always unreported in Phase 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerSyncStatusResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No peer node with this id
      security:
      - bearer_auth: []
  /api/v1/admin/playback/activity/active:
    get:
      tags:
      - admin
      summary: |-
        Group-wide live playback sessions. A peer outage is represented in
        `unavailable_nodes`; it does not discard sessions returned by this node or
        any other reachable peer.
      operationId: playback_activity_active_handler
      responses:
        '200':
          description: Live playback across the peer group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackActivityActiveResponse'
        '401':
          description: Missing or invalid access token
        '403':
          description: Caller is authenticated but not an admin
      security:
      - bearer_auth: []
  /api/v1/admin/playback/activity/facets:
    get:
      tags:
      - admin
      summary: |-
        Complete library choices for the Activity filter. Unlike choices derived
        from a history page, these remain available when the current filters return
        no rows and include libraries known through peer synchronisation.
      operationId: playback_activity_facets_handler
      responses:
        '200':
          description: Complete effective library choices for playback activity
          content:
