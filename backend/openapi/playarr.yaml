          - string
          - 'null'
        path:
          type: string
          description: Absolute directory on this server.
        source_instance_id:
          type: string
          format: uuid
          description: |-
            Source instance whose library the folder belongs to (decides the
            library kind and who may browse it).
    CreateHandoffRequest:
      type: object
      required:
      - request_key
      - source_device_id
      - destination_device_id
      properties:
        destination_device_id:
          type: string
          format: uuid
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Required when the initiator is the source; otherwise taken from the
            source's last reported state.
        request_key:
          type: string
          description: Client-chosen idempotency key (unique per initiating device).
        snapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PlaybackSnapshot'
        source_device_id:
          type: string
          format: uuid
    CreateHomeRailRequest:
      type: object
      required:
      - name
      - view_id
      properties:
        config:
          $ref: '#/components/schemas/HomeRailConfig'
        enabled:
          type: boolean
        library:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
            description: Library the rail belongs to; omit for a cross-library view.
        name:
          type: string
          description: Title shown on Home.
        view_id:
          type: string
          format: uuid
          description: Saved view (from `/api/v1/admin/views`) supplying the filter.
    CreatePairingRequest:
      type: object
      required:
      - target_device_id
      properties:
        controller_name:
          type:
          - string
          - 'null'
          description: Name shown on the target's approval prompt (e.g. "Alex's phone").
        scopes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Requested scopes; defaults to every capability the target advertises.
        target_device_id:
          type: string
          format: uuid
    CreatePlaylistRequest:
      type: object
      required:
      - name
      properties:
        is_system:
          type: boolean
          description: |-
            Requires [`AdminUser`] when `true` -- a non-admin caller setting
            this is rejected with `403`, not silently downgraded to a personal
            playlist, so a client bug never creates the wrong kind of playlist
            unnoticed.
        media_type:
          $ref: '#/components/schemas/PlaylistMediaType'
          description: |-
            Existing clients default to video; new clients present this choice
            when creating a top-level playlist.
        name:
          type: string
        parent_playlist_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `Some(id)` nests this playlist under an existing one the caller can
            already write to (e.g. "Sample Hero" under "SCU") -- checked in
            [`create_playlist_handler`], not structurally enforced here.
    CreateUserInvite:
      type: object
      description: Access attached to a direct administrator-issued invitation.
      properties:
        can_stream:
          type: boolean
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Exact expiry chosen by the administrator. Omitting it preserves the
            existing 24-hour lifetime.
        library_allow:
          type: array
          items:
            type: string
            format: uuid
    CreateUserInviteRequest:
      type: object
      description: Optional context supplied by the Playarr user requesting an invitation.
      properties:
        message:
          type:
          - string
          - 'null'
    CreateUserRequest:
      type: object
      description: |-
        Request body for provisioning a new account. `password` is write-only
        -- it is hashed via `playarr_auth::login::hash_password` immediately
        and never echoed back in [`UserResponse`].
      required:
      - username
      - display_name
      - password
      properties:
        can_download:
          type: boolean
          description: |-
            Grants permission to create/fetch downloads of media this account
            can already stream -- see `playarr_model::Policy::can_download`'s
            doc comment. Defaults to `false` (least privilege), same philosophy
            as `can_stream`/`library_allow` above: an admin has to explicitly
            grant download access, it is never on by default.
        can_request:
          type: boolean
          description: |-
            Grants permission to request titles that are not in the library --
            see `playarr_model::Policy::can_request`'s doc comment. Defaults to
            `false` (least privilege).
        can_stream:
          type: boolean
          description: |-
            Grants Playarr streaming access -- see `playarr_model::Policy::
            can_stream`'s doc comment. Independent of `is_admin`; defaults to
            `false` (least privilege), same as every other grant this handler
            starts a new account with.
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        is_admin:
          type: boolean
        library_allow:
          type: array
          items:
            type: string
            format: uuid
          description: |-
            Source-instance ids ("libraries") this account may browse/stream --
            see `playarr_model::Policy::library_allow`'s doc comment. Defaults
            to empty (no grants yet, deny-all -- not all-allow), same
            least-privilege-by-default philosophy as `is_admin`/`can_stream`
            above: an admin still has to explicitly grant library access after
            creating the account.
        password:
          type: string
        username:
          type: string
    CreditResponse:
      type: object
      description: |-
        One credit, with its [`Person`] flattened in -- a caller displaying a
        cast/crew list wants the name/headshot right there, not a second
        round trip per credit.
      required:
      - id
      - person
      properties:
        character:
          type:
          - string
          - 'null'
          description: The character played. Present only on a cast credit.
        department:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        id:
          type: string
          format: uuid
        job:
          type:
          - string
          - 'null'
          description: Present only on a crew credit.
        person:
          $ref: '#/components/schemas/PersonResponse'
    DecideApprovalRequest:
      type: object
      required:
      - approve
      properties:
        approve:
          type: boolean
        bonus_minutes:
          type:
          - integer
          - 'null'
          format: int32
          description: '`time`/`budget` only: extra watch minutes granted.'
          minimum: 0
        duration_minutes:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            How long an approval stays usable. Default 60 minutes
            for content and time; at most 240.
          minimum: 0
        pin:
          type:
          - string
          - 'null'
          description: The guardian's own profile PIN (required to approve).
    Decision:
      type: string
      enum:
      - approve
      - decline
    DecisionBody:
      type: object
      required:
      - decision
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        reason:
          type:
          - string
          - 'null'
    DeliveryMode:
      type: string
      description: |-
        How a stream resolved to a remote peer should actually reach the
        client -- see §5.3 for the redirect-vs-proxy tradeoff this encodes.
      enum:
      - auto
      - redirect
      - proxy
    DeviceAuthorizationRequest:
      type: object
      description: |-
        The short code displayed by a TV and entered (or supplied by a QR-code
        link) on an already-authenticated browser or mobile device.
      required:
      - user_code
      properties:
        user_code:
          type: string
    DeviceCodeRequest:
      type: object
      required:
      - client_platform
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
    DeviceCodeResponseSchema:
      type: object
      description: |-
        Doc-only mirror of [`DeviceCodeResponse`] (that type has no `ToSchema`;
        handlers still return it directly, serialized for real).
      required:
      - device_code
      - user_code
      - verification_uri
      - verification_uri_complete
      - expires_in
      - interval
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
          format: int64
        interval:
          type: integer
          format: int64
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
    DeviceTokenRequest:
      type: object
      required:
      - grant_type
      - device_code
      properties:
        device_code:
          type: string
        grant_type:
          type: string
          description: |-
            Must be [`DEVICE_CODE_GRANT_TYPE`] -- any other value is rejected
            with `unsupported_grant_type` before the device code is even looked
            up, per RFC 6749 §5.2.
    DiscoverResponse:
      type: object
      required:
      - titles
      - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderStatus'
        titles:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverTitle'
    DiscoverTitle:
      allOf:
      - $ref: '#/components/schemas/DiscoveryTitle'
      - type: object
        required:
        - in_watchlist
        properties:
          in_watchlist:
            type: boolean
    DiscoveryKind:
      type: string
      description: |-
        What a discovery title is. Games are deliberately separate from
        [`crate::WorkKind`]: they have their own filter and launch semantics.
      enum:
      - movie
      - series
      - artist
      - author
      - site
      - programme
      - game
    DiscoveryScope:
      type: string
      description: Which search scope a caller wants. Games only appear for `Games`/`All`.
      enum:
      - media
      - games
      - all
    DiscoveryTitle:
      type: object
      description: A merged real-world title.
      required:
      - title_key
      - kind
      - title
      - external_refs
      - editions
      - sources
      properties:
        editions:
          type: array
          items:
            type: string
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
        kind:
          $ref: '#/components/schemas/DiscoveryKind'
        overview:
          type:
          - string
          - 'null'
        poster_url:
          type:
          - string
          - 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TitleSource'
        title:
          type: string
        title_key:
          type: string
          description: Stable identity, see [`identity_key`].
        year:
          type:
          - integer
          - 'null'
          format: int32
    DownloadOptionsResponse:
      type: object
      required:
      - media_file_id
      - container
      - options
      properties:
        container:
          type: string
        media_file_id:
          type: string
          format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/DownloadQualityOption'
    DownloadQualityOption:
      type: object
      description: |-
        One quality `GET /api/v1/media/{media_file_id}/download-options` offers
        -- the same `id`/`label`/`profile`/`height` shape
        [`crate::playback::PlaybackQualityOption`] already exposes for playback,
        plus a download-specific size estimate. `"original"` is always exact
        (`size_is_estimate: false`, `estimated_size_bytes` is the real
        `MediaFile::size_bytes`); every named transcode profile is a rough
        `video_bitrate_bps * duration_ms / 8000` estimate (`size_is_estimate:
        true`) since nothing has actually encoded it yet.
      required:
      - id
      - label
      - size_is_estimate
      properties:
        estimated_size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        id:
          type: string
        label:
          type: string
        profile:
          type:
          - string
          - 'null'
        size_is_estimate:
          type: boolean
    DownloadStatus:
      type: string
      enum:
      - queued
      - processing
      - ready
      - failed
      - expired
      - canceled
    DownloadTicketResponse:
      type: object
      description: |-
        Wire projection of [`DownloadTicket`] -- not the model type directly,
        same reasoning as `MediaFile`/`Rendition`'s own DTOs elsewhere in this
        crate: `DownloadTicket::output_path` is a `PathBuf` (no `ToSchema`
        mapping, and not something a caller should see the server's real
        filesystem layout through anyway). `profile` is deliberately omitted --
        it's an internal detail of how a `Ready` ticket got produced, not part
        of the documented response contract; `quality_id` is what callers key
        off of.
      required:
      - id
      - media_file_id
      - quality_id
      - status
      - container
      - requested_at
      properties:
        container:
          type: string
        error_message:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        media_file_id:
          type: string
          format: uuid
        quality_id:
          type: string
        ready_at:
          type:
          - string
          - 'null'
          format: date-time
        requested_at:
          type: string
          format: date-time
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/DownloadStatus'
    EnrollRequest:
      type: object
      description: |-
        Request body for [`enroll_handler`] -- exactly `docs/architecture/
        peer-groups.md` §3.4 step 3's `{join_token, peer_id, name, addresses,
        public_key}`. `admin_peer::join_peer_group_handler` builds and sends
        this same shape when it drives the client side of this handshake.
      required:
      - join_token
      - peer_id
      - name
      - public_key
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/PeerAddress'
        join_token:
          type: string
          description: |-
            The raw, one-time token an admin on this (the founding/receiving)
            node issued via `POST /api/v1/admin/peer-groups/join-tokens`.
        name:
          type: string
        peer_id:
          type: string
          format: uuid
          description: The joining node's own durable `node_identity.peer_id`.
        public_key:
          type: string
          description: The joining node's Ed25519 public key, base64.
    EnrollResponse:
      type: object
      description: |-
        Response body for [`enroll_handler`] -- exactly §3.4 step 4's
        `{group, members}`, where `members` is this node's **full** current
        membership (including this node's own `is_self = true` row and the
        row just inserted for the caller), so the joining node doesn't have to
        wait for its first sync pass to learn about any third peer that
        already joined. Reused as-is by `admin_peer::join_peer_group_handler`
        to deserialize this same shape on the joining node's side, rather than
        hand-duplicating an identical struct there.
      required:
      - group
      - members
      properties:
        group:
          $ref: '#/components/schemas/PeerGroup'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PeerNode'
    Episode:
      type: object
      required:
      - id
      - season_id
      - episode_number
      - images
      - monitored
      - availability
      properties:
        air_date:
          type:
          - string
          - 'null'
          format: date
        availability:
          $ref: '#/components/schemas/Availability'
        episode_number:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageAsset'
          description: Remote-hosted episode stills, normally [`crate::ImageKind::Thumb`].
        monitored:
          type: boolean
        overview:
          type:
          - string
          - 'null'
        runtime_minutes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        season_id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
    EpisodeDetailSchema:
      type: object
      description: |-
        Doc-only mirror of `playarr_catalog::EpisodeDetail` -- the resolved
        `MediaFile` id (via `MediaFileRepo::find_by_leaf`) that plays this
        episode, `None` when no file has synced for it yet.
      required:
      - episode
      properties:
        episode:
          $ref: '#/components/schemas/Episode'
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
        runtime_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        details:
          type:
          - object
          - 'null'
          description: |-
            Optional machine-readable context, e.g. `{"reason":"outside_schedule",
            "next_start_at":"..."}` on a `household_blocked` response. Omitted
            when empty so existing error bodies are unchanged.
        error:
          type: string
          description: |-
            A short, stable, machine-matchable code -- e.g. `"not_found"`,
            `"invalid_transition"`. Deliberately not the `Display` text of the
            underlying error (which can change wording without that being a
            breaking API change); `message` carries that instead.
        message:
          type: string
    ExportCounts:
      type: object
      required:
      - watch_progress
      - playback_preferences
      - playlists
      - playlist_items
      - watchlist
      - skipped
      properties:
        playback_preferences:
          type: integer
          minimum: 0
        playlist_items:
          type: integer
          minimum: 0
        playlists:
          type: integer
          minimum: 0
        skipped:
          type: integer
          description: |-
            Rows left out because their content no longer exists or is outside
            this account's library permissions.
          minimum: 0
        watch_progress:
          type: integer
          minimum: 0
        watchlist:
          type: integer
          minimum: 0
    ExportJobResponse:
      type: object
      required:
      - id
      - status
      - created_at
      - progress
      - counts
      properties:
        counts:
          $ref: '#/components/schemas/ExportCounts'
        created_at:
          type: string
          format: date-time
        download_url:
          type:
          - string
          - 'null'
          description: Relative URL of the package, present while `status` is `ready`.
        error:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the download stops working (set once the package is ready).
        id:
          type: string
          description: Opaque, unguessable identifier; only the creating account can use it.
        progress:
          $ref: '#/components/schemas/ExportProgress'
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/ExportStatus'
    ExportListResponse:
      type: object
      required:
      - scope
      - exports
      properties:
        exports:
          type: array
          items:
            $ref: '#/components/schemas/ExportJobResponse'
        scope:
          type: string
          description: |-
            Always `own_account_only`: exports contain only the signed-in
            account's data, never anyone else's.
    ExportProgress:
      type: object
      required:
      - stage
      - done
      - total
      properties:
        done:
          type: integer
          minimum: 0
        stage:
          type: string
          description: |-
            Current stage: `queued`, `watch_progress`, `playback_preferences`,
            `playlists`, `packaging` or `done`.
        total:
          type: integer
          minimum: 0
    ExportStatus:
      type: string
      enum:
      - queued
      - running
      - ready
      - failed
      - expired
    ExternalProvider:
      oneOf:
      - type: string
        enum:
        - tmdb
      - type: string
        enum:
        - tvdb
      - type: string
        enum:
        - imdb
      - type: string
        enum:
        - music_brainz_artist
      - type: string
        enum:
        - music_brainz_release_group
      - type: string
        enum:
        - goodreads
      - type: string
        enum:
        - isbn
      - type: string
        enum:
        - asin
      - type: string
        description: |-
          ThePornDB -- Whisparr's own metadata provider, structurally the same
          role for Whisparr's studio/scene catalog that `Tvdb` plays for
          Sonarr's. Given a first-class variant (rather than falling back to
          `Other`) for the same reason every other Work-owning source has one:
          `playarr-arr-sync::arr_client::work_kind_and_provider` needs a
          stable, matchable discriminant to key `Work::external_refs` lookups
          on, and every source kind that owns `Work` rows gets one.
        enum:
        - tpdb
      - type: object
        description: |-
          Escape hatch for providers we don't have a first-class variant for
          yet (e.g. AniDB, Discogs) without needing a migration to add one.
        required:
        - other
        properties:
          other:
            type: string
            description: |-
              Escape hatch for providers we don't have a first-class variant for
              yet (e.g. AniDB, Discogs) without needing a migration to add one.
      description: |-
        A cross-reference to the identifier this `Work` (or one of its source
        records) is known by in an external catalog/metadata provider.
    ExternalRef:
      type: object
      required:
      - provider
      - external_id
      properties:
        external_id:
          type: string
        provider:
          $ref: '#/components/schemas/ExternalProvider'
    ExternalUser:
      type: object
      description: A user of an external system, as returned by its user listing.
      required:
      - id
      properties:
        display_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        id:
          type: string
        username:
          type:
          - string
          - 'null'
    FirebaseWebConfig:
      type: object
      required:
      - api_key
      - auth_domain
      - project_id
      - storage_bucket
      - messaging_sender_id
      - app_id
      - vapid_public_key
      properties:
        api_key:
          type: string
        app_id:
          type: string
        auth_domain:
          type: string
        messaging_sender_id:
          type: string
        project_id:
          type: string
        storage_bucket:
          type: string
        vapid_public_key:
          type: string
    FolderBreadcrumbResponse:
      type: object
      required:
      - name
      - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Root-relative path of this ancestor (empty for the root).
    FolderBrowseResponse:
      type: object
      required:
      - root
      - path
      - breadcrumbs
      - entries
      - total
      - offset
      - limit
      properties:
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/FolderBreadcrumbResponse'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntryResponse'
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        path:
          type: string
        root:
          $ref: '#/components/schemas/FolderRootResponse'
        total:
          type: integer
          format: int64
          minimum: 0
    FolderEntryFilter:
      type: string
      enum:
      - all
      - directories
      - media
    FolderEntryResponse:
      type: object
      required:
      - entry_type
      - name
      - path
      properties:
        album:
          type:
          - string
          - 'null'
        artist:
          type:
          - string
          - 'null'
        audio_codec:
          type:
          - string
          - 'null'
        bitrate_bps:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        container:
          type:
          - string
          - 'null'
        duration_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        entry_type:
          $ref: '#/components/schemas/FolderEntryType'
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        item_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Number of playable files below a directory.
          minimum: 0
        media_file_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Playback id for media entries (use the normal playback routes).
        media_kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkKind'
        modified_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        path:
          type: string
          description: Root-relative path (pass as `path` to open a directory).
        position_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        thumbnail_url:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        video_codec:
          type:
          - string
          - 'null'
        watch_state:
          oneOf:
