        '403':
          description: Caller is authenticated but not an admin
        '404':
          description: No Tdarr connection has been registered yet
      security:
      - bearer_auth: []
    post:
      tags:
      - admin
      summary: |-
        Registers (or updates) Playarr Server's Tdarr connection. Confirms Tdarr is
        actually reachable with the given `base_url`/`api_key` before
        accepting it.
      operationId: create_tdarr_connection_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TdarrConnectionRequest'
            example:
              active_session_threshold: 2
              api_key: s3cr3t-api-key
              base_url: http://tdarr.local:8265
              default_profile: h264-720p-4mbps
              default_worker_limit: 2
              tdarr_db_id: playarr
              throttle_check_interval_secs: 30
              throttled_worker_limit: 0
              worker_process: transcodecpu
        required: true
      responses:
        '200':
          description: Registered (or updated) and confirmed reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TdarrConnectionResponse'
