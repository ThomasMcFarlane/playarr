            `"https://home.example.com"` -- the doc's "bootstrap address".
    LanguageFacetEntry:
      type: object
      description: One available language with the number of works that carry it.
      required:
      - code
      - count
      properties:
        code:
          type: string
          description: 'Canonical code: ISO 639-1 where one exists, otherwise ISO 639-2/T.'
        count:
          type: integer
          format: int64
          description: Number of works (in the requested scope) with this language.
        name:
          type:
          - string
          - 'null'
          description: English name when known (clients localise the code themselves).
    LanguageFacetsResponse:
      type: object
      description: Facet counts for the language filters.
      required:
      - audio
      - subtitle
      properties:
        audio:
          type: array
          items:
            $ref: '#/components/schemas/LanguageFacetEntry'
        subtitle:
          type: array
          items:
            $ref: '#/components/schemas/LanguageFacetEntry'
    LeafSelector:
      oneOf:
      - type: string
        enum:
        - movie
      - type: object
        required:
        - episode
        properties:
          episode:
            type: object
            required:
            - season
            - episode
            properties:
              episode:
                type: integer
                format: int32
                minimum: 0
              season:
                type: integer
                format: int32
                minimum: 0
      - type: object
        required:
        - track
        properties:
          track:
            type: object
            required:
            - track
            properties:
              disc:
                type:
                - integer
                - 'null'
                format: int32
                minimum: 0
              track:
                type: integer
                format: int32
                minimum: 0
      - type: object
        required:
        - book
        properties:
          book:
            type: object
            required:
            - index
            properties:
              index:
                type: integer
                format: int32
                minimum: 0
      description: |-
        Portable leaf identity -- never a peer-local `LeafRef`/`Uuid`, which is
        meaningless off the node that minted it. A receiving peer resolves
        `(provider, external_id, LeafSelector)` against its own child rows to
        get its own `LeafRef`/`media_file_id`; it never adopts a sender's id.
    LeavePeerGroupResponse:
      type: object
      description: |-
        Result of leaving this node's current peer group. Unreachable peers do
        not block local detachment, but the counts make partial notification
        visible to the administrator.
      required:
      - group_id
      - notified_peers
      - unreachable_peers
      properties:
        group_id:
          type: string
          format: uuid
        notified_peers:
          type: integer
          minimum: 0
        unreachable_peers:
          type: integer
          minimum: 0
    LibrariesResponse:
      type: object
      description: |-
        Response body for [`libraries_handler`] -- `docs/architecture/
        peer-groups.md` §3.6: complete `source_instances` rows plus
        `group_libraries`.
      required:
      - source_instances
      - group_libraries
      - server_time
      properties:
        group_libraries:
          type: array
          items:
            $ref: '#/components/schemas/GroupLibrary'
        server_time:
          type: string
        source_instances:
          type: array
          items:
            $ref: '#/components/schemas/SourceInstanceSyncRow'
    LibraryViewRequest:
      type: object
      description: |-
        Request body for both create (`POST /api/v1/admin/views`) and update
        (`PUT /api/v1/admin/views/{id}`). Structurally has no `is_default`/
        `default_order` fields, so an admin can never set them through this
        endpoint -- enforced by omission, not a runtime check (see
        [`create_view_handler`]/[`update_view_handler`]'s doc comments).
      required:
      - name
      - criteria
      properties:
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: |-
            Ordered, most-significant first -- each element one of `"title"` |
            `"title_desc"` | `"recent"` | `"oldest"` | `"released"` |
            `"last_played"`, same free-string convention as
            `catalog::BrowseQueryParams::sort`, not a typed enum on the wire.
            Empty/omitted defaults to `["title"]`. `"last_played"` orders by
            *each resolving viewer's own* last-played time (see
            `playarr_model::ViewSort::LastPlayedByUser`'s doc comment) --
            picking it here means every caller who resolves this view sees it
            personalized to them, not a single shared order.
    LibraryViewResponse:
      type: object
      required:
      - id
      - name
      - criteria
      - sort
      - is_default
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        criteria:
          $ref: '#/components/schemas/ViewCriteriaDto'
        default_order:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
          format: uuid
        is_default:
          type: boolean
        name:
          type: string
        sort:
          type: array
          items:
            type: string
          description: Same ordered, most-significant-first string list `LibraryViewRequest::sort` accepts.
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - device_id
      - device_name
      - client_platform
      - client_version
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
          description: |-
            Client-generated, stable-per-install device id -- the same id the
            caller should resend on every subsequent login/refresh from this
            install, so `Policy::device_allow`/`max_concurrent_sessions` reason
            about one `Device`, not a fresh one per login.
        device_name:
          type: string
        password:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        profile_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`AuthMode::ManagedProfiles` only; ignored by every other tier.'
        username:
          type:
          - string
          - 'null'
          description: '`AuthMode::FullAccount` only; ignored by every other tier.'
    LoginResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        peer_addresses:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PeerAddressBundle'
            description: |-
              `docs/architecture/peer-groups.md` §7.1's self-healing address
              book: this node's current [`PeerAddressBundle`], so the client can
              pick up newly added/removed peers without a separate round trip.
              `null`/absent for a standalone (never grouped) node -- see
              `admin_peer::peer_addresses_for_response`'s doc comment for why
              that lookup is skipped rather than always attached.
        refresh_token:
          type: string
        token_type:
          type: string
        user_id:
          type: string
          format: uuid
    MeasuredPlayback:
      type: object
      properties:
        audio_channels:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        audio_codec:
          type:
          - string
          - 'null'
        audio_passthrough:
          type:
          - boolean
          - 'null'
          description: Only `Some(true)` when the player confirmed bitstream passthrough.
        decoder_kind:
          type:
          - string
          - 'null'
          description: '`hardware` or `software`.'
        dropped_frames:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        hdr_active:
          type:
          - boolean
          - 'null'
          description: Only `Some(true)` when the player confirmed an HDR output mode.
        height:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        rebuffer_count:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        rebuffer_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        throughput_bps:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        video_codec:
          type:
          - string
          - 'null'
        width:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    MediaChapter:
      type: object
      description: |-
        One real chapter embedded in a media container, as reported by ffprobe.
        Untitled chapters remain untitled rather than receiving a fabricated
        name; Playarr can display their real start time as the label.
      required:
      - index
      - start_ms
      properties:
        end_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        index:
          type: integer
          format: int32
          minimum: 0
        start_ms:
          type: integer
          format: int64
          minimum: 0
        title:
          type:
          - string
          - 'null'
    MediaMetadata:
      type: object
      required:
      - duration_ms
      properties:
        duration_ms:
          type: integer
          format: int64
          minimum: 0
    MediaPlaybackOptionsResponse:
      type: object
      required:
      - quality_options
      - audio_tracks
      - subtitle_tracks
      - preferences
      properties:
        audio_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackAudioTrackOption'
        preferences:
          $ref: '#/components/schemas/MediaPlaybackPreferenceResponse'
        quality_options:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackQualityOption'
        subtitle_tracks:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackSubtitleTrackOption'
    MediaPlaybackPreferenceResponse:
      type: object
      required:
      - quality_id
      properties:
        audio_track_id:
          type:
          - string
          - 'null'
        quality_id:
          type: string
        subtitle_track_id:
          type:
          - string
          - 'null'
    NodesResponse:
      type: object
      description: |-
        Response body for [`nodes_handler`] -- `docs/architecture/peer-groups.md`
        §3.6: "full `peer_nodes` (small; always full-refresh gossip)". No
        `since`/`server_time` -- `playarr_peer_sync::membership_sync`'s own
        `NodesResponse` doc comment explains why membership has no
        corresponding `peer_sync_state.entity` cursor to persist.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PeerNode'
    OAuthErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: |-
            One of RFC 8628 §3.5's four device-flow error codes, or RFC 6749
            §5.2's `unsupported_grant_type`.
    PairingResponse:
      type: object
      required:
      - id
      - status
      - controller_device_id
      - controller_name
      - target_device_id
      - scopes
      - created_ms
      - expires_ms
      - is_controller
      - is_target
      properties:
        controller_device_id:
          type: string
          format: uuid
        controller_name:
          type: string
        created_ms:
          type: integer
          format: int64
        expires_ms:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        is_controller:
          type: boolean
          description: True when the calling device is this pairing's controller.
        is_target:
          type: boolean
          description: True when the calling device is this pairing's target.
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          description: '`pending`, `active`, `denied`, `revoked` or `expired`.'
        target_device_id:
          type: string
          format: uuid
        verification_code:
          type:
          - string
          - 'null'
          description: Six digits shown on both devices while the pairing is pending.
    PeerAddress:
      type: object
      description: |-
        One reachable address for a [`PeerNode`], as asserted by that peer's
        own operator.
      required:
      - url
      - priority
      - label
      - client_reachable
      properties:
        client_reachable:
          type: boolean
          description: |-
            Operator-asserted, never auto-detected (NAT/firewall topology
            cannot be reliably guessed -- same philosophy already used for
            `PLAYARR_ACME_DOMAIN`). Drives `DeliveryMode::Auto`, see §5.3.
        label:
          type: string
        priority:
          type: integer
          format: int32
          description: Lower sorts first -- same convention as `SourceInstance::priority`.
        url:
          type: string
    PeerAddressBundle:
      type: object
      description: |-
        Every reachable address this node -- or, once grouped, this node's
        entire peer group -- can currently be reached at. `docs/architecture/
        peer-groups.md` §6.1. Built fresh on every call, never cached/stored on
        another row (see that section's "Deliberate simplification" note about
        `UserInvite` not snapshotting one of these): the live membership table
        is always the source of truth.
      required:
      - addresses
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/PeerAddressEntry'
          description: |-
            Every `status = Active` member's `client_reachable` addresses, each
            attributed to the peer node it belongs to, flattened and
            priority-ordered (lower `PeerAddress::priority` first). Empty --
            never an error -- when nothing is configured yet.
        group_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            `None` for a standalone deployment that has never founded or
            joined a peer group.
        group_name:
          type:
          - string
          - 'null'
    PeerAddressEntry:
      type: object
      description: |-
        One [`PeerAddressBundle`] entry: a single reachable URL attributed to
        the `peer_nodes` row (or, before grouping, this node's own
        `node_identity`) it belongs to. This attribution is the entire point of
        [`PeerAddressBundle`] not being a bare `Vec<String>`: per
        `docs/architecture/peer-groups.md` §3.7, refresh tokens are never synced
        across peer nodes -- only accounts/policies are -- so a client retrying
        a failed refresh needs to know whether a given URL is *another address
        of the same node* that issued the token (worth retrying) or a
        genuinely different node (guaranteed to 401, since that node's own
        database has no record of a token it never issued).
      required:
      - peer_node_id
      - url
      properties:
        peer_node_id:
          type: string
          format: uuid
        url:
          type: string
    PeerAvailabilityRow:
      type: object
      description: |-
        Wire shape of one derived leaf-availability row -- field-for-field
        identical to `playarr_peer_sync::availability_sync::AvailabilityRow`.
        Reuses `playarr_model::{ExternalProvider, Availability, LeafSelector,
        WorkKind}` directly (all `ToSchema`, none secret): one shared type on
        both ends for each of those fields, so there is nothing for this DTO's
        definition to drift out of sync with.
      required:
      - media_file_id
      - source_instance_id
      - path
      - provider
      - external_id
      - leaf_selector
      - availability
      - updated_at
      - title
      - kind
      properties:
        availability:
          $ref: '#/components/schemas/Availability'
        bitrate:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        codec:
          type:
          - string
          - 'null'
        container:
          type:
          - string
          - 'null'
        duration_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        external_id:
          type: string
        group_library_id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          $ref: '#/components/schemas/WorkKind'
        leaf_selector:
          $ref: '#/components/schemas/LeafSelector'
        media_file_id:
          type: string
          format: uuid
        path:
          type: string
        provider:
          $ref: '#/components/schemas/ExternalProvider'
        release_date:
          type:
          - string
          - 'null'
          format: date-time
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        source_instance_id:
          type: string
          format: uuid
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    PeerGroup:
      type: object
      description: A set of peer nodes that have agreed to sync with each other.
      required:
      - id
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    PeerInviteRequestRow:
      type: object
      description: |-
        Wire shape of one `user_invite_requests` row -- mirrors
        `playarr_model::UserInviteRequest`, same rationale as
        [`PeerInviteRow`].
      required:
      - id
      - user_id
      - status
      - requested_at
      - can_stream
      - library_allow
      - group_library_allow
      properties:
        can_stream:
          type: boolean
        generated_at:
          type:
          - string
          - 'null'
          format: date-time
        group_library_allow:
          type: array
          items:
            type: string
            format: uuid
        id:
          type: string
          format: uuid
        library_allow:
          type: array
          items:
            type: string
            format: uuid
        message:
          type:
          - string
          - 'null'
        requested_at:
          type: string
          format: date-time
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
        reviewed_by:
          type:
          - string
          - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/UserInviteRequestStatus'
        user_id:
          type: string
          format: uuid
    PeerInviteRow:
      type: object
      description: |-
        Wire shape of one `user_invites` row on `GET /api/v1/peer/invites` --
        field-for-field identical to `playarr_model::UserInvite`'s own
        `Serialize` output (which is exactly what `playarr_peer_sync::
        account_sync::InvitesResponse` consumes -- that type uses `UserInvite`
        directly, not a wrapper). Mirrored here rather than adding `ToSchema`
        to `UserInvite` itself, matching `users.rs`'s own established
        `UserInviteResponse`/`UserInviteRequestResponse` precedent of never
        deriving a schema straight off these domain types.
      required:
      - token_hash
      - created_by
      - created_at
      - expires_at
      - can_stream
      - library_allow
      - group_library_allow
      properties:
        can_stream:
          type: boolean
        consumed_at:
          type:
          - string
          - 'null'
          format: date-time
        consumed_by_peer_id:
          type:
          - string
          - 'null'
          format: uuid
        consumed_by_user_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        group_library_allow:
          type: array
          items:
            type: string
            format: uuid
        library_allow:
          type: array
          items:
            type: string
            format: uuid
        token_hash:
          type: string
    PeerJoinTokenResponse:
      type: object
      description: |-
        Response body for [`create_peer_join_token_handler`]. Mirrors
        `users::UserInviteResponse`'s exact shape -- the raw token is returned
        exactly once and never again.
      required:
      - join_token
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        join_token:
          type: string
    PeerMatrixNodeResponse:
      type: object
      required:
      - id
      - name
      - is_self
      - status
      properties:
        id:
          type: string
          format: uuid
        is_self:
          type: boolean
        name:
          type: string
        status:
          $ref: '#/components/schemas/PeerNodeStatus'
    PeerNode:
      type: object
      description: |-
        One known member of a [`PeerGroup`], including a row for this node
        itself (`is_self = true`) so every "list the whole membership picture"
        query (admin UI, sync fan-out target list) is one query, not "self plus
        the other peers".
      required:
      - id
      - group_id
      - name
      - addresses
      - public_key
      - is_self
      - status
      - joined_at
      - updated_at
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/PeerAddress'
        group_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        is_self:
          type: boolean
        joined_at:
          type: string
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        last_sync_error:
          type:
          - string
          - 'null'
        name:
          type: string
        public_key:
          type: string
        status:
          $ref: '#/components/schemas/PeerNodeStatus'
        updated_at:
          type: string
          format: date-time
    PeerNodeStatus:
      type: string
      description: A [`PeerNode`]'s membership state.
      enum:
      - active
      - unreachable
      - left
    PeerPlaybackEventRequest:
      type: object
      required:
      - user_id
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/PlaybackEventKind'
        user_id:
          type: string
          format: uuid
    PeerPlaybackInfoRequest:
      type: object
      description: |-
        Request/response DTOs and the receiving-side handler for §5.2's "the
        entire negotiation request is forwarded" mechanism, and §5.3's "defense
        in depth": [`PeerSignedRequest`]-gated (proves the *calling node* is a
        legitimate, still-active member of this group) but deliberately carries
        `user_id`/`device_id` explicitly rather than a bearer token -- the
        receiving (owning) peer independently resolves *that* user's `Policy`
        from its own synced state ([`resolve_streaming_access`]) before running
        negotiation, rather than trusting the forwarding peer's assertion of
        what its caller is allowed.
      required:
      - user_id
      - device_id
      - client_platform
      - client_version
      - target
      - query
      properties:
        client_platform:
          $ref: '#/components/schemas/ClientPlatform'
        client_version:
          type: string
        device_id:
          type: string
          format: uuid
        query:
          $ref: '#/components/schemas/PlaybackQuery'
        target:
          $ref: '#/components/schemas/PeerPlaybackTarget'
        user_id:
          type: string
          format: uuid
    PeerPlaybackTarget:
      oneOf:
      - type: object
        required:
        - media_file_id
        - kind
        properties:
          kind:
            type: string
            enum:
            - media_file
          media_file_id:
            type: string
            format: uuid
      - type: object
        required:
        - provider
        - external_id
        - leaf_selector
        - kind
        properties:
          external_id:
            type: string
          kind:
            type: string
            enum:
            - external_ref
          leaf_selector:
            $ref: '#/components/schemas/LeafSelector'
          provider:
            $ref: '#/components/schemas/ExternalProvider'
      description: |-
        Which leaf to negotiate playback for, on the peer actually holding it.
        `ExternalRef` -- `(provider, external_id, LeafSelector)`, §4.2's
        portability layer -- is the only variant either of this crate's own
        callers ([`forward_negotiation_to_peer`], reached from both
        `playback_info_handler`'s locally-resolved path and
        [`by_external_ref_playback_info_handler`]'s §4.3 `RemoteOnlyWork` path)
        ever actually sends: a local `media_file_id` is only ever meaningful on
        the node that minted it (§4.1), so forwarding one to a *different* node
        would resolve to nothing there -- see [`LocalRouteOutcome`]'s own doc
        comment. `MediaFile` is still accepted on the receiving side
        ([`peer_playback_info_handler`]) for a caller that, unlike this crate's
        own, already knows it's addressing a media file id meaningful on the
        *receiving* peer specifically (kept as a documented, valid wire shape
        rather than removed, even though nothing in this codebase constructs it
        today).
    PeerPolicyRow:
      allOf:
      - $ref: '#/components/schemas/Policy'
      - type: object
        required:
        - updated_at
        properties:
          deleted_at:
            type:
            - string
            - 'null'
            format: date-time
          origin_peer_id:
            type:
            - string
            - 'null'
            format: uuid
          updated_at:
            type: string
            format: date-time
      description: |-
        Wire shape of one `policies` row on `GET /api/v1/peer/accounts` --
        field-for-field identical to `playarr_peer_sync::account_sync::
        PolicySyncRow`. `Policy` carries no secret, so (unlike [`PeerUserRow`])
        this flattens the real `playarr_model::Policy` directly: one type,
        zero risk of the two shapes drifting apart.
    PeerSyncStatusResponse:
      type: object
      description: |-
        One peer node's most recently reported sync outcome -- mirrors
        `admin::SourceInstanceSyncStatusResponse`'s exact shape. Serialize-only,
        matching that type -- nothing in this crate ever deserializes it (the
        `status: Option<&'static str>` field can't derive `Deserialize` without
        forcing a `'static` borrow out of the input buffer).
      required:
      - peer_node_id
      - name
      properties:
        detail:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        peer_node_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
          description: |-
            Always `None` in Phase 1. `PeerSyncPoller` (`docs/architecture/
            peer-groups.md` §3.6) does not exist yet -- there is no real sync
            run to report. This is a deliberate stub matching `admin
            ::sync_status_handler`'s own "unreported" shape (`status: None`
            together with every other field below), not a fabricated
            "succeeded"/"never synced" value. Phase 2 wires a real
            `SyncStatusReporter` through here in place of this stub.
    PeerUserRow:
      type: object
      description: |-
        Wire shape of one `users` row on `GET /api/v1/peer/accounts` --
        field-for-field identical to `playarr_peer_sync::account_sync::
        UserSyncRow`'s flattened wire shape (`playarr_model::User`'s own
        fields plus the three sync-only columns). Not `User` itself flattened
        via `#[serde(flatten)]`: `User` is deliberately not `ToSchema`-derived
        (it carries `password_hash` -- see that type's own doc comment); this
        is the one narrow, deliberate exception to "never on an HTTP response"
        that field's doc comment warns about -- the design doc's §3.1 table
        explicitly lists `password_hash` as one of the few fields that DOES
        sync between group peers ("already a hash, replicating it is exactly
        what makes a password valid on every node"), and this type is never
        reachable from any browser-facing route, only from a
        [`PeerSignedRequest`]-gated node-to-node call.
      required:
      - id
      - username
      - display_name
      - password_hash
      - policy_id
      - created_at
      - disabled
      - preferred_audio_language
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        disabled:
          type: boolean
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        origin_peer_id:
          type:
          - string
          - 'null'
          format: uuid
        password_hash:
          type: string
        policy_id:
          type: string
          format: uuid
        preferred_audio_language:
          type: string
        updated_at:
          type: string
          format: date-time
        username:
          type: string
    PersonResponse:
      type: object
      required:
      - id
      - name
      properties:
        headshot_url:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        name:
          type: string
    PlayMethod:
      type: string
      enum:
      - direct_play
      - direct_stream
      - transcode
    PlaybackActivityActiveResponse:
