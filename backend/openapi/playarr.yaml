        language:
          type:
          - string
          - 'null'
        stream_index:
          type: integer
          format: int32
          minimum: 0
        url:
          type: string
          description: Authenticated WebVTT sidecar aligned to this playback URL's timeline.
    PlayerPreferencesResponse:
