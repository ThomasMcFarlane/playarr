# Manual check of the per-owner Ops App credentials used by release.yml and backend-release.yml to
# notify the cluster release gate. Mints a token asking for contents: write on the cluster repository
# only (the level the dispatch needs; the mint fails if the App installation does not grant it), reads
# the repository and reports the permission levels the token holds. It dispatches nothing and changes
# nothing, and never prints the token.
name: Ops App credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Mint an Ops App token and report its permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .cluster
          permission-contents: write
      - name: Read the cluster repository
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/.cluster" \
            --jq '"readable: " + .name, "token permissions on the cluster repository: " + (.permissions | to_entries | map(.key + "=" + (.value | tostring)) | join(", ")), "contents write granted: " + (.permissions.push | tostring)'
