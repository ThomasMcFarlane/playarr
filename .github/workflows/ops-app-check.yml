# Manual check of the per-owner Ops App credentials used by release.yml and backend-release.yml to
# notify the cluster release gate. Mints a token asking for contents: write on the cluster repository
# only (the level the dispatch needs; the mint fails if the App installation does not grant it), reads
# the repository. It dispatches nothing and changes
# nothing, and never prints the token.
name: Ops App credentials check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Mint an Ops App token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .cluster
          permission-contents: write
      - name: Read the cluster repository
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/.cluster" --jq '"readable: " + .name'
          # GitHub refuses to mint a token for a permission the installation does not hold, so reaching
          # this line proves contents: write is granted. (The repository "permissions" field describes
          # a user, not an installation token, so it is not reported.)
          echo "contents write granted: true (token minted with permission-contents: write)"
