name: Publish Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without the android-v prefix (e.g. 0.2.11)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-android-${{ github.ref }}-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-android
    defaults:
      run:
        working-directory: clients/android
    # Do not put `runner.temp` in job-level `env` — GitHub rejects it when
    # parsing the workflow (`Unrecognized named-value: 'runner'`), which
    # prevented tag-triggered publish runs from starting.
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#android-v}"
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a tag such as android-v1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be below 1000" >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 2015 )); then
            echo "Published Android builds already use versionCode 2015; choose a version newer than 0.2.15" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "keystore_path=${{ runner.temp }}/playarr-android-release.jks" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release-signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Test and build signed APK
        env:
          PLAYARR_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAYARR_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: >-
          ./gradlew
          :app:testSideloadDebugUnitTest
          :app:assembleSideloadRelease

      - name: Verify and package APK
        id: package
        shell: bash
        env:
          EXPECTED_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: |
          mobile_apk="$(find app/build/outputs/apk/sideload/release -name '*.apk' -type f -print -quit)"
          if [[ -z "$mobile_apk" ]]; then
            echo "Signed release APK output is missing" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          ../../scripts/verify-android-release-apk.sh \
            "$mobile_apk" \
            "$apksigner" \
            "$aapt" \
            "$EXPECTED_ANDROID_SIGNING_CERT_SHA256" \
            "io.playarr.mobile" \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.code }}"
          mkdir -p release
          cp "$mobile_apk" release/playarr-android.apk
          sha256sum release/*.apk > release/SHA256SUMS
          apk_sha256="$(sha256sum release/playarr-android.apk | cut -d ' ' -f 1)"
          printf '{"version_name":"%s","version_code":%s,"apk_url":"https://playarr.app/downloads/android/releases/%s/playarr-android.apk","sha256":"%s"}\n' \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.code }}" \
            "${{ steps.version.outputs.name }}" \
            "$apk_sha256" \
            > release/playarr-android.json

      - name: Upload workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: playarr-android-${{ steps.version.outputs.name }}
          path: clients/android/release/
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/android/release/playarr-android.apk
            clients/android/release/playarr-android.json
            clients/android/release/SHA256SUMS
          generate_release_notes: true
