name: Publish Android APK

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-android
    defaults:
      run:
        working-directory: clients/android
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/playarr-android-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a tag such as android-v1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be below 1000" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release-signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Test and build signed APK
        env:
          PLAYARR_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAYARR_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:assembleRelease

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          mobile_apk="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          if [[ -z "$mobile_apk" ]]; then
            echo "Signed release APK output is missing" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$mobile_apk"
          mkdir -p release
          cp "$mobile_apk" release/playarr-android.apk
          sha256sum release/*.apk > release/SHA256SUMS
          apk_sha256="$(sha256sum release/playarr-android.apk | cut -d ' ' -f 1)"
          printf '{"version_name":"%s","version_code":%s,"apk_url":"https://playarr.app/downloads/android/releases/%s/playarr-android.apk","sha256":"%s"}\n' \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.code }}" \
            "${{ steps.version.outputs.name }}" \
            "$apk_sha256" \
            > release/playarr-android.json

      - name: Upload workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: playarr-android-${{ steps.version.outputs.name }}
          path: clients/android/release/
          if-no-files-found: error

      - name: Upload versioned and latest APK to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          npx --yes wrangler@4 r2 object put "playarr-client-downloads/android/releases/${VERSION}/playarr-android.apk" --file release/playarr-android.apk --content-type application/vnd.android.package-archive --remote
          npx --yes wrangler@4 r2 object put "playarr-client-downloads/android/playarr-android.apk" --file release/playarr-android.apk --content-type application/vnd.android.package-archive --remote
          npx --yes wrangler@4 r2 object put "playarr-client-downloads/android/releases/${VERSION}/SHA256SUMS" --file release/SHA256SUMS --content-type text/plain --remote
          npx --yes wrangler@4 r2 object put "playarr-client-downloads/android/playarr-android.json" --file release/playarr-android.json --content-type application/json --remote

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clients/android/release/playarr-android.apk
            clients/android/release/playarr-android.json
            clients/android/release/SHA256SUMS
          generate_release_notes: true
