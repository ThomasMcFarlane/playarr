      #     /p:Configuration=Release /p:Platform=x64 `
      #     /p:AppxBundlePlatforms=x64 /p:AppxPackageDir=artifacts/msix `
      #     /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload
