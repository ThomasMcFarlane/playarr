      # the same pattern android-ci.yml uses for ANDROID_KEYSTORE_BASE64 /
      # ANDROID_KEYSTORE_PASSWORD -- e.g. secrets named something like
      # XBOX_SIGNING_CERT_BASE64 and XBOX_SIGNING_CERT_PASSWORD. NEITHER OF
      # THOSE SECRETS EXISTS IN THIS REPO YET. Do not reference
      # `secrets.XBOX_SIGNING_CERT_BASE64` (or similar) in a real `env:`/
      # `with:` block until they've actually been created in the
      # release-xbox environment -- this step is an unverified placeholder.
      - name: Restore signing certificate (placeholder)
        run: |
          echo "TODO: decode a base64-encoded .pfx into a temporary file from a secret such as XBOX_SIGNING_CERT_BASE64 (does not exist yet), then import it so MSBuild can sign the MSIX package."

      # TODO: once src/Playarr.Xbox exists with a valid UWP project and
      # package manifest (Package.appxmanifest), replace with a real
      # MSBuild invocation, e.g. (UNVERIFIED -- do not copy verbatim
