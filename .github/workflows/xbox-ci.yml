# =============================================================================
# Xbox Release
# =============================================================================
#
# Release-track workflow for the Xbox client. Triggered by pushing a tag
# like `xbox-v1.0.4`.
#
# clients/xbox is a .NET solution (Playarr.Xbox.sln) split into two
# projects:
#   - src/Playarr.Core (netstandard2.0): the portable client core -- API
#     client, device-code auth, session/catalog/playback models. This
#     genuinely builds and tests with the `dotnet` CLI, so `core-check`
#     below is a real, working job, not a placeholder. It mirrors the
#     Justfile's `xbox-core-build` / `xbox-core-test` recipes.
#   - src/Playarr.Xbox (UWP, TargetPlatformIdentifier=UAP): the Xbox
#     application head. This is a legacy UWP project -- it needs MSBuild,
#     the Windows 10 SDK, and Visual Studio's UWP workload, and cannot be
#     built with the `dotnet` CLI at all (on any OS, not just Linux). It
#     also has no signing certificate or Microsoft Partner Center
#     credentials yet, so `build-and-package` builds an UNSIGNED x64
#     sideload MSIX on the hosted Visual Studio 2022 image. Sign it before
#     sideloading in Xbox Dev Mode; Store submission needs Partner Center.
#     ci.yml's xbox-check job is the PR-time gate on Playarr.Core.
# =============================================================================

name: Xbox Release

on:
  push:
    tags:
      - 'xbox-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version stamped into the package (X.Y.Z)'
        type: string
        required: true
  # Called by release.yml: leaves the unsigned sideload MSIX as the `playarr-xbox-package` artefact.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Real, working job: build & test the portable client core. Uses the
  # same two csproj paths as the Justfile's xbox-core-build/xbox-core-test
  # recipes.
  # ---------------------------------------------------------------------
  core-check:
    name: Build & test Playarr.Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/xbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet build (Playarr.Core)
        run: dotnet build src/Playarr.Core/Playarr.Core.csproj

      - name: dotnet test (Playarr.Core.Tests)
        run: dotnet test tests/Playarr.Core.Tests/Playarr.Core.Tests.csproj

  # ---------------------------------------------------------------------
  # Placeholder job: the UWP application head (src/Playarr.Xbox) cannot be
  # built with the dotnet CLI at all -- it needs real MSBuild + the
  # Windows 10 SDK + the UWP workload, so this needs a Windows runner with
  # genuine checkout/toolchain-setup steps. The restore/build/package/
  # upload steps themselves are unverified TODO placeholders -- see the
  # file header comment above for why.
  # ---------------------------------------------------------------------
  build-and-package:
    name: Build the unsigned UWP sideload package
    needs: core-check
    # The UWP workload (MSBuild, Windows 10 SDK, .NET Native toolchain) ships on the Visual
    # Studio 2022 image. There is no signing certificate yet, so the MSIX is unsigned: sign it
    # with a certificate before sideloading it in Xbox Dev Mode.
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release-xbox
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Stamp the version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } else { $env:GITHUB_REF_NAME -replace '^xbox-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a version such as 1.2.3, got '$version'" }
          $manifest = 'clients/xbox/src/Playarr.Xbox/Package.appxmanifest'
          $text = Get-Content $manifest -Raw
          $updated = $text -replace '(<Identity[^>]*?Version=")[^"]+(")', "`${1}$version.0`${2}"
          if ($updated -eq $text) { throw 'Package.appxmanifest Identity Version not found' }
          Set-Content -Path $manifest -Value $updated -NoNewline
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the unsigned x64 MSIX
        shell: pwsh
        run: |
          msbuild clients/xbox/src/Playarr.Xbox/Playarr.Xbox.csproj /restore /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$env:RUNNER_TEMP\AppPackages\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem "$env:RUNNER_TEMP\AppPackages" -Recurse -Include *.msix, *.appx | Select-Object -First 1
          if (-not $package) { throw 'msbuild produced no MSIX/APPX package' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\xbox" | Out-Null
          Copy-Item $package.FullName "$env:RUNNER_TEMP\xbox\playarr-xbox-$env:VERSION-x64-unsigned$($package.Extension)"
          Get-ChildItem "$env:RUNNER_TEMP\xbox"

      - name: Keep the generated manifest for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xbox-generated-manifest
          path: clients/xbox/src/Playarr.Xbox/**/AppxManifest.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: playarr-xbox-package
          path: ${{ runner.temp }}/xbox/*
          if-no-files-found: error
