# =============================================================================
# Xbox Release
# =============================================================================
#
# Release-track workflow for the Xbox client. Triggered by pushing a tag
# like `xbox-v1.0.4`.
#
# clients/xbox is a .NET solution (Playarr.Xbox.sln) split into two
# projects:
#   - src/Playarr.Core (netstandard2.0): the portable client core -- API
#     client, device-code auth, session/catalog/playback models. This
#     genuinely builds and tests with the `dotnet` CLI, so `core-check`
#     below is a real, working job, not a placeholder. It mirrors the
#     Justfile's `xbox-core-build` / `xbox-core-test` recipes.
#   - src/Playarr.Xbox (UWP, TargetPlatformIdentifier=UAP): the Xbox
#     application head. This is a legacy UWP project -- it needs MSBuild,
#     the Windows 10 SDK, and Visual Studio's UWP workload, and cannot be
#     built with the `dotnet` CLI at all (on any OS, not just Linux). It
#     also has no signing certificate or Microsoft Partner Center
#     credentials configured yet. The `build-and-package` job below sets up
#     real Windows/MSBuild tooling but its actual restore/build/package/
#     upload steps are TODO placeholders for that reason, same as
#     a placeholder pending a signing certificate. Replace the
#     placeholders with real MSBuild/MSIX steps once Playarr.Xbox has a
#     signing certificate and the packaging steps have been verified by
#     hand at least once. See ci.yml's xbox-check job for the PR-time
#     `dotnet build`/`dotnet test` gate on Playarr.Core that already runs
#     today.
# =============================================================================

name: Xbox Release

on:
  push:
    tags:
      - 'xbox-v*'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Real, working job: build & test the portable client core. Uses the
  # same two csproj paths as the Justfile's xbox-core-build/xbox-core-test
  # recipes.
  # ---------------------------------------------------------------------
  core-check:
    name: Build & test Playarr.Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/xbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet build (Playarr.Core)
        run: dotnet build src/Playarr.Core/Playarr.Core.csproj

      - name: dotnet test (Playarr.Core.Tests)
        run: dotnet test tests/Playarr.Core.Tests/Playarr.Core.Tests.csproj

  # ---------------------------------------------------------------------
  # Placeholder job: the UWP application head (src/Playarr.Xbox) cannot be
  # built with the dotnet CLI at all -- it needs real MSBuild + the
  # Windows 10 SDK + the UWP workload, so this needs a Windows runner with
  # genuine checkout/toolchain-setup steps. The restore/build/package/
  # upload steps themselves are unverified TODO placeholders -- see the
  # file header comment above for why.
  # ---------------------------------------------------------------------
  build-and-package:
    name: Build UWP head (MSIX signing and publish are placeholders)
    needs: core-check
    # Runs on a GitHub-hosted Windows runner, which ships MSBuild, the Windows
    # 10/11 SDKs and the UWP workload. It only reaches the (still placeholder)
    # signing/packaging steps; it is enabled so the toolchain setup is
    # exercised on every Xbox tag.
    runs-on: windows-latest
    environment: release-xbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # TODO: restore a code-signing certificate for the MSIX package.
      # This would decode a base64-encoded .pfx from a repository secret,
      # the same pattern android-ci.yml uses for ANDROID_KEYSTORE_BASE64 /
      # ANDROID_KEYSTORE_PASSWORD -- e.g. secrets named something like
      # XBOX_SIGNING_CERT_BASE64 and XBOX_SIGNING_CERT_PASSWORD. NEITHER OF
      # THOSE SECRETS EXISTS IN THIS REPO YET. Do not reference
      # `secrets.XBOX_SIGNING_CERT_BASE64` (or similar) in a real `env:`/
      # `with:` block until they've actually been created in the
      # release-xbox environment -- this step is an unverified placeholder.
      - name: Restore signing certificate (placeholder)
        run: |
          echo "TODO: decode a base64-encoded .pfx into a temporary file from a secret such as XBOX_SIGNING_CERT_BASE64 (does not exist yet), then import it so MSBuild can sign the MSIX package."

      # Unsigned Release x64 build of the UWP head on the hosted Windows image
      # (MSBuild, Windows SDK and the UWP workload are preinstalled). UNVERIFIED
      # on a hosted runner: the first xbox-v* tag run is the proof. Signing and
      # Store packaging (AppxBundle/StoreUpload) are added once a certificate exists.
      - name: Build UWP head (unsigned)
        shell: pwsh
        run: |
          msbuild clients/xbox/src/Playarr.Xbox/Playarr.Xbox.csproj /restore `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never

      # TODO: publish the signed MSIX -- to a GitHub release
      # (softprops/action-gh-release@v2, matching android-ci.yml) and/or
      # submit via the Microsoft Store submission API once Partner Center
      # credentials exist. None of those credentials/targets are wired up
      # yet.
      - name: Publish MSIX (placeholder)
        run: |
          echo "TODO: upload the signed MSIX package for tag ${env:GITHUB_REF_NAME}."
