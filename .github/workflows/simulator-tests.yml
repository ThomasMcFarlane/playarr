name: Apple Simulator tests

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full commit SHA to test (default - the selected ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Test Playarr ${{ matrix.name }} on ${{ matrix.device }} Simulator
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            device: iPhone
            platform: iOS
            directory: clients/ios
            workspace: clients/ios/Playarr.xcworkspace
            project: ""
            scheme: PlayarrApp
            destination: platform=iOS Simulator,name=iPhone 17
          - name: tvOS
            device: Apple TV
            platform: tvOS
            directory: clients/apple-tv
            workspace: ""
            project: clients/apple-tv/PlayarrTV.xcodeproj
            scheme: PlayarrTV
            destination: platform=tvOS Simulator,name=Apple TV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Prepare the CocoaPods workspace
        if: ${{ matrix.name == 'iOS' }}
        shell: bash
        timeout-minutes: 20
        run: bash clients/ios/scripts/prepare.sh

      - name: Record the toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Create an isolated test simulator
        id: simulator
        shell: bash
        timeout-minutes: 5
        env:
          INPUT_DESTINATION: ${{ matrix.destination }}
        run: node .github/scripts/apple-test-simulator/main.js

      - name: Run the Xcode tests
        shell: bash
        working-directory: ${{ matrix.directory }}
        timeout-minutes: 45
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          PLATFORM: ${{ matrix.platform }}
          SCHEME: ${{ matrix.scheme }}
          WORKSPACE: ${{ matrix.workspace }}
          PROJECT: ${{ matrix.project }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$SIMULATOR_UDID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          args=(-scheme "$SCHEME" -configuration Debug -resultBundlePath "$RUNNER_TEMP/apple-$NAME.xcresult")
          if [[ -n "$WORKSPACE" ]]; then args+=(-workspace "$GITHUB_WORKSPACE/$WORKSPACE"); fi
          if [[ -n "$PROJECT" ]]; then args+=(-project "$GITHUB_WORKSPACE/$PROJECT"); fi
          args+=(-destination "platform=$PLATFORM Simulator,id=$SIMULATOR_UDID")
          xcodebuild test "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/apple-log-$NAME.txt"

      - name: Delete the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        shell: bash
        timeout-minutes: 5
        env:
          STATE_simulator_udid: ${{ steps.simulator.outputs.udid }}
        run: node .github/scripts/apple-test-simulator/cleanup.js

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-log-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-log-${{ matrix.name }}.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-xcresult-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apple-${{ matrix.name }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
