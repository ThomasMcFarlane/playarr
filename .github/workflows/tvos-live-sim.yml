name: tvOS live simulator

# Manual only. Builds the current Playarr tvOS app, boots an Apple TV 1080p simulator on a GitHub-hosted macOS
# runner, signs the app in as the device test account and streams ONLY the simulator over VNC to the owner's tailnet
# (scripts/sim-vnc). The job stays alive for the chosen number of hours, then tears everything down.
# The repository is public: never switch this job to a self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Hours to keep the simulator alive (the job ends after this)
        required: true
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]
        default: "4"
      source_sha:
        description: Optional full commit SHA to build (default - the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tvos-live-sim
  cancel-in-progress: true

env:
  VNC_PORT: "5900"
  APP_BUNDLE_ID: com.playarr.playarr.tvos

jobs:
  live-sim:
    name: Apple TV simulator over VNC
    runs-on: macos-latest
    # The stay-alive time plus 15 minutes for setup and teardown; a hosted job cannot run longer than 360.
    timeout-minutes: ${{ fromJSON('{"1":75,"2":135,"3":195,"4":255,"5":315,"6":360}')[inputs.hours] }}
    steps:
      - name: Record the start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: playarr-tvos-sim

      - name: Record the toolchain
        run: |
          xcodebuild -version
          sw_vers
          tailscale ip -4 >/dev/null

      - name: Pick the 1080p Apple TV simulator
        id: simulator
        run: |
          set -euo pipefail
          types=$(xcrun simctl list devicetypes -j)
          type=$(node -e '
            const t = JSON.parse(process.argv[1]).devicetypes.filter((d) => d.identifier.includes("Apple-TV") && /1080p/i.test(d.name));
            if (!t.length) { console.error("no Apple TV 1080p device type is installed"); process.exit(1); }
            console.log(t[t.length - 1].identifier);
          ' "$types")
          runtime=$(xcrun simctl list runtimes -j | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const r = JSON.parse(s).runtimes.filter((x) => x.isAvailable && x.identifier.includes("tvOS"));
              console.log(r.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }))[0].identifier);
            });')
          echo "device type: $type  runtime: $runtime"
          udid=$(xcrun simctl create "Playarr live" "$type" "$runtime")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build the tvOS app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project clients/apple-tv/PlayarrTV.xcodeproj -scheme PlayarrTV -configuration Debug \
            -destination "platform=tvOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.txt" | tail -n 30 \
            || { grep -E "error:" "$RUNNER_TEMP/build.txt" | sort -u | head -40; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install idb (simulator input and video)
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew trust --formula facebook/fb/idb-companion
          brew install facebook/fb/idb-companion
          python -m venv "$RUNNER_TEMP/idb-venv"
          "$RUNNER_TEMP/idb-venv/bin/pip" install --quiet -r scripts/sim-vnc/requirements.txt
          echo "IDB=$RUNNER_TEMP/idb-venv/bin/idb" >> "$GITHUB_ENV"

      - name: Boot the simulator and install the app
        run: |
          set -euo pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'PlayarrTV.app' | head -1)
          xcrun simctl install "$udid" "$app"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          # The idb companion talks to the booted simulator; the idb client reaches it over localhost.
          nohup nice -n 5 idb_companion --udid "$udid" --grpc-port 10880 > "$RUNNER_TEMP/idb-companion.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/idb-companion.pid"
          sleep 5
          "$IDB" connect localhost 10880

      - name: Sign in as the device test account
        env:
          SERVER_URL: ${{ secrets.PLAYARR_DEVICE_TEST_SERVER_URL }}
          TEST_USERNAME: ${{ secrets.PLAYARR_DEVICE_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PLAYARR_DEVICE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SERVER_URL" && -n "$TEST_USERNAME" && -n "$TEST_PASSWORD" ]] || { echo "::error::the device test account secrets are not set"; exit 1; }
          python3 scripts/sim-vnc/seed_session.py --udid "$SIM_UDID" --bundle "$APP_BUNDLE_ID"
          xcrun simctl launch "$SIM_UDID" "$APP_BUNDLE_ID" -PlayarrTheme dark

      - name: Self-check the simulator screen and input
        continue-on-error: true
        run: |
          set +e
          sleep 20
          echo "saved defaults keys (names only):"
          xcrun simctl spawn "$SIM_UDID" defaults read "$APP_BUNDLE_ID" | grep -E '^ *"?com\.playarr' | cut -d= -f1 | sed -E 's#session\..*#session.<server>#'
          xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "PlayarrTV"' 2>/dev/null | grep -i -E "profile|decod|401|refresh" | cut -c1-200 | tail -15
          xcrun simctl io "$SIM_UDID" screenshot --type=jpeg "$RUNNER_TEMP/check.jpg" && sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/check.jpg"
          "$IDB" ui key --udid "$SIM_UDID" 79; echo "idb key exit: $?"
          timeout 8 "$IDB" video-stream --udid "$SIM_UDID" --fps 30 --format mjpeg | head -c 200000 | wc -c
          tail -n 5 "$RUNNER_TEMP/idb-companion.log"

      - name: Start the VNC server on the tailnet address
        env:
          PLAYARR_VNC_PASSWORD: ${{ secrets.PLAYARR_VNC_TVOS_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$PLAYARR_VNC_PASSWORD" ]] || { echo "::error::PLAYARR_VNC_TVOS_PASSWORD is not set"; exit 1; }
          ip=$(tailscale ip -4 | head -1)
          echo "TS_IP=$ip" >> "$GITHUB_ENV"
          nohup nice -n 5 python3 scripts/sim-vnc/sim_vnc.py --udid "$SIM_UDID" --bind "$ip" --port "$VNC_PORT" --idb "$IDB" --fps 24 \
            --ready-file "$RUNNER_TEMP/vnc.ready" > "$RUNNER_TEMP/sim-vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sim-vnc.pid"
          for _ in $(seq 1 90); do [[ -s "$RUNNER_TEMP/vnc.ready" ]] && break; kill -0 "$(cat "$RUNNER_TEMP/sim-vnc.pid")" || { cat "$RUNNER_TEMP/sim-vnc.log"; exit 1; }; sleep 1; done
          [[ -s "$RUNNER_TEMP/vnc.ready" ]] || { cat "$RUNNER_TEMP/sim-vnc.log"; exit 1; }
          {
            echo "### Apple TV simulator is live"
            echo
            echo "- VNC address: \`$ip:$VNC_PORT\` (MagicDNS name \`playarr-tvos-sim\` if enabled)"
            echo "- Password: repository secret \`PLAYARR_VNC_TVOS_PASSWORD\`"
            echo "- Stays up for ${{ inputs.hours }} hour(s) from the job start"
            echo "- Keys: arrows move, Return selects, Escape or Backspace is Menu, Space is Play/Pause"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stay alive
        env:
          PLAYARR_VNC_PASSWORD: ${{ secrets.PLAYARR_VNC_TVOS_PASSWORD }}
        run: |
          set -euo pipefail
          export DEADLINE=$(( JOB_START + ${{ inputs.hours }} * 3600 ))
          [[ ${{ inputs.hours }} -lt 6 ]] || export DEADLINE=$(( JOB_START + 355 * 60 ))
          bash scripts/sim-vnc/keepalive.sh

      - name: Stop the VNC server and delete the simulator
        if: always()
        run: |
          [[ ! -f "$RUNNER_TEMP/idb-companion.pid" ]] || kill "$(cat "$RUNNER_TEMP/idb-companion.pid")" 2>/dev/null || true
          [[ ! -f "$RUNNER_TEMP/sim-vnc.pid" ]] || kill "$(cat "$RUNNER_TEMP/sim-vnc.pid")" 2>/dev/null || true
          [[ -z "${SIM_UDID:-}" ]] || xcrun simctl delete "$SIM_UDID" || true
          [[ ! -f "$RUNNER_TEMP/sim-vnc.log" ]] || tail -n 30 "$RUNNER_TEMP/sim-vnc.log"
