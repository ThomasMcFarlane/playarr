# =============================================================================
# Playarr Server release
# =============================================================================
#
# Triggered by pushing a tag such as `backend-v0.1.0` (or a pre-release such as
# `backend-v0.2.0-rc.1`):
#
#   * Linux x86-64 and ARM64 tarballs (binary + Admin UI + LICENSE + example
#     systemd units) and SHA-256 checksums, attached to the GitHub release.
#     GitHub Releases is the only download store; https://playarr.app/downloads/server/
#     redirects to these assets (see docs/deployment/server-releases.md).
#   * A multi-arch container image, ghcr.io/thomasmcfarlane/playarr,
#     tagged <version> and `latest` (pre-releases only get the version tag),
#     with an SBOM and provenance attestation. The GHCR package must be public
#     for anonymous `docker pull`; see scripts/ghcr-make-public.sh.
#
# Everything is built by infra/docker/backend.Dockerfile on GitHub-hosted
# runners. The Rust build cross-compiles natively on the x86-64 runner (no QEMU
# compile), so the tarball binary is byte-identical to the one in the image.
# =============================================================================

name: Backend Release

on:
  push:
    tags:
      - 'backend-v*'
  # Called by release.yml (the single all-platform release): builds, smoke-tests and pushes the
  # image, and leaves the tarballs plus latest.json as the `playarr-server-dist` artefact for that
  # workflow's GitHub Release instead of creating a `backend-v*` release of its own.
  workflow_call:
    inputs:
      version:
        description: 'Release version (X.Y.Z); must match backend/Cargo.toml'
        type: string
        required: true
      dry_run:
        description: 'Build everything but push no image'
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
    # Run against an existing tag ("Use workflow from" = the tag) to re-publish.
    inputs:
      dry_run:
        description: 'Build everything (binaries, tarballs, smoke test, multi-arch image) from any ref but publish nothing: no GHCR login or push, no downloads upload.'
        type: boolean
        default: false

concurrency:
  group: backend-release-${{ github.ref }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/thomasmcfarlane/playarr

jobs:
  build:
    name: Build binaries and image
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate the version
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -n 1)"
          if [[ -n "${VERSION_INPUT:-}" ]]; then
            version="$VERSION_INPUT"
          elif [[ "${DRY_RUN:-false}" == "true" ]]; then
            version="${crate}-dryrun"
          else
            case "$GITHUB_REF_NAME" in
              backend-v*) ;;
              *) echo "Run this workflow from a backend-v* tag, not '$GITHUB_REF_NAME'." >&2; exit 1 ;;
            esac
            version="${GITHUB_REF_NAME#backend-v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag version '$version' is not semver." >&2; exit 1
          fi
          if [[ "${version%%-*}" != "$crate" ]]; then
            echo "Tag version $version does not match backend crate version $crate (backend/Cargo.toml)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner has a fixed disk, and a release compiles Rust for two
      # architectures. Each build exports only its binary (`-o type=local`, never
      # into the image store) and the BuildKit cache is pruned after every
      # architecture, so the peak is one architecture's compile rather than both
      # plus a third compile for the image. The image step below reuses these
      # exact binaries instead of compiling again.
      - name: Build server binaries and Admin UI
        shell: bash
        run: |
          set -euo pipefail
          df -h . | tail -1
          for arch in amd64 arm64; do
            docker buildx build --target binary --platform "linux/$arch" \
              -f infra/docker/backend.Dockerfile -o "type=local,dest=build/$arch" .
            docker buildx prune --all --force >/dev/null
            df -h . | tail -1
          done
          docker buildx build --target web --platform linux/amd64 \
            -f infra/docker/backend.Dockerfile -o type=local,dest=build/web .
          docker buildx prune --all --force >/dev/null
          df -h . | tail -1
          for a in amd64 arm64; do
            test "$(head -c4 "build/$a/playarr-server" | od -An -c | tr -d ' ')" = '177ELF' && echo "$a: ELF binary ok"
          done

      - name: Package tarballs and checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            scripts/package-server-release.sh "$VERSION" "$arch" "build/$arch/playarr-server" build/web/web dist
          done
          (cd dist && sha256sum playarr-server-*.tar.gz > "playarr-server-${VERSION}-SHA256SUMS" && cat "playarr-server-${VERSION}-SHA256SUMS")

      - name: Smoke-test the amd64 tarball
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "dist/playarr-server-${VERSION}-linux-amd64.tar.gz" -C "$tmp"
          dir="$tmp/playarr-server-${VERSION}-linux-amd64"
          mkdir "$tmp/data"
          DATABASE_URL="sqlite://$tmp/data/playarr.db" PLAYARR_HTTP_BIND_ADDR=127.0.0.1:18484 \
            PLAYARR_METRICS_BIND_ADDR=127.0.0.1:19090 "$dir/playarr-server" serve > "$tmp/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18484/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18484/healthz >/dev/null || { cat "$tmp/server.log"; exit 1; }
          curl -fsS http://127.0.0.1:18484/ | grep -qi '<!doctype html' || { echo "Admin UI not served" >&2; exit 1; }
          kill "$pid"

      - name: Image tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [[ "$PRERELEASE" != "true" ]]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Assembles the runtime image around the binaries built above (named
      # build context `prebuilt`, see the ARTIFACTS argument in the Dockerfile).
      # The build context is infra/docker, a few kilobytes, not the repository.
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: infra/docker
          file: infra/docker/backend.Dockerfile
          target: runtime
          build-contexts: prebuilt=build
          build-args: ARTIFACTS=prebuilt-artifacts
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Write the latest manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          asset() {
            local arch="$1" file="playarr-server-${VERSION}-linux-$1.tar.gz"
            jq -n --arg url "https://playarr.app/downloads/server/${file}" \
              --arg sha "$(cut -d ' ' -f 1 "dist/${file}.sha256")" \
              --argjson size "$(stat -c %s "dist/${file}")" \
              '{url: $url, sha256: $sha, size: $size}'
          }
          jq -n --arg version "$VERSION" \
            --arg image "${IMAGE}:${VERSION}" --arg digest "$IMAGE_DIGEST" \
            --arg released "$(date -u +%FT%TZ)" \
            --argjson amd64 "$(asset amd64)" --argjson arm64 "$(asset arm64)" \
            --arg sums "https://playarr.app/downloads/server/playarr-server-${VERSION}-SHA256SUMS" \
            '{version: $version, released_at: $released, image: $image, image_digest: $digest, sha256sums_url: $sums, assets: {amd64: $amd64, arm64: $arm64}}' \
            > dist/latest.json
          cat dist/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: playarr-server-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloads
    needs: build
    # A workflow_call (release.yml) publishes these assets in its own single release.
    if: ${{ !inputs.dry_run && !inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: playarr-server-dist
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c "playarr-server-${VERSION}-SHA256SUMS"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Playarr Server ${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            dist/playarr-server-*.tar.gz
            dist/playarr-server-*.sha256
            dist/playarr-server-*-SHA256SUMS
            dist/latest.json
          body: |
            Container image: `${{ env.IMAGE }}:${{ env.VERSION }}` (`${{ needs.build.outputs.digest }}`)

            Downloads: https://playarr.app/clients/server
