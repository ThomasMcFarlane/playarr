# =============================================================================
# Playarr Server CI
# =============================================================================
#
# Single CI workflow for pull requests and pushes to `main`. A `changes` job
# runs dorny/paths-filter once and every platform-specific check job is
# gated on its boolean output, so a PR that only touches a client
# doesn't pay for a Rust/Android/tv-web build.
#
# BRANCH PROTECTION -- READ THIS BEFORE CONFIGURING REQUIRED STATUS CHECKS:
#   Only the terminal `ci-required` job should ever be added as a "required
#   status check" in this repo's branch protection settings. Do NOT mark
#   `backend-check`, `android-check`, `ios-check`, `xbox-check`,
#   `tv-web-check`, or `openapi-contract-check` as required themselves.
#
#   Those jobs are conditional (`if: needs.changes.outputs.<platform> ==
#   'true'`). When a job is skipped by its own `if:`, GitHub reports its
#   status as "skipped", not "success" -- and a required check that a PR's
#   file set can cause to never run at all is a well-known way to
#   permanently block merges (the check just sits pending forever). GitHub
#   pages team maintains the recommended pattern is a single always-run
#   aggregator job, which is what `ci-required` is here: it `needs` every
#   other job, runs unconditionally (`if: always()`), and explicitly maps
#   skipped -> pass while failure/cancelled -> fail. That makes it the only
#   job that is guaranteed to always report a final pass/fail for any PR,
#   regardless of which paths changed, so it's the only one safe to require.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled by newer pushes. A run on main is never
  # cancelled mid-flight, so the newest main commit always completes CI and
  # triggers the deploy workflows (web, regional image, Android). Main runs
  # queue per ref, in order; a newer queued run replaces an older queued one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Detect which platform(s) a PR/push touches, so downstream jobs can
  # skip themselves when irrelevant. Directory names below reflect the
  # monorepo layout as defined by the in-flight scaffolding tasks for each
  # component -- update these globs here if a component's directory layout
  # changes.
  # ---------------------------------------------------------------------
  changes:
    name: Detect changed platforms
    runs-on: playarr-runners
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
      xbox: ${{ steps.filter.outputs.xbox }}
      harmony: ${{ steps.filter.outputs.harmony }}
      tv-web: ${{ steps.filter.outputs.tv-web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            android:
              - 'clients/android/**'
              - '.github/workflows/ci.yml'
            xbox:
              - 'clients/xbox/**'
              - '.github/workflows/ci.yml'
            harmony:
              - 'clients/harmony/**'
            tv-web:
              - 'clients/tv-web/**'

  # ---------------------------------------------------------------------
  # Backend (Rust workspace under backend/)
  # ---------------------------------------------------------------------
  backend-check:
    name: Backend checks (fmt, clippy, test, deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      # No debuginfo for dev/test builds: shorter compile + link and a much
      # smaller rust-cache archive to save/restore.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # The cluster runner image has no C toolchain, so linking and build
      # scripts (openssl-sys, libsqlite3-sys) fail with "linker `cc` not found".
      - name: Ensure C toolchain
        run: |
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential pkg-config libssl-dev
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          # Persist the partial target dir even when clippy/test fails so the
          # re-run after a fix does not start cold.
          cache-on-failure: true

      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------
  # Android (one project and one universal application)
  # ---------------------------------------------------------------------
  android-check:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      # PR branches may write their own Gradle cache (ephemeral runners start
      # empty; default is read-only off main), so pushes to the same PR reuse
      # the dependency and build-cache entries of the previous run.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Gradle build (all modules)
        working-directory: clients/android
        run: ./gradlew build

  # ---------------------------------------------------------------------
  # iOS validation runs only through the explicit/tag Apple release pipeline
  # in ios-ci.yml. It is a manual release gate, not an automatic PR/main check.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Xbox (clients/xbox -- .NET solution). Only src/Playarr.Core (the
  # portable, netstandard2.0 client core) is checked here: it's buildable
  # with the `dotnet` CLI alone, matching the Justfile's xbox-core-build/
  # xbox-core-test recipes. The UWP application head
  # (src/Playarr.Xbox, TargetPlatformIdentifier=UAP) needs MSBuild, the
  # Windows 10 SDK, and Visual Studio's UWP workload -- it cannot be built
  # with `dotnet` on any OS, so it has no PR-time gate here; see
  # xbox-ci.yml's build-and-package job for that gap.
  # ---------------------------------------------------------------------
  xbox-check:
    name: Xbox core build & test
    needs: changes
    if: needs.changes.outputs.xbox == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/xbox
    steps:
      - uses: actions/checkout@v4

      # The self-hosted runner user cannot write to /usr/share/dotnet, so
      # install the SDK under the per-job temp directory instead.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '8.0.x'

      - name: Put the SDK on PATH
        run: echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('clients/xbox/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet build (Playarr.Core)
        run: dotnet build src/Playarr.Core/Playarr.Core.csproj

      - name: dotnet test (Playarr.Core.Tests)
        run: dotnet test tests/Playarr.Core.Tests/Playarr.Core.Tests.csproj

  # ---------------------------------------------------------------------
  # HarmonyOS (clients/harmony -- native ArkTS/ArkUI HarmonyOS NEXT client).
  # There is no HarmonyOS SDK available in this runner, so this job runs
  # only the two offline tiers: structural/contract validation (Tier 0,
  # scripts/validate.mjs) and the pure-logic core's unit tests (Tier 0b,
  # tools/run-core-tests.mjs), matching the Justfile's harmony-validate /
  # harmony-test recipes. Compiling a real HAP (Tier 1, needs the
  # ~1 GB OpenHarmony SDK) is deliberately NOT gated here -- see the release
  # workflow for that.
  # ---------------------------------------------------------------------
  harmony-check:
    name: HarmonyOS client checks (validate, core tests)
    needs: changes
    if: needs.changes.outputs.harmony == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/harmony
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/harmony/tools/package-lock.json

      - name: Install validation tooling
        run: npm ci --prefix tools

      - name: Validate project structure and contracts
        run: node scripts/validate.mjs

      - name: Run core logic tests
        run: node tools/run-core-tests.mjs

  # ---------------------------------------------------------------------
  # tv-web (pnpm workspace under clients/tv-web -- packages/*, apps/*, web/)
  # ---------------------------------------------------------------------
  tv-web-check:
    name: tv-web lint & typecheck
    needs: changes
    if: needs.changes.outputs.tv-web == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/tv-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web workspace dependencies
        run: pnpm --filter './packages/**' run build

      # These delegate to the workspace root's own scripts (see
      # clients/tv-web/package.json: "lint": "pnpm -r --if-present run
      # lint", "typecheck": "pnpm -r run typecheck"), which is exactly a
      # recursive `pnpm -r lint` / `pnpm -r typecheck` across every package
      # under packages/* and apps/* and web/.
      - name: Lint (recursive)
        run: pnpm run lint

      - name: Typecheck (recursive)
        run: pnpm run typecheck

  # ---------------------------------------------------------------------
  # OpenAPI contract: regenerate the utoipa-derived spec and diff it
  # against the committed copy. Delegates to scripts/openapi-diff-check.sh
  # (owned by the dev-scripts scaffolding) so the regeneration/diff logic
  # has exactly one implementation, used identically by CI and by
  # contributors running it locally.
  # ---------------------------------------------------------------------
  openapi-contract-check:
    name: OpenAPI contract diff
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: playarr-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          # Persist the partial target dir even when clippy/test fails so the
          # re-run after a fix does not start cold.
          cache-on-failure: true

      - name: Regenerate backend/openapi/playarr.yaml and diff
        run: |
          if [ ! -x scripts/openapi-diff-check.sh ] && [ ! -f scripts/openapi-diff-check.sh ]; then
            echo "::error::scripts/openapi-diff-check.sh not found. This script is expected to regenerate the utoipa-derived OpenAPI spec and diff it against the committed backend/openapi/playarr.yaml, exiting non-zero on drift."
            exit 1
          fi
          bash scripts/openapi-diff-check.sh

  # ---------------------------------------------------------------------
  # Terminal aggregator -- see the file header comment for why this is the
  # only job that should be a required status check.
  # ---------------------------------------------------------------------
  ci-required:
    name: ci-required
    needs:
      - changes
      - backend-check
      - android-check
      - xbox-check
      - harmony-check
      - tv-web-check
      - openapi-contract-check
    if: always()
    runs-on: playarr-runners
    steps:
      - name: Verify no required job failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .

          fail=0
          for job in changes backend-check android-check xbox-check harmony-check tv-web-check openapi-contract-check; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "missing"')
            echo "Job '$job' result: $result"
            case "$result" in
              failure|cancelled)
                fail=1
                ;;
              success|skipped)
                ;;
              *)
                echo "::warning::Unexpected result '$result' for job '$job'"
                fail=1
                ;;
            esac
          done

          if [ "$fail" -eq 1 ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi

          echo "All required jobs passed or were skipped (not applicable to this change)."
