# Signed iOS and tvOS TestFlight release, built in this repository on GitHub-hosted macOS
# runners. Runs on an `ios-v*` tag or by manual dispatch. Signing and App Store Connect secrets
# live in the `release-ios` environment (never repository-wide). No signing material is committed.
# After a real (non-dry-run) upload, a final step prepares the App Store Connect draft version:
# it renames the editable draft to the marketing version and attaches the processed build. It only
# prepares a draft; it never submits for review, so publishing stays a manual App Store Connect action.
# A further step adds each build to the EXTERNAL TestFlight groups listed in the repository variable
# TESTFLIGHT_EXTERNAL_GROUP_IDS (comma-separated; App Store Connect cannot auto-distribute to external
# groups) and submits it for beta app review. A dry run only logs what it would do. A failure there is
# reported in the summary and never fails the uploaded build.
name: Apple signed release

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full commit SHA to release (default - the selected ref)
        type: string
        required: false
      marketing_version:
        description: Optional numeric three-part version; defaults to the tag version, or PLAYARR_VERSION_NAME from clients/android/version.properties
        type: string
        required: false
      build_number:
        description: Optional unique Apple-valid build number; defaults to run number and attempt
        type: string
        required: false
      platform:
        description: Platforms to release; choose tvOS to retry its upload without repeating iOS
        required: true
        type: choice
        options:
          - both
          - ios
          - tvos
        default: both
      dry_run:
        description: Sign, archive and export the IPA but stop before the TestFlight upload (validates signing without publishing)
        type: boolean
        required: false
        default: false

  # Called by release.yml after its GitHub Release exists, with the release version and a
  # build number that is higher than any build already in TestFlight.
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ''
      marketing_version:
        type: string
        required: true
      build_number:
        type: string
        required: true
      platform:
        type: string
        required: false
        default: both
      dry_run:
        type: boolean
        required: false
        default: false
    outputs:
      external_distribution:
        description: Markdown list of the external TestFlight group distribution results
        value: ${{ jobs.signed-testflight.outputs.external_distribution }}

permissions:
  contents: read

concurrency:
  group: playarr-apple-release-${{ inputs.source_sha || github.sha }}-${{ inputs.marketing_version || 'tag' }}
  cancel-in-progress: false

jobs:
  signed-testflight:
    name: Sign, export and upload iOS and tvOS to TestFlight
    environment: release-ios
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      external_distribution: ${{ steps.external.outputs.report }}
    steps:
      - name: Validate the request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full 40-character commit SHA.' >&2; exit 2; }
          fi
          platform="${PLATFORM_INPUT:-both}"
          [[ "$platform" == both || "$platform" == ios || "$platform" == tvos ]] || { echo 'platform must be both, ios, or tvos.' >&2; exit 2; }
          echo "RELEASE_PLATFORM=$platform" >> "$GITHUB_ENV"

      - name: Preflight required signing credentials
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_TVOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required release-ios environment secret: $name" >&2; exit 2; fi
          done
          if [[ "$RELEASE_PLATFORM" == both || "$RELEASE_PLATFORM" == ios ]]; then
            [[ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]] || { echo 'Missing required release-ios environment secret: APPLE_PROVISIONING_PROFILE_BASE64' >&2; exit 2; }
          fi
          if [[ "$RELEASE_PLATFORM" == both || "$RELEASE_PLATFORM" == tvos ]]; then
            [[ -n "$APPLE_TVOS_PROVISIONING_PROFILE_BASE64" ]] || { echo 'Missing required release-ios environment secret: APPLE_TVOS_PROVISIONING_PROFILE_BASE64' >&2; exit 2; }
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main
        if: ${{ !inputs.dry_run }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo 'Signed releases require a commit reachable from main.' >&2; exit 2; }

      - name: Confirm both app targets use the shared App Store Connect bundle ID
        run: |
          set -euo pipefail
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER: app.playarr.ios' clients/ios/project.yml
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER: app.playarr.ios' clients/apple-tv/project.yml

      - name: Prepare generated Xcode project and CocoaPods workspace
        run: bash clients/ios/scripts/prepare.sh

      - name: Set validated release version and build number
        env:
          VERSION_INPUT: ${{ inputs.marketing_version }}
          BUILD_INPUT: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          tag_version=''
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then tag_version="${GITHUB_REF_NAME#ios-v}"; fi
          version="${VERSION_INPUT:-$tag_version}"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^PLAYARR_VERSION_NAME=//p' clients/android/version.properties | head -n1 | tr -d '[:space:]')"
            [[ -n "$version" ]] || { echo 'No marketing version given and PLAYARR_VERSION_NAME is missing from clients/android/version.properties.' >&2; exit 2; }
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Marketing version must be numeric major.minor.patch.' >&2; exit 2; }
          build="${BUILD_INPUT:-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          [[ "$build" =~ ^[1-9][0-9]{0,3}(\.[1-9][0-9]?)?$ ]] || { echo 'Build number must have Apple-valid components from 1 through 9999 with an optional .1-.99 suffix.' >&2; exit 2; }
          echo "MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "IOS_ARCHIVE_PATH=$RUNNER_TEMP/Playarr-signed.xcarchive" >> "$GITHUB_ENV"
          echo "IOS_EXPORT_PATH=$RUNNER_TEMP/Playarr-export" >> "$GITHUB_ENV"
          echo "TVOS_ARCHIVE_PATH=$RUNNER_TEMP/PlayarrTV-signed.xcarchive" >> "$GITHUB_ENV"
          echo "TVOS_EXPORT_PATH=$RUNNER_TEMP/PlayarrTV-export" >> "$GITHUB_ENV"

      - name: Sign, export IPA and upload once
        env:
          RELEASE_MODE: ${{ inputs.dry_run && 'export' || 'testflight' }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TVOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_TVOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PLATFORM" == both || "$RELEASE_PLATFORM" == ios ]]; then
            ARCHIVE_PATH="$IOS_ARCHIVE_PATH" EXPORT_PATH="$IOS_EXPORT_PATH" bash clients/ios/scripts/release.sh "$RELEASE_MODE" ios
          fi
          if [[ "$RELEASE_PLATFORM" == both || "$RELEASE_PLATFORM" == tvos ]]; then
            ARCHIVE_PATH="$TVOS_ARCHIVE_PATH" EXPORT_PATH="$TVOS_EXPORT_PATH" bash clients/ios/scripts/release.sh "$RELEASE_MODE" tvos
          fi

      - name: Prepare App Store draft version and attach build
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 40
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'pyjwt>=2.8,<3' 'cryptography>=42'
          "$RUNNER_TEMP/asc-venv/bin/python" clients/ios/scripts/asc_prepare_version.py

      - name: Add the build to the external TestFlight groups
        id: external
        # Also runs after a dry run (read-only, logs the calls it would make) and after a failed draft step.
        # Never fails the job: problems are warnings plus lines in the release summary.
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          TESTFLIGHT_EXTERNAL_GROUP_IDS: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP_IDS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          # Answer export compliance to match ITSAppUsesNonExemptEncryption in both Info.plist files.
          export ENCRYPTION_EXEMPT=true
          for plist in clients/ios/Resources/Info.plist clients/apple-tv/Supporting/Info.plist; do
            /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist" | grep -qx false || ENCRYPTION_EXEMPT=false
          done
          # What to Test: the Google Play release notes for this version, else a generic line.
          notes_file="clients/android/fastlane/metadata/android/en-GB/changelogs/$MARKETING_VERSION.txt"
          WHATS_NEW="$([[ -s "$notes_file" ]] && cat "$notes_file" || true)"
          export WHATS_NEW
          export DISTRIBUTION_SUMMARY="$RUNNER_TEMP/external-distribution.md"
          python3 -m venv "$RUNNER_TEMP/asc-venv-groups" \
            && "$RUNNER_TEMP/asc-venv-groups/bin/pip" install --quiet 'pyjwt>=2.8,<3' 'cryptography>=42' \
            || echo '::warning::Could not install the App Store Connect client dependencies'
          flag=''
          [[ "$DRY_RUN" == true ]] && flag='--plan'
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/asc-venv-groups/bin/python" clients/ios/scripts/asc_distribute_testflight.py $flag \
            || echo '::warning::External TestFlight distribution script failed'
          {
            echo 'report<<EOF_REPORT'
            cat "$DISTRIBUTION_SUMMARY" 2>/dev/null || echo '- WARNING: external TestFlight distribution produced no report'
            echo 'EOF_REPORT'
          } >> "$GITHUB_OUTPUT"
