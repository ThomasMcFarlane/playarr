# Builds the self-contained server image (server binary, Admin web assets,
# ffmpeg/ffprobe) for every commit on main and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/playarr-regional:<first 8 characters of the SHA>.
# The package starts private: make it public once (Package settings > Change
# visibility) so it can be pulled anonymously. Deployment pins are deployment
# values and are never committed to this repository.
name: Regional image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'clients/tv-web/**'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/regional-image.yml'
  workflow_dispatch:

concurrency:
  group: regional-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: playarr-regional

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          set -euo pipefail
          tag="$(git rev-parse --short=8 HEAD)"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$owner/$IMAGE_NAME" >> "$GITHUB_ENV"
          docker build -f infra/docker/backend.Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "ghcr.io/$owner/$IMAGE_NAME:$tag" .

      - name: Verify tools in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ffprobe "$IMAGE:$TAG" -version | head -n 1
          docker run --rm --entrypoint ffmpeg "$IMAGE:$TAG" -version | head -n 1
          docker run --rm --entrypoint /app/playarr-server "$IMAGE:$TAG" --version

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          echo "Pushed \`$IMAGE:$TAG\` (from \`$GITHUB_SHA\`)." >> "$GITHUB_STEP_SUMMARY"
