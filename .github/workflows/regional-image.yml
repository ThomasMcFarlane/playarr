# Builds the self-contained regional server image (server binary, Admin web
# assets, ffmpeg/ffprobe) and pushes it, tagged with the first 8 characters of
# the commit SHA, to the registry named by the repository variable
# REGIONAL_IMAGE_REGISTRY (host[:port], reachable from the runner without
# credentials). Without the variable the job is skipped. Image pins are
# deployment values: roll out by setting regionalInstances.<name>.image in the
# deployment values repository, never in this repository.
name: Regional image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'clients/tv-web/**'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/regional-image.yml'
  workflow_dispatch:

concurrency:
  group: regional-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: playarr-regional
  REGISTRY: ${{ vars.REGIONAL_IMAGE_REGISTRY }}

jobs:
  image:
    name: Build and push
    if: vars.REGIONAL_IMAGE_REGISTRY != ''
    runs-on: playarr-runners
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          tag="$(git rev-parse --short=8 HEAD)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build -f infra/docker/backend.Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$tag" .

      - name: Verify tools in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ffprobe "$IMAGE:$TAG" -version | head -n 1
          docker run --rm --entrypoint ffmpeg "$IMAGE:$TAG" -version | head -n 1
          docker run --rm --entrypoint /app/playarr-server "$IMAGE:$TAG" --version

      - name: Push
        run: |
          docker tag "$IMAGE:$TAG" "$REGISTRY/$IMAGE:$TAG"
          docker push "$REGISTRY/$IMAGE:$TAG"
          {
            echo "Pushed \`playarr-regional:$TAG\` (from \`$GITHUB_SHA\`)."
            echo
            echo "Roll out by setting \`regionalInstances.<instance>.image\` to this tag in the deployment values repository (one instance at a time; never to an older image)."
          } >> "$GITHUB_STEP_SUMMARY"
