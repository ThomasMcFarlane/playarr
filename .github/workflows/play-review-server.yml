name: Deploy Google Play review server

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-google-play-review-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy review.playarr.app
    if: >-
      vars.PLAY_REVIEW_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: playarr-runners
    timeout-minutes: 10
    environment:
      name: google-play-review
      url: https://review.playarr.app
    defaults:
      run:
        working-directory: clients/tv-web/apps/play-review-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate review server
        run: npm test

      - name: Deploy through the Cloudflare API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAY_REVIEW_API_TOKEN }}
          PLAY_REVIEW_USERNAME: ${{ secrets.PLAY_REVIEW_USERNAME }}
          PLAY_REVIEW_PASSWORD: ${{ secrets.PLAY_REVIEW_PASSWORD }}
          PLAY_REVIEW_TOKEN_SIGNING_SECRET: ${{ secrets.PLAY_REVIEW_TOKEN_SIGNING_SECRET }}
        run: node scripts/deploy-cloudflare-api.mjs
