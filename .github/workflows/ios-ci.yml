name: iOS build and release dispatch

on:
  push:
    tags: ['ios-v*']
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'TASKS.md'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full commit SHA for the signed TestFlight release
        type: string
        required: false
      marketing_version:
        description: Numeric three-part marketing version
        type: string
        default: '1.0.0'
        required: false
      build_number:
        description: Optional unique Apple-valid build number (for example 123.1)
        type: string
        required: false

permissions:
  contents: read

jobs:
  dispatch-apple:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios-v'))
    name: Dispatch signed TestFlight release to Apple runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate dispatch credential
        env:
          APPLE_DISPATCH_TOKEN: ${{ secrets.APPLE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$APPLE_DISPATCH_TOKEN" ]]; then
            echo 'APPLE_DISPATCH_TOKEN is required. Install a fine-grained token scoped to actions:write on the Apple release pipeline.' >&2
            exit 2
          fi
      - name: Send immutable build request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APPLE_DISPATCH_TOKEN }}
          script: |
            const tag = context.ref.startsWith('refs/tags/ios-v') ? context.ref.slice('refs/tags/ios-v'.length) : '';
            const inputs = {
              source_repository: context.repo.owner + '/' + context.repo.repo,
              source_sha: context.eventName === 'workflow_dispatch' && context.payload.inputs.source_sha ? context.payload.inputs.source_sha : context.sha,
              marketing_version: context.eventName === 'workflow_dispatch' ? (context.payload.inputs.marketing_version || '1.0.0') : (tag || '1.0.0'),
              build_number: context.eventName === 'workflow_dispatch' ? context.payload.inputs.build_number : ''
            };
            await github.rest.actions.createWorkflowDispatch({
              owner: 'example-org',
              repo: 'REDACTED',
              workflow_id: 'ios-release.yml',
              ref: 'main',
              inputs
            });
