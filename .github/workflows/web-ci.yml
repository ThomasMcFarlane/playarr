name: Deploy Playarr Web

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy playarr.app
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # Job-level (not workflow-level) so skipped runs triggered by cancelled or
    # failed CI never enter the group and displace a queued real deploy.
    concurrency:
      group: deploy-playarr-web-production
      cancel-in-progress: false
    runs-on: playarr-runners
    timeout-minutes: 15
    environment:
      name: production-playarr-web
      url: https://playarr.app
    defaults:
      run:
        working-directory: clients/tv-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client and workspace dependencies
        run: pnpm --filter @playarr-tv/web... run build

      - name: Test web client
        run: pnpm --filter @playarr-tv/web run test

      - name: Bundle Cloudflare Worker
        run: >-
          pnpm --filter @playarr-tv/web exec esbuild worker.js --bundle
          --format=esm --platform=browser --target=es2022 --external:cloudflare:sockets --outfile=dist-worker.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/scripts/deploy-cloudflare-api.mjs
