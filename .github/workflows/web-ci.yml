name: Deploy Playarr Web

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
  # Called by release.yml: deploys the release commit and fails the release if the deploy fails.
  workflow_call:
    inputs:
      dry_run:
        description: 'Build and test the web client but deploy nothing'
        type: boolean
        default: false
    outputs:
      deployed:
        description: 'true when this run deployed the commit, false when the guard skipped it'
        value: ${{ jobs.deploy.outputs.deployed }}
      sha:
        description: 'The commit that was built'
        value: ${{ jobs.deploy.outputs.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy playarr.app
    # The merge train (token mode) lands main without a push event and starts CI with
    # workflow_dispatch, so an upstream CI run triggered by `push` OR `workflow_dispatch` on main
    # of this repository deploys. Branch CI runs the train dispatches have head_branch != main.
    # Called from release.yml, github.event_name is the caller's (workflow_dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # One production deploy at a time, never cancelled mid-flight; the guard
    # steps skip any run whose commit is older than what is live or not main HEAD.
    # Job-level (not workflow-level) so skipped runs triggered by cancelled or
    # failed CI never enter the group and displace a queued real deploy.
    concurrency:
      group: deploy-web-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed || 'false' }}
      sha: ${{ steps.guard_early.outputs.sha }}
    environment:
      name: production-playarr-web
      url: https://playarr.app
    defaults:
      run:
        working-directory: clients/tv-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/tv-web/pnpm-lock.yaml

      - name: Deploy guard (guard_early)
        id: guard_early
        working-directory: .
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          clients/tv-web/web/scripts/deploy-guard.sh
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard_early.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web client and workspace dependencies
        if: steps.guard_early.outputs.deploy == 'true'
        run: pnpm --filter @playarr-tv/web... run build

      - name: Test web client
        if: steps.guard_early.outputs.deploy == 'true'
        run: pnpm --filter @playarr-tv/web run test

      - name: Write build-info.json into the bundle
        if: steps.guard_early.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"sha":"%s","builtAt":"%s","run":"%s"}\n' "$DEPLOY_SHA" "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > web/dist/build-info.json
          cat web/dist/build-info.json

      - name: Bundle Cloudflare Worker
        if: steps.guard_early.outputs.deploy == 'true'
        run: >-
          pnpm --filter @playarr-tv/web exec esbuild worker.js --bundle
          --format=esm --platform=browser --target=es2022 --external:cloudflare:sockets --outfile=dist-worker.mjs

      - name: Deploy guard (guard_final)
        id: guard_final
        if: steps.guard_early.outputs.deploy == 'true'
        working-directory: .
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: clients/tv-web/web/scripts/deploy-guard.sh

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: >-
          steps.guard_early.outputs.deploy == 'true' && steps.guard_final.outputs.deploy == 'true' &&
          !inputs.dry_run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYARR_RELAY_ZONE_ID: ${{ secrets.PLAYARR_RELAY_ZONE_ID }}
        run: |
          node web/scripts/deploy-cloudflare-api.mjs
          echo "deployed=true" >> "$GITHUB_OUTPUT"
