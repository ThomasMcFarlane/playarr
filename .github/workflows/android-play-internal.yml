name: Publish Android to Google Play closed testing

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
    paths:
      - '.github/workflows/android-play-internal.yml'
      - 'clients/android/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without the android-v prefix (e.g. 0.2.14)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-android-play-${{ github.ref }}-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, sign and publish private Play bundle
    runs-on: playarr-runners
    timeout-minutes: 45
    environment: release-android
    defaults:
      run:
        working-directory: clients/android
    env:
      PLAYARR_APPLICATION_ID: app.playarr.mobile
      PLAYARR_PLAY_TRACK: alpha
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#android-v}"
          else
            version="$(sed -n 's/^PLAYARR_VERSION_NAME=//p' version.properties)"
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a semantic version such as 1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( major > 2 || minor > 99 || patch > 99 )); then
            echo "Automatic Play versions support major <= 2 and minor/patch <= 99" >&2
            exit 1
          fi
          base_code=$((major * 10000 + minor * 100 + patch))
          commit_count="$(git rev-list --count HEAD)"
          if (( commit_count >= 100000 )); then
            echo "Android automatic version suffix exhausted" >&2
            exit 1
          fi
          version_code=$((base_code * 100000 + commit_count))
          if (( version_code <= 2017 || version_code > 2100000000 )); then
            echo "Resolved Android versionCode $version_code is outside the usable Play range" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            release_name="${version}-main.${commit_count}"
          else
            release_name="$version"
          fi
          echo "name=$release_name" >> "$GITHUB_OUTPUT"
          echo "notes_version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "keystore_path=${{ runner.temp }}/playarr-android-release.jks" >> "$GITHUB_OUTPUT"
          echo "publisher_path=${{ runner.temp }}/google-play-publisher.json" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release-signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Restore Google Play publisher credential
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_JSON_KEY: ${{ steps.version.outputs.publisher_path }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Google Play publisher credential is not configured" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$GOOGLE_PLAY_JSON_KEY"
          chmod 600 "$GOOGLE_PLAY_JSON_KEY"
          node -e 'const credential = JSON.parse(require("node:fs").readFileSync(process.env.GOOGLE_PLAY_JSON_KEY, "utf8")); if (credential.type !== "service_account" || !credential.client_email || !credential.private_key) process.exit(1)'

      - name: Test and build signed app bundle
        env:
          PLAYARR_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAYARR_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
        run: >-
          ./gradlew
          :app:testPlayDebugUnitTest
          :app:bundlePlayRelease

      - name: Verify and package app bundle
        shell: bash
        env:
          EXPECTED_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_PLAY_SIGNING_CERT_SHA256 }}
        run: |
          app_bundle="$(find app/build/outputs/bundle/playRelease -name '*.aab' -type f -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "Signed release app bundle output is missing" >&2
            exit 1
          fi
          jarsigner -verify "$app_bundle"
          actual_fingerprint="$(keytool -printcert -jarfile "$app_bundle" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$expected_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "App bundle signing certificate does not match ANDROID_SIGNING_CERT_SHA256" >&2
            exit 1
          fi
          mkdir -p release
          cp "$app_bundle" release/playarr-android-play.aab
          sha256sum release/playarr-android-play.aab > release/SHA256SUMS-play

      - name: Upload workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: playarr-android-play-${{ steps.version.outputs.name }}
          path: |
            clients/android/release/playarr-android-play.aab
            clients/android/release/SHA256SUMS-play
          if-no-files-found: error

      - name: Publish private closed test and store listing
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ steps.version.outputs.publisher_path }}
          PLAYARR_AAB: release/playarr-android-play.aab
          PLAYARR_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAYARR_VERSION_CODE: ${{ steps.version.outputs.code }}
          PLAYARR_RELEASE_NOTES_VERSION: ${{ steps.version.outputs.notes_version }}
        run: node scripts/publish-google-play.mjs
