name: Feature request
description: Suggest an enhancement for the Playarr Server backend or a Playarr client.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you're trying to
        solve as well as your proposed solution -- the "why" helps us evaluate
        trade-offs even if the exact implementation changes.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of Playarr Server is this feature request about?
      options:
        - Backend (Rust/Axum API)
        - Playarr Android (mobile)
        - Playarr Android (TV)
        - Playarr iOS
        - Playarr Web
        - Playarr TV Web (Tizen/webOS/VIDAA)
        - Docs
        - CI/CD / tooling
        - Cross-cutting / multiple clients
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and what's stopping you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature/change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.

  - type: dropdown
    id: api-impact
    attributes:
      label: Does this require an API/contract change?
      description: >
        If yes, expect the implementing PR to include a regenerated
        backend/openapi/playarr.yaml (see the openapi-contract-check CI job).
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues/discussions and this hasn't already been requested.
          required: true
