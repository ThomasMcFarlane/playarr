<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Install Playarr</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <img src="https://playarr.app/playarr-icon-512.png" alt="Playarr" width="160" height="160">
      <p class="eyebrow">Playarr for VIDAA</p>
      <h1>Install Playarr</h1>
      <p>This experimental installer adds one Playarr launcher tile to this television.</p>
      <p class="warning">Only continue on a television you own. Restart the television after installation.</p>
      <button id="install" type="button">Install Playarr</button>
      <p id="status" role="status" aria-live="polite">Press Install Playarr to begin.</p>
    </main>
    <script src="/installer.js"></script>
  </body>
</html>
