# ==============================================================================
# Playarr Server -- minimal standalone stack: just the playarr binary, SQLite,
# and nothing else.
#
# For testing/using Playarr Server against *arr apps (Sonarr/Radarr/Lidarr/
# Bazarr/Prowlarr/Readarr) and Tdarr you already run elsewhere -- on your
# LAN, on another host, wherever -- rather than spinning up a second,
# redundant *arr suite just to exercise this one service. This is a
# minimal containerized install (SQLite, single node, zero other services)
# rather than the multi-service docker-compose.dev.yml. Playarr is SQLite-only
# (ADR 0002); multi-node deployments use peer sync.
#
# SQLite state persists in the named volume below across restarts.
# Registering your existing *arr instances is done through the running
# server's own admin API (POST /api/v1/admin/source-instances) once it's
# up -- there is no separate seeding step for this file, unlike
# docker-compose.dev.yml (see scripts/dev-seed.sh, which is *arr-onboarding
# for a *docker-local* stack and doesn't apply here).
#
# Usage:
#   docker compose -f infra/docker/docker-compose.standalone.yml up -d --build
#   docker compose -f infra/docker/docker-compose.standalone.yml logs -f
# ==============================================================================

services:
  playarr:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: playarr:standalone
    container_name: playarr-standalone
    environment:
      PLAYARR_ROLE: all
      # SQLite, persisted via the named volume below, not /tmp, so it
      # survives `docker compose restart`.
      DATABASE_URL: sqlite:///data/playarr.db
      PLAYARR_ARTWORK_CACHE_DIR: /data/cache/artwork
      PLAYARR_LOG: ${PLAYARR_LOG:-info,playarr_api=debug}
      PLAYARR_HTTP_BIND_ADDR: 0.0.0.0:8484
      PLAYARR_METRICS_BIND_ADDR: 0.0.0.0:9090
      # Unset means playarr-bin generates a boot-lifetime JWT secret and
      # logs a warning (backend/src/main.rs's jwt_secret_from_env) -- fine
      # for a local test, tokens just won't survive a container restart.
      # Set explicitly if you want sessions to persist across restarts.
      PLAYARR_JWT_SECRET: ${PLAYARR_JWT_SECRET:-}
      # Empty by default (falls back to backend/src/main.rs's RFC1918 +
      # loopback DEFAULT_TRUSTED_NETWORK_CIDRS). Set in a local, gitignored
      # infra/docker/.env (never committed -- this is genuinely
      # environment-specific, not a project default) if Docker's published
      # port sees an unexpected source IP for your own local traffic --
      # e.g. an active host VPN/tunnel can make Docker Desktop present the
      # tunnel's egress IP instead of a loopback/private address even for
      # localhost-forwarded connections. Replaces the whole default list
      # with this one CIDR, so it should describe your actual trusted
      # network, not just add to the defaults.
      PLAYARR_TRUSTED_NETWORK_CIDR: ${PLAYARR_TRUSTED_NETWORK_CIDR:-}
      # Deliberately NOT set: TDARR_URL/TDARR_API_KEY (no Tdarr in this
      # stack -- background dispatch simply has nothing to dispatch to,
      # which is fine; on-demand transcode doesn't depend on Tdarr at all,
      # see playarr-transcode's own docs).
    ports:
      - "8484:8484"
      - "9090:9090"
    volumes:
      - playarr_standalone_data:/data
    restart: unless-stopped

volumes:
  playarr_standalone_data:
