# ==============================================================================
# Playarr Server -- reference production stack (docker-compose native).
#
# One Playarr server (API and background workers in one process, SQLite on a
# named volume) behind a Caddy reverse proxy. Playarr is SQLite-only (ADR
# 0002): there is no database server and no shared cache to run, and a
# multi-node deployment is several independent nodes, each with its own
# SQLite database, that synchronise through peer sync (see
# docs/architecture/distributed-design.md), not several replicas against one
# database. It mirrors the Helm chart's contract (env var names, /healthz +
# /readyz, non-root uid 10001, read-only root filesystem) so operating
# knowledge transfers between the two -- see infra/docker/README.md.
#
#   docker compose -f docker-compose.prod.yml up -d
#     -> playarr (role all) + caddy.
#
# The JWT secret is never defaulted to a real value below: `${VAR:?...}`
# fails loudly if unset rather than silently starting with a weak or blank
# credential. Provide it via a `.env` file (untracked; see .gitignore) or
# your orchestrator's secret injection.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.prod.yml build
#   docker compose -f infra/docker/docker-compose.prod.yml up -d
# ==============================================================================

x-playarr-image: &playarr-image
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  image: ${PLAYARR_IMAGE:-ghcr.io/playarr/playarr}:${PLAYARR_IMAGE_TAG:-0.1.0}
  pull_policy: build

services:
  playarr:
    <<: *playarr-image
    # `serve` takes no CLI arguments (see backend/src/main.rs); this matches
    # the image's own default CMD.
    command: ["serve"]
    environment:
      # The real env vars playarr-config::Config::from_env reads (see
      # backend/crates/playarr-config/src/lib.rs).
      PLAYARR_ROLE: all
      PLAYARR_LOG: ${PLAYARR_LOG_LEVEL:-info}
      PLAYARR_HTTP_BIND_ADDR: 0.0.0.0:8484
      PLAYARR_METRICS_BIND_ADDR: 0.0.0.0:9090
      DATABASE_URL: sqlite:///data/playarr.db
      PLAYARR_ARTWORK_CACHE_DIR: /data/playarr-cache/artwork
      PLAYARR_JWT_SECRET: ${PLAYARR_JWT_SECRET:?Set PLAYARR_JWT_SECRET (e.g. in a .env file) before starting the prod stack}
    # Mirrors the Helm chart's podSecurityContext/securityContext as closely
    # as a single-host container runtime allows: non-root (the image already
    # runs as uid/gid 10001 -- see backend.Dockerfile), read-only root
    # filesystem with only /tmp and /data writable, no new privileges.
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    expose:
      - "8484"
      - "9090"
    volumes:
      # The SQLite database file and the artwork cache.
      - playarr_prod_data:/data
    networks:
      - playarr-net

  # Reverse proxy / public edge. Only this service publishes host ports;
  # everything else is internal-network-only. See ./prod/Caddyfile.
  caddy:
    image: caddy:2-alpine
    environment:
      PLAYARR_DOMAIN: ${PLAYARR_DOMAIN:-localhost}
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - playarr
    restart: unless-stopped
    networks:
      - playarr-net
      - playarr-edge

networks:
  # Shared with docker-compose.dev.yml / docker-compose.ci.yml's network
  # name on purpose: ../observability/docker-compose.yml joins this exact
  # network (as `external: true`) to scrape playarr:9090 regardless of which
  # base stack is running.
  playarr-net:
    name: playarr-net
  # Only Caddy sits on this one; it's what actually gets a published host
  # port. Kept separate from playarr-net so a compromised edge container
  # gets no more network visibility than it needs (defence in depth, not a
  # hard boundary -- Caddy is on both networks because it must reach
  # playarr).
  playarr-edge:
    name: playarr-edge

volumes:
  caddy_data:
  caddy_config:
  playarr_prod_data:
