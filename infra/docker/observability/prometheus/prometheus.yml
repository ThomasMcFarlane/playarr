# Prometheus scrape config for the Playarr Server observability overlay.
#
# Static target lists below cover every service name any base compose file
# in ../ (dev/ci/prod) might expose a `playarr*` container under. A
# target simply reports "down" if the corresponding base stack isn't the
# one currently running -- that's expected and harmless, not a
# misconfiguration. See ../docker-compose.yml for how this overlay joins
# whichever base stack's network is active.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: playarr

scrape_configs:
  # Prometheus scraping itself -- standard practice, lets you alert on/
  # dashboard Prometheus's own health (scrape failures, WAL, TSDB size).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every compose stack runs a single `playarr` service (role `all`);
  # Playarr is SQLite-only (ADR 0002).
  - job_name: playarr
    metrics_path: /metrics
    static_configs:
      - targets: ["playarr:9090"]
        labels:
          role: all

  # --------------------------------------------------------------------
  # For a longer-lived deployment (especially a longer-lived stack, Docker Swarm/service discovery is a better fit than a
  # hand-maintained static list. Once this stack runs under Swarm (or with
  # a discovery-capable runtime), replace the `playarr` job above with:
  #
  # - job_name: playarr-sd
  #   docker_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       filters:
  #         - name: label
  #           values: ["com.docker.compose.project=playarr"]
  #   relabel_configs:
  #     - source_labels: [__meta_docker_container_label_com_docker_compose_service]
  #       target_label: service
  #     - source_labels: [__meta_docker_container_name]
  #       target_label: container
  # --------------------------------------------------------------------
