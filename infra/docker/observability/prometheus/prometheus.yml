# Prometheus scrape config for the Streamarr observability overlay.
#
# Static target lists below cover every service name any base compose file
# in ../ (dev/ci/prod) might expose a `streamarr*` container under. A
# target simply reports "down" if the corresponding base stack isn't the
# one currently running -- that's expected and harmless, not a
# misconfiguration. See ../docker-compose.yml for how this overlay joins
# whichever base stack's network is active.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: streamarr

scrape_configs:
  # Prometheus scraping itself -- standard practice, lets you alert on/
  # dashboard Prometheus's own health (scrape failures, WAL, TSDB size).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # docker-compose.ci.yml: single `streamarr` service (STANDALONE role).
  # docker-compose.prod.yml: role-split `streamarr-api`/`streamarr-worker`
  # (plus their `-2` --profile ha counterparts).
  - job_name: streamarr
    metrics_path: /metrics
    static_configs:
      - targets: ["streamarr:9090"]
        labels:
          role: standalone
      - targets: ["streamarr-api:9090"]
        labels:
          role: api
      - targets: ["streamarr-api-2:9090"]
        labels:
          role: api
      - targets: ["streamarr-worker:9090"]
        labels:
          role: worker
      - targets: ["streamarr-worker-2:9090"]
        labels:
          role: worker

  # --------------------------------------------------------------------
  # For a longer-lived deployment (especially docker-compose.prod.yml with
  # --profile ha, where replica *count* -- not just the fixed `-2` node --
  # can change), Docker Swarm/service discovery is a better fit than a
  # hand-maintained static list. Once this stack runs under Swarm (or with
  # a discovery-capable runtime), replace the `streamarr` job above with:
  #
  # - job_name: streamarr-sd
  #   docker_sd_configs:
  #     - host: unix:///var/run/docker.sock
  #       filters:
  #         - name: label
  #           values: ["com.docker.compose.project=streamarr"]
  #   relabel_configs:
  #     - source_labels: [__meta_docker_container_label_com_docker_compose_service]
  #       target_label: service
  #     - source_labels: [__meta_docker_container_name]
  #       target_label: container
  # --------------------------------------------------------------------
