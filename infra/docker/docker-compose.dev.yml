# ==============================================================================
# Streamarr -- local dev stack (Tier 2: docker-compose, per
# docs/architecture/adr/0001-storage-engine.md's tier table).
#
# Now that backend/ builds a real `streamarr` binary, this file runs it too
# (service `streamarr`, built from backend.Dockerfile), alongside Postgres +
# the *arr apps + Tdarr as supervised sibling containers. `STREAMARR_ROLE`
# is set to `all` (API + worker in one process) -- the right default for a
# single-node dev stack; see backend/crates/streamarr-config's docs for the
# full `all`/`api`/`worker` role contract.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   docker compose -f infra/docker/docker-compose.dev.yml down
#
# All *arr apps + Tdarr share a single `/data` volume (media_dev) mounted
# at the SAME container path in every service. This is the TRaSH-guides
# hardlink-friendly layout: Sonarr/Radarr/Lidarr/Readarr can hardlink a
# completed download directly into the library directory (instead of a
# slow cross-filesystem copy) only when both paths resolve inside the same
# mounted volume.
# ==============================================================================

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

services:
  postgres:
    image: postgres:16-alpine
    container_name: streamarr-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamarr}
      POSTGRES_USER: ${POSTGRES_USER:-streamarr}
      # Dev-only default password for a Postgres instance that is not
      # reachable outside this compose network unless you also publish
      # the port to a non-loopback interface. Override via a .env file
      # for anything beyond a throwaway local checkout.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamarr_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamarr} -d ${POSTGRES_DB:-streamarr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streamarr-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: streamarr-dev-sonarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - sonarr_dev_config:/config
      - media_dev:/data
    ports:
      - "8989:8989"
    networks:
      - streamarr-net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: streamarr-dev-radarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - radarr_dev_config:/config
      - media_dev:/data
    ports:
      - "7878:7878"
    networks:
      - streamarr-net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: streamarr-dev-lidarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - lidarr_dev_config:/config
      - media_dev:/data
    ports:
      - "8686:8686"
    networks:
      - streamarr-net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: streamarr-dev-bazarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - bazarr_dev_config:/config
      - media_dev:/data
    ports:
      - "6767:6767"
    networks:
      - streamarr-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: streamarr-dev-prowlarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - prowlarr_dev_config:/config
    ports:
      - "9696:9696"
    networks:
      - streamarr-net

  readarr:
    # Readarr has no LSIO "stable" tag as of this writing -- `develop` is
    # the tag LinuxServer actively publishes and is what upstream Readarr
    # itself recommends until a stable release cuts. Pin to a specific
    # digest/tag once one exists if you need reproducibility beyond "dev
    # stack, latest develop build".
    image: lscr.io/linuxserver/readarr:develop
    container_name: streamarr-dev-readarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
    volumes:
      - readarr_dev_config:/config
      - media_dev:/data
    ports:
      - "8787:8787"
    networks:
      - streamarr-net

  tdarr:
    image: haveagitgat/tdarr:latest
    container_name: streamarr-dev-tdarr
    restart: unless-stopped
    environment:
      <<: *linuxserver-env
      UMASK_SET: "002"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "6"
      nodeName: "streamarr-dev-tdarr-internal"
    volumes:
      - tdarr_dev_server:/app/server
      - tdarr_dev_configs:/app/configs
      - tdarr_dev_logs:/app/logs
      - media_dev:/data
    ports:
      - "8265:8265"
      - "8266:8266"
    networks:
      - streamarr-net

  # The real backend binary (`backend/`, package `streamarr-bin`), built
  # from infra/docker/backend.Dockerfile. `STREAMARR_ROLE=all` runs both
  # the Axum API router and the worker-side loops (arr-sync reconciliation,
  # Tdarr dispatch) in this one process -- see
  # backend/crates/streamarr-config's `Role` docs.
  streamarr:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: streamarr:dev
    container_name: streamarr-dev-streamarr
    environment:
      STREAMARR_ROLE: all
      # Real env vars streamarr-config::Config::from_env reads -- see that
      # crate's docs for the full list/defaults. Matches the postgres
      # service's own credentials above rather than hardcoding a second
      # copy of them.
      DATABASE_URL: postgres://${POSTGRES_USER:-streamarr}:${POSTGRES_PASSWORD:-streamarr_dev_only}@postgres:5432/${POSTGRES_DB:-streamarr}
      STREAMARR_LOG: ${STREAMARR_LOG:-info,streamarr_api=debug}
      STREAMARR_HTTP_BIND_ADDR: 0.0.0.0:8080
      STREAMARR_METRICS_BIND_ADDR: 0.0.0.0:9090
      # Dev-only: unset means streamarr-bin generates a boot-lifetime JWT
      # secret and logs a warning (see backend/src/main.rs's
      # jwt_secret_from_env) -- fine here, tokens just won't survive a
      # container restart. Set explicitly for anything beyond a throwaway
      # local stack.
      STREAMARR_JWT_SECRET: ${STREAMARR_JWT_SECRET:-}
      # Real: the worker role's Tdarr dispatch loop (backend/src/main.rs's
      # boot_worker) reads these two directly and only starts that loop
      # when TDARR_URL is set.
      TDARR_URL: http://tdarr:8265
      TDARR_API_KEY: ${TDARR_API_KEY:-}
      # NOTE: there is no SourceInstance persistence/admin API yet (see
      # streamarr_api::SourceInstanceRegistry's doc comment) -- nothing in
      # the backend currently reads *arr connection info from the
      # environment, so the running server won't auto-discover the
      # services below. These are recorded here as the addresses a future
      # admin-configuration pass should point at, not as a contract the
      # binary already honors.
      SONARR_URL: http://sonarr:8989
      RADARR_URL: http://radarr:7878
      LIDARR_URL: http://lidarr:8686
      BAZARR_URL: http://bazarr:6767
      PROWLARR_URL: http://prowlarr:9696
      READARR_URL: http://readarr:8787
    depends_on:
      postgres:
        condition: service_healthy
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
      lidarr:
        condition: service_started
      bazarr:
        condition: service_started
      prowlarr:
        condition: service_started
      readarr:
        condition: service_started
      tdarr:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"
    networks:
      - streamarr-net

networks:
  streamarr-net:
    name: streamarr-net

volumes:
  postgres_dev_data:
  sonarr_dev_config:
  radarr_dev_config:
  lidarr_dev_config:
  bazarr_dev_config:
  prowlarr_dev_config:
  readarr_dev_config:
  tdarr_dev_server:
  tdarr_dev_configs:
  tdarr_dev_logs:
  media_dev:
