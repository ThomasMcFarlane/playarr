{{/*
Secret placeholder for DATABASE_URL / REDIS_URL.

This template only renders when secret.create=true, which is intended for
local/dev use (e.g. `helm install --set secret.create=true --set
secret.data.databaseUrl=postgres://...`). For staging/prod, leave
secret.create=false and pre-provision a Secret named `streamarr.secretName`
out-of-band (External Secrets Operator, Sealed Secrets, `kubectl create
secret generic`, etc.) - both Deployments reference that name via
secretKeyRef regardless of whether this template created it.
*/}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamarr.secretName" . }}
  labels:
    {{- include "streamarr.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.data.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secret.data.redisUrl | quote }}
{{- end }}
