image:
  repository: ghcr.io/thomasmcfarlane/playarr-backend
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

existingSecret: playarr-runtime

config:
  PLAYARR_ROLE: all
  PLAYARR_LOG: info
  PLAYARR_HTTP_BIND_ADDR: 0.0.0.0:8484
  PLAYARR_METRICS_BIND_ADDR: 0.0.0.0:9090

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8484
  metricsPort: 9090

route:
  enabled: false
  hostname: playarr.example.invalid

persistence:
  enabled: false
  existingClaim: ""
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  local:
    create: false
    volumeName: ""
    path: ""
    nodeHostname: ""
    storageClassName: playarr-local
    size: 10Gi

media:
  enabled: false
  hostPath: ""
  mountPath: /media
  readOnly: true

runtime:
  enabled: false
  hostPath: ""
  mountPath: /opt/streamarr
  readOnly: true

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  livenessPath: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

terminationGracePeriodSeconds: 60
nodeSelector: {}
affinity: {}
tolerations: []
extraVolumes: []
extraVolumeMounts: []
