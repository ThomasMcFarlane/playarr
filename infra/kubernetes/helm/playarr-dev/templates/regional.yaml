{{- range $name, $instance := .Values.regionalInstances }}
{{- $tls := $instance.tls | default dict }}
{{- $tlsOn := not (empty $tls.hostnames) }}
{{- $acme := $instance.acme | default dict }}
{{- $acmeOn := $acme.enabled | default false }}
{{- /* The pod speaks HTTPS when either a static (cert-manager) certificate or the relay ACME certificate is configured. */}}
{{- $httpsOn := or $tlsOn $acmeOn }}
{{- $backup := $instance.backup | default dict }}
{{- $backupOn := $backup.enabled | default false }}
{{- if and $acmeOn (not $instance.hostExposure) }}
{{- fail (printf "regionalInstances.%s.acme.enabled requires hostExposure (the relay registers its public address)" $name) }}
{{- end }}
{{- if $tlsOn }}
---
# cert-manager issues the certificate (DNS-01) into a Secret that the pod
# mounts. The sync-wave puts it ahead of the Deployment; the Secret volume is
# not optional, so the pod also waits in ContainerCreating until it exists.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: {{ $name }}-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ $tls.issuer | default "letsencrypt-prod" }}
  dnsNames:
    {{- range $tls.hostnames }}
    - {{ . | quote }}
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- if $instance.persistence.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $instance.persistence.claimName }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $instance.persistence.size }}
  storageClassName: {{ $instance.persistence.storageClassName }}
  volumeMode: Filesystem
  volumeName: {{ $instance.persistence.volumeName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $instance.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: playarr-standalone
      app.kubernetes.io/instance: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playarr-standalone
        app.kubernetes.io/instance: {{ $name }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: {{ $instance.nodeName }}
      securityContext:
        {{- toYaml $instance.podSecurityContext | nindent 8 }}
      containers:
        - name: playarr
          image: {{ $instance.image | quote }}
          imagePullPolicy: {{ $instance.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          env:
            - name: PLAYARR_HTTP_BIND_ADDR
              value: 0.0.0.0:8484
            - name: PLAYARR_LOG
              value: info
            - name: PLAYARR_METRICS_BIND_ADDR
              value: 0.0.0.0:9090
            - name: PLAYARR_ROLE
              value: all
            - name: PLAYARR_THUMBNAIL_CONCURRENCY
              value: {{ $instance.thumbnailConcurrency | quote }}
            # The image bakes in the Admin UI; overrides the legacy hostPath
            # value (/opt/streamarr/web) that the runtime Secret still carries.
            - name: PLAYARR_WEB_ASSETS_DIR
              value: /app/web
            {{- if $backupOn }}
            # Encrypted server backups (docs/architecture/server-backups.md).
            # Only the age PUBLIC key is configured here; the recovery
            # identity is held offline by the administrator, never in Git or
            # in the cluster Secret that this pod reads.
            - name: PLAYARR_BACKUP_DIR
              value: {{ $backup.dir | quote }}
            - name: PLAYARR_BACKUP_RECIPIENTS
              value: {{ join "," $backup.recipients | quote }}
            - name: PLAYARR_BACKUP_MODE
              value: {{ $backup.mode | default "full" | quote }}
            - name: PLAYARR_BACKUP_INTERVAL_HOURS
              value: {{ $backup.intervalHours | default 24 | quote }}
            - name: PLAYARR_BACKUP_KEEP_LAST
              value: {{ $backup.keepLast | default 7 | quote }}
            - name: PLAYARR_BACKUP_KEEP_DAYS
              value: {{ $backup.keepDays | default 30 | quote }}
            - name: PLAYARR_BACKUP_MAX_ASSET_MIB
              value: {{ $backup.maxAssetMiB | default 4096 | quote }}
            {{- end }}
            {{- if $tlsOn }}
            - name: PLAYARR_TLS_CERT_PATH
              value: /tls/tls.crt
            - name: PLAYARR_TLS_KEY_PATH
              value: /tls/tls.key
            {{- end }}
            {{- if $acmeOn }}
            # Relay certificate (v4-* name) via ACME DNS-01 through the
            # playarr.app Worker: no port 80 and no DNS server in the cluster.
            # When a static certificate is also mounted, the server presents
            # whichever certificate matches the TLS SNI name.
            - name: PLAYARR_ACME_DOMAIN
              value: {{ $acme.domain | quote }}
            - name: PLAYARR_ACME_ENVIRONMENT
              value: {{ $acme.environment | quote }}
            - name: PLAYARR_ACME_ACCEPT_TERMS
              value: {{ $acme.acceptTerms | quote }}
            - name: PLAYARR_ACME_CACHE_DIR
              value: {{ $acme.cacheDir | quote }}
            - name: PLAYARR_ACME_CHALLENGE
              value: relay-dns-01
            - name: PLAYARR_RELAY_REGISTER
              value: "true"
            - name: PLAYARR_PUBLIC_IPV4
              value: {{ $instance.hostExposure.hostIP | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $instance.secretName }}
          ports:
            - name: http
              containerPort: 8484
              {{- with $instance.hostExposure }}
              hostIP: {{ .hostIP | quote }}
              hostPort: {{ .hostPort }}
              {{- end }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- if and $acmeOn (not $tlsOn) }}
          # Without a static certificate the listener speaks plain HTTP until
          # the first relay certificate is issued (registration, DNS-01 and
          # Let's Encrypt validation take a minute or two), so the HTTPS probe
          # fails. Allow five minutes before the liveness probe may act.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
            successThreshold: 1
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ if $httpsOn }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ if $httpsOn }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          resources:
            {{- toYaml $instance.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /data
            - name: media
              mountPath: /srv/media
              readOnly: true
            {{- if $tlsOn }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $instance.persistence.claimName }}
        - name: media
          hostPath:
            path: {{ $instance.mediaPath }}
            type: Directory
        {{- if $tlsOn }}
        - name: tls
          secret:
            secretName: {{ $name }}-tls
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: playarr-standalone
    app.kubernetes.io/instance: {{ $name }}
  ports:
    {{- if $httpsOn }}
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
    {{- else }}
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    {{- end }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: getambassador.io/v2
kind: Mapping
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  ambassador_id:
    - --apiVersion-v3alpha1-only--default
  host: {{ $instance.routeHost | quote }}
  prefix: /
  {{- if $httpsOn }}
  # The pod terminates TLS itself; the https:// scheme makes Emissary originate
  # TLS to it. Without a TLSContext Emissary does not verify the upstream
  # certificate, so the public hostnames need not match routeHost.
  service: {{ printf "https://%s.%s:443" $name $.Release.Namespace | quote }}
  {{- else }}
  service: {{ printf "%s.%s:80" $name $.Release.Namespace | quote }}
  {{- end }}
  allow_upgrade:
    - websocket
  idle_timeout_ms: 3600000
  timeout_ms: 0
{{- end }}
