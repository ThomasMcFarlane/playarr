{{- range $name, $instance := .Values.regionalInstances }}
{{- $tls := $instance.tls | default dict }}
{{- $tlsOn := not (empty $tls.hostnames) }}
{{- if $tlsOn }}
---
# cert-manager issues the certificate (DNS-01) into a Secret that the pod
# mounts. The sync-wave puts it ahead of the Deployment; the Secret volume is
# not optional, so the pod also waits in ContainerCreating until it exists.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: {{ $name }}-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ $tls.issuer | default "letsencrypt-prod" }}
  dnsNames:
    {{- range $tls.hostnames }}
    - {{ . | quote }}
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- if $instance.persistence.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $instance.persistence.claimName }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $instance.persistence.size }}
  storageClassName: {{ $instance.persistence.storageClassName }}
  volumeMode: Filesystem
  volumeName: {{ $instance.persistence.volumeName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $instance.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: playarr-standalone
      app.kubernetes.io/instance: {{ $name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playarr-standalone
        app.kubernetes.io/instance: {{ $name }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: {{ $instance.nodeName }}
      securityContext:
        {{- toYaml $instance.podSecurityContext | nindent 8 }}
      containers:
        - name: playarr
          image: {{ $instance.image | quote }}
          imagePullPolicy: {{ $instance.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          env:
            - name: PLAYARR_HTTP_BIND_ADDR
              value: 0.0.0.0:8484
            - name: PLAYARR_LOG
              value: info
            - name: PLAYARR_METRICS_BIND_ADDR
              value: 0.0.0.0:9090
            - name: PLAYARR_ROLE
              value: all
            {{- if $tlsOn }}
            - name: PLAYARR_TLS_CERT_PATH
              value: /tls/tls.crt
            - name: PLAYARR_TLS_KEY_PATH
              value: /tls/tls.key
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $instance.secretName }}
          ports:
            - name: http
              containerPort: 8484
              {{- with $instance.hostExposure }}
              hostIP: {{ .hostIP | quote }}
              hostPort: {{ .hostPort }}
              {{- end }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ if $tlsOn }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ if $tlsOn }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /data
            - name: media
              mountPath: /srv/media
              readOnly: true
            - name: runtime
              mountPath: /opt/streamarr
              readOnly: true
            {{- if $tlsOn }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: {{ $instance.persistence.claimName }}
        - name: media
          hostPath:
            path: {{ $instance.mediaPath }}
            type: Directory
        - name: runtime
          hostPath:
            path: {{ $instance.runtimePath }}
            type: Directory
        {{- if $tlsOn }}
        - name: tls
          secret:
            secretName: {{ $name }}-tls
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: playarr-standalone
    app.kubernetes.io/instance: {{ $name }}
  ports:
    {{- if $tlsOn }}
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
    {{- else }}
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    {{- end }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: getambassador.io/v2
kind: Mapping
metadata:
  name: {{ $name }}
  labels:
    {{- include "playarr-dev.regionalLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  ambassador_id:
    - --apiVersion-v3alpha1-only--default
  host: {{ $instance.routeHost | quote }}
  prefix: /
  {{- if $tlsOn }}
  # The pod terminates TLS itself; the https:// scheme makes Emissary originate
  # TLS to it. Without a TLSContext Emissary does not verify the upstream
  # certificate, so the public hostnames need not match routeHost.
  service: {{ printf "https://%s.%s:443" $name $.Release.Namespace | quote }}
  {{- else }}
  service: {{ printf "%s.%s:80" $name $.Release.Namespace | quote }}
  {{- end }}
  allow_upgrade:
    - websocket
  idle_timeout_ms: 3600000
  timeout_ms: 0
{{- end }}
