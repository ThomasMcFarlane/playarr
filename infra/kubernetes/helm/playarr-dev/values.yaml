# The defaults reproduce the four Playarr workloads currently running in the
# dev-host dev namespace. All Kubernetes references are release-namespace relative.
workloadNodeSelector:
  kubernetes.io/hostname: dev-node

workloads:
  playarr:
    image: localhost:5000/playarr:ac6fcf2
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    command:
      - node
      - node_modules/vite/bin/vite.js
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    env:
      - name: HOME
        value: /tmp
    workingDir: /repo/clients/tv-web/web
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    hostPathVolumes:
      - name: repo
        path: /path/to/playarr
        type: Directory
        mounts:
          - mountPath: /repo
    # playarr.example.com is served by the playarr-region-b regional instance
    # (see regionalInstances below); the dev instance has no direct route.
    routes: []

  playarr-admin:
    image: localhost:5000/tv-web-admin:dev
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    routes:
      - name: playarr-admin-public
        host: playarr-admin.example.com
        hostRewrite: playarr-admin.example.com

  playarr-marketing:
    image: localhost:5000/playarr-marketing:551e3b8
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    probeHost: playarr-marketing.example.com
    hostPathVolumes:
      - name: site-src
        path: /path/to/playarr/site/src
        type: Directory
        mounts:
          - mountPath: /app/src
            readOnly: true
      - name: site-public
        path: /path/to/playarr/site/public
        type: Directory
        mounts:
          - mountPath: /app/public
            readOnly: true
    routes:
      - name: playarr-marketing-public
        host: playarr-marketing.example.com
        hostRewrite: playarr-marketing.example.com

  playarr-nav-perf:
    image: localhost:5000/playarr-nav-perf:609c39f
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    env:
      - name: PLAYARR_DEV_API_PROXY
        value: http://192.0.2.58:8484
    routes:
      - name: playarr-nav-perf-public
        host: playarr-nav-perf.example.com

  tv-web:
    image: localhost:5000/tv-web:b385a61
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    routes:
      - name: tv-web-public
        host: tv-web.example.com
        hostRewrite: tv-web.example.com

  tv-web-webos:
    image: localhost:5000/tv-web:b385a61
    imagePullPolicy: Always
    replicas: 1
    containerPort: 8080
    command:
      - pnpm
      - exec
      - vite
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    workingDir: /build/apps/tv-webos
    routes:
      - name: tv-web-webos
        host: tv-web-webos.example.com

# Regional standalone servers currently deployed in separate namespaces. The
# target release places both in one namespace while preserving their distinct
# node-local state, runtime trees, security identities and public routes.
regionalInstances:
  playarr-region-a:
    image: registry.example.com/playarr-regional:c14c6ae8
    imagePullPolicy: IfNotPresent
    replicas: 1
    nodeName: region-a
    secretName: playarr-region-a-runtime
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    # ffmpeg thumbnail grabs of UHD files take ~0.5-0.8 GiB each; the 2 GiB
    # limit was too small; 4 GiB leaves room for
    # the default concurrency of 2 plus the server itself.
    thumbnailConcurrency: 2
    # In-cluster Service URLs for the *arr apps (media namespace); the public
    # host ports on the node are closed. Prowlarr has no in-cluster Service
    # (only a cloudflared tunnel), so it is intentionally left as registered.
    sourceInstanceUrls:
      radarr: http://radarr.media.svc.cluster.local:7878
      sonarr: http://sonarr.media.svc.cluster.local:8989
      lidarr: http://lidarr.media.svc.cluster.local:8686
      whisparr: http://whisparr.media.svc.cluster.local:6969
      bazarr: http://bazarr.media.svc.cluster.local:6767
      # Dubarr (AI dubbing companion). Together with
      # dubarrApiKeySecret the server creates the "Dubarr" source instance.
      dubarr: http://dubarr.dubarr.svc.cluster.local:8686
    # Secret in this namespace holding the Dubarr API key (copied out of band from
    # Dubarr's own API key Secret; see README, Dubarr).
    dubarrApiKeySecret:
      name: playarr-dubarr
      key: DUBARR_API_KEY
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      create: true
      claimName: playarr-region-a
      volumeName: playarr-region-a-data
      storageClassName: playarr-region-a-local
      size: 10Gi
    mediaPath: /srv/media
    routeHost: playarr-a.example.com
    # Encrypted server backups to the state volume, bounded by retention. Only
    # the age PUBLIC recovery key is stored here; the matching identity is held
    # offline by the administrator (see docs/architecture/server-backups.md).
    backup:
      enabled: true
      dir: /data/backups
      recipients:
        - age1lqvam645epf2neruygeschkr8zmz7pfsm4srcmwhsk36xt8xdlrspmafgz
      mode: full
      intervalHours: 24
      keepLast: 3
      keepDays: 7
      maxAssetMiB: 1024
    # HTTPS on the node's public address (owner-approved public server). The
    # certificate comes from cert-manager (DNS-01) and is hot-reloaded.
    hostExposure:
      hostIP: 203.0.113.10
      hostPort: 8484
    tls:
      issuer: letsencrypt-prod
      hostnames:
        - playarr-a.example.com
    # Public relay certificate (v4-* name) by ACME DNS-01 through the
    # playarr.app Worker. Enabled by the relay cut-over in
    # docs/deployment/playarr-relay.md has been approved and carried out. Needs
    # hostExposure. The static tls certificate above stays the transport for
    # the example.com name; the server picks the certificate by SNI.
    acme:
      enabled: true
      domain: v4-203-0-113-10.relay.playarr.app
      environment: production
      acceptTerms: true
      cacheDir: /data/acme

  playarr-region-b:
    image: registry.example.com/playarr-regional:c14c6ae8
    imagePullPolicy: IfNotPresent
    replicas: 1
    nodeName: region-b
    secretName: playarr-region-b-runtime
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      # Optional extra groups, for example one that may read the media library.
      supplementalGroups:
        - 2000
      seccompProfile:
        type: RuntimeDefault
    # ffmpeg thumbnail grabs of UHD files take ~0.5-0.8 GiB each; the 2 GiB
    # limit was too small; 4 GiB leaves room for
    # the default concurrency of 2 plus the server itself.
    thumbnailConcurrency: 2
    # In-cluster Service URLs for the *arr apps (media namespace); the public
    # host ports on the node are closed. Prowlarr has no in-cluster Service
    # (only a cloudflared tunnel), so it is intentionally left as registered.
    sourceInstanceUrls:
      radarr: http://radarr.media.svc.cluster.local:7878
      sonarr: http://sonarr.media.svc.cluster.local:8989
      lidarr: http://lidarr.media.svc.cluster.local:8686
      whisparr: http://whisparr.media.svc.cluster.local:6969
      bazarr: http://bazarr.media.svc.cluster.local:6767
      # Dubarr (AI dubbing companion). Together with
      # dubarrApiKeySecret the server creates the "Dubarr" source instance.
      dubarr: http://dubarr.dubarr.svc.cluster.local:8686
    # Secret in this namespace holding the Dubarr API key (copied out of band from
    # Dubarr's own API key Secret; see README, Dubarr).
    dubarrApiKeySecret:
      name: playarr-dubarr
      key: DUBARR_API_KEY
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      create: true
      claimName: playarr-region-b
      volumeName: playarr-region-b-data
      storageClassName: playarr-region-b-local
      size: 10Gi
    mediaPath: /srv/media
    routeHost: playarr.example.com
    # Encrypted server backups to the state volume, bounded by retention. Only
    # the age PUBLIC recovery key is stored here; the matching identity is held
    # offline by the administrator (see docs/architecture/server-backups.md).
    backup:
      enabled: true
      dir: /data/backups
      recipients:
        - age1lqvam645epf2neruygeschkr8zmz7pfsm4srcmwhsk36xt8xdlrspmafgz
      mode: full
      intervalHours: 24
      keepLast: 3
      keepDays: 7
      maxAssetMiB: 1024
    # HTTPS on the node's public address (owner-approved public server). The
    # certificate comes from cert-manager (DNS-01) and is hot-reloaded.
    hostExposure:
      hostIP: 203.0.113.20
      hostPort: 8484
    tls:
      issuer: letsencrypt-prod
      hostnames:
        - playarr-b.example.com
    # Public relay certificate (v4-* name) by ACME DNS-01 through the
    # playarr.app Worker. Enabled by the relay cut-over in
    # docs/deployment/playarr-relay.md has been approved and carried out. Needs
    # hostExposure. The static tls certificate above stays the transport for
    # the example.com name; the server picks the certificate by SNI.
    acme:
      enabled: true
      domain: v4-203-0-113-20.relay.playarr.app
      environment: production
      acceptTerms: true
      cacheDir: /data/acme
