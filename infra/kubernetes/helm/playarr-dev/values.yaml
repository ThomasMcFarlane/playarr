# Generic chart with neutral defaults: as shipped it renders nothing.
#
# Every deployment-specific value (instances, hostnames, public addresses,
# hostPaths, node placement, Secret names, image references and pins) is
# supplied by the operator, typically from a GitOps repository through an Argo
# CD multi-source Application (`valueFiles: [$values/...]`). See README.md for
# the value reference and tests/example-values.yaml for a complete worked
# example with placeholder data.

# Node selector applied to every development workload under `workloads`.
workloadNodeSelector: {}

# Development web surfaces (Vite dev servers, admin and marketing previews),
# keyed by workload name. Each renders a Deployment, a Service and optional
# Emissary Mappings. See README.md, "Development workloads".
workloads: {}

# Self-contained regional Playarr servers, keyed by instance name. Each renders
# a Deployment, Services, PV/PVC, optional cert-manager Certificate and an
# Emissary Mapping. See README.md, "Regional instances".
regionalInstances: {}
