{{- $selector := dict "component" "backend" "Release" .Release "Chart" .Chart "Values" .Values -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vidaa-verify.fullname" . }}-backend
  labels:
    {{- include "vidaa-verify.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "vidaa-verify.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vidaa-verify.selectorLabels" $selector | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: {{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.backend.config }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.backend.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8484
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
