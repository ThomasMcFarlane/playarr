{{- if .Values.upstream.enabled }}
apiVersion: getambassador.io/v3alpha1
kind: TLSContext
metadata:
  name: {{ .Values.upstream.tlsContextName }}
  labels:
    {{- include "vidaa-installer.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.upstream.hostname | quote }}
  secret: {{ .Values.upstream.tlsSecretName }}
  sni: {{ .Values.upstream.hostname | quote }}
{{- end }}
