# Default values for the playarr chart.
# This is a YAML-formatted file. Declare variables to be substituted into
# templates/*.

# -- Container image. tag is pinned to Chart.yaml's appVersion and MUST
# never be set to "latest" - GitOps auto-update (see
# ../flux-image-automation.example.yaml) is the sanctioned way to bump this
# value via a PR, not a floating tag resolved at pull time.
image:
  repository: ghcr.io/playarr/playarr
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a ServiceAccount should be created
  create: true
  annotations: {}
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

commonLabels: {}
commonAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Numeric port used for the container's metrics containerPort/Service
# port declarations (k8s port fields need a plain integer; the binary's own
# port config lives in config.PLAYARR_METRICS_BIND_ADDR above -- keep the
# two in sync manually, nothing derives one from the other).
metricsPort: 9090

# -- Probe configuration. The playarr binary exposes these endpoints.
# `port` has the same manual-sync caveat as metricsPort above, against
# config.PLAYARR_HTTP_BIND_ADDR.
probes:
  port: 8484
  livenessPath: /healthz
  readinessPath: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# -- Grace period for the pod as a whole and the preStop sleep used to let
# in-flight requests / jobs drain before SIGTERM is sent. preStopSleepSeconds
# must be comfortably less than terminationGracePeriodSeconds.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 15

# -- Non-secret application configuration, rendered into a ConfigMap and
# consumed via envFrom by the StatefulSet. Keys are the real env vars
# playarr-config::Config::from_env reads (see
# backend/crates/playarr-config/src/lib.rs) -- not a set of
# conveniently-named vars the binary silently ignores. `probes.port` above
# must stay in sync with the port embedded in PLAYARR_HTTP_BIND_ADDR
# below if either changes; nothing derives one from the other.
config:
  PLAYARR_LOG: "info"
  PLAYARR_HTTP_BIND_ADDR: "0.0.0.0:8484"
  PLAYARR_METRICS_BIND_ADDR: "0.0.0.0:9090"

# -- Playarr is SQLite-only (ADR 0002): DATABASE_URL is derived from
# persistence.mountPath (sqlite://<mountPath>/playarr.db) and is not a
# value. The chart renders a single-replica StatefulSet; SQLite does not
# support several pods writing one database. For several nodes, install
# several releases (each with its own volume) and join them with peer sync.
persistence:
  # -- Mount path of the PersistentVolumeClaim holding the SQLite database
  # and the artwork cache.
  mountPath: /data
  size: 10Gi
  # -- Empty uses the cluster default StorageClass.
  storageClassName: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8484

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Optional ServiceMonitor for kube-prometheus-stack users. Requires the
# monitoring.coreos.com/v1 CRDs to already be installed in-cluster.
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}
  additionalLabels: {}
