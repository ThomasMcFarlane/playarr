apiVersion: v2
name: playarr
description: Helm chart for deploying Playarr Server (API and worker) to Kubernetes
type: application

# Chart version: bump on every change to templates/values in this chart.
version: 0.1.0

# appVersion tracks the Playarr Server application release this chart deploys.
# values.yaml's image.tag is pinned to this same version by convention -
# never bump appVersion without also updating values.yaml image.tag, and
# never point either at "latest".
appVersion: "0.1.0"

keywords:
  - playarr
  - media
  - api
  - worker

home: https://github.com/ThomasMcFarlane/playarr
sources:
  - https://github.com/ThomasMcFarlane/playarr

maintainers:
  - name: Playarr Server maintainers
