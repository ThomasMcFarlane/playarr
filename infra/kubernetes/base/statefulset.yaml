# One Playarr server (role `all`) with its SQLite database on a
# PersistentVolumeClaim. Playarr is SQLite-only (ADR 0002): a single replica
# per database. Multi-node deployments run several independent copies of this
# tree (one namespace each) and synchronise through peer sync.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: playarr
  labels:
    app.kubernetes.io/name: playarr
spec:
  replicas: 1
  serviceName: playarr
  selector:
    matchLabels:
      app.kubernetes.io/name: playarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playarr
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: playarr
          image: ghcr.io/playarr/playarr:0.1.0
          env:
            - name: PLAYARR_ROLE
              value: all
            - name: DATABASE_URL
              value: sqlite:///data/playarr.db
            - name: PLAYARR_ARTWORK_CACHE_DIR
              value: /data/cache/artwork
          envFrom:
            - configMapRef:
                name: playarr-config
          ports:
            - name: http
              containerPort: 8484
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
