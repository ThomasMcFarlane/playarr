apiVersion: apps/v1
kind: Deployment
metadata:
  name: playarr-api
  labels:
    app.kubernetes.io/name: playarr
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: playarr
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playarr
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: playarr-api
          image: ghcr.io/playarr/playarr:0.1.0
          env:
            - name: PLAYARR_ROLE
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: playarr-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: playarr-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: playarr-config
          ports:
            - name: http
              containerPort: 8484
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
