apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamarr-worker
  labels:
    app.kubernetes.io/name: streamarr
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamarr
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamarr
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: streamarr-worker
          image: ghcr.io/streamarr/streamarr:0.1.0
          env:
            - name: STREAMARR_ROLE
              value: worker
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamarr-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: streamarr-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: streamarr-config
          ports:
            - name: http
              containerPort: 8484
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8484
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
