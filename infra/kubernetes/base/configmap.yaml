apiVersion: v1
kind: ConfigMap
metadata:
  name: playarr-config
  labels:
    app.kubernetes.io/name: playarr
# Keys are the real env vars playarr-config::Config::from_env reads --
# see backend/crates/playarr-config/src/lib.rs. PLAYARR_HTTP_BIND_ADDR/
# PLAYARR_METRICS_BIND_ADDR are full socket addresses ("host:port"), not
# bare port numbers -- keep them in sync manually with any port numbers
# used elsewhere in this kustomize tree (Service/container port fields).
data:
  PLAYARR_LOG: "info"
  PLAYARR_HTTP_BIND_ADDR: "0.0.0.0:8484"
  PLAYARR_METRICS_BIND_ADDR: "0.0.0.0:9090"
