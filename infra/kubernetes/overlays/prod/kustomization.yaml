apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: playarr-prod

resources:
  - ../../base

configMapGenerator:
  - name: playarr-config
    behavior: merge
    literals:
      - PLAYARR_LOG=warn

# Playarr is SQLite-only (ADR 0002): there is no database secret to manage.
# Image tags in prod are bumped exclusively via the Flux
# ImageUpdateAutomation flow described in
# ../flux-image-automation.example.yaml - never by hand-editing this file
# with a floating tag, and never by anything running inside the cluster.
