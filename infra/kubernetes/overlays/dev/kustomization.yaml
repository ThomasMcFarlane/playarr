apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: playarr-dev

resources:
  - ../../base

# Single replica of each component is enough for dev; keeps the footprint
# (and cost) small on a shared dev cluster.
patches:
  - target:
      kind: Deployment
      name: playarr-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: playarr-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: playarr-config
    behavior: merge
    literals:
      - PLAYARR_LOG=debug

# DATABASE_URL / REDIS_URL for dev: replace base/secret.yaml's empty
# stringData with real values from an untracked, gitignored local file,
# e.g.:
#   secretGenerator:
#     - name: playarr-secrets
#       behavior: replace
#       envs:
#         - playarr-secrets.dev.env   # untracked; not in this repo
# Left commented out here since no such file exists in this scaffold.
