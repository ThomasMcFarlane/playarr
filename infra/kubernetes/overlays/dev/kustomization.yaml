apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: playarr-dev

resources:
  - ../../base

configMapGenerator:
  - name: playarr-config
    behavior: merge
    literals:
      - PLAYARR_LOG=debug

# Playarr is SQLite-only (ADR 0002): there is no database secret to manage.
# The StatefulSet is always a single replica; run one overlay per node and
# join nodes with peer sync.
